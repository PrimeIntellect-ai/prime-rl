# Preparation draft: GLM Air Scaleswe checkpoint / SWE-rebench-V2 (provisional taskset) on 2 train + 4 inference H200 nodes.
# Shared cohort-preserving batching and full seed plumbing still require stage 1.
# Budget stop: 24 allocated hours; max_steps is a guard.
# Set output_dir to the shared filesystem and slurm.partition to the H200 partition.

max_steps = 10000
seq_len = 131072
output_dir = "outputs/ngu-swe"

[run]
name = "glm45air-swe-baseline"

[env_vars]
TRITON_CACHE_DIR = "/tmp/.triton-cache"

[slurm]
job_name = "glm45air-swe-baseline"
partition = "all"

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 2
num_infer_nodes = 1
num_infer_replicas = 4

[monitors.wandb]
project = "swe-ablations"
name = "glm45air-swerebench-baseline"

[weight_broadcast]
type = "nccl"
timeout = 3600

[ckpt]
interval = 50

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[model]
name = "PrimeIntellect/GLM-4.5-Air-Scaleswe"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 4
cp_style = "ulysses"

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "muon"
lr = 1e-6

[trainer.loss]
type = "ipo"
eps = 0.1
adv_tau = 1.0
kl_tau = 0.001

[orchestrator]
batch_size = 256
group_size = 16
max_off_policy_steps = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "swerebench-v2"
env.taskset.id = "swerebench-v2"
env.taskset.dataset_name = "PrimeIntellect/SWE-rebench-V2-Filtered-Verified"
env.taskset.split = "train"
env.agent.harness.id = "bash"

[orchestrator.eval]
interval = 20
num_examples = -1
group_size = 1
skip_first_step = false

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600

[inference]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/.vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/.flashinfer-cache"

[inference.vllm]
seed = 42
gpu_memory_utilization = 0.85
max_model_len = 131072
tensor_parallel_size = 8
enable_expert_parallel = true
enable_return_routed_experts = true
