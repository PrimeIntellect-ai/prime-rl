output_dir = "/home/garrett/fp8wd/runs"
clean = true

[env_vars]
HF_HOME = "/home/huggingface"
PRIME_RL_CHECK_START_WEIGHTS = "1"
PRIME_RL_WEIGHT_DYNAMICS = "1"

[deployment]
type = "single_node"
num_train_gpus = 8

[model]
attn = "flash_attention_3"
ep = 8
offload = "none"

[model.ac]
mode = "full"
freq = 1

[renderer]
name = "qwen3"

[data]
type = "sft"
name = "PrimeIntellect/INTELLECT-3-SFT-10K"
splits = ["math"]
seed = 0
seq_len = 8192
batch_size = 16
micro_batch_size = 1

[optim]
type = "muon"
lr = 1e-5
weight_decay = 0.01

[scheduler]
type = "cosine"
min_lr = 1e-6

[monitors.wandb]
entity = "primeintellect"
project = "fp8-weight-dynamics"
