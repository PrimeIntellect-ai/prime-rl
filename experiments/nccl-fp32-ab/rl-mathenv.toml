max_steps = 20
clean = true

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
# Base Qwen3.5-0.8B, to keep the same fp32-declared tensors (linear_attn.A_log,
# linear_attn.norm.weight) in play. math-env's usual pairing, DeepSeek-R1-Distill-Qwen-1.5B, has
# no keep_in_fp32_for_weight_transfer declaration at all, so it would not exercise this bug.
name = "Qwen/Qwen3.5-0.8B"

[weight_broadcast]
type = "nccl"   # main-filesystem arm overrides this to "filesystem" on the CLI

[slurm]
partition = "all"           # the only partition on this cluster; "cluster" (the default) does not exist
launch_modelexpress = false # ModelExpress/Redis exist for NIXL, pure failure surface here

[monitors.wandb]
project = "prl-nccl-fp32-ab"
group = "ab-4-mathenv"

[orchestrator]
seq_len = 8192
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
# Single continuous generation, not several short multi-turn exchanges like wordle: this is the
# variant that actually stresses many tokens of one uninterrupted recurrence.
max_completion_tokens = 4096

[[orchestrator.train.source]]
name = "hendrycks-math"
env.taskset.id = "math-env"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
# math-verify's LLM-judge fallback ("Prime inference") is disabled: it only affects reward
# correctness, which this experiment does not use, and would otherwise fire on nearly every
# rollout from an untrained base model, adding network calls this experiment doesn't need.
env.taskset.task.judge = "None"

[trainer.model]
seq_len = 16384

[trainer.optim]
# lr = 0 freezes every parameter across all steps (see rl.toml for why this matters).
lr = 0

[inference]

[inference.vllm]
max_model_len = 8192
seed = 0
enforce_eager = true
