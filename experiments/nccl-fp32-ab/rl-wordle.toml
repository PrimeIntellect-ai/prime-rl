max_steps = 20
seq_len = 8192
clean = true

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
# Base Qwen3.5-0.8B, not the wordle-SFT'd "PrimeIntellect/Qwen3-1.7B-Wordle-SFT" model from
# configs/basic/wordle/rl.toml: that checkpoint is plain qwen3 architecture, which declares no
# keep_in_fp32_for_weight_transfer keys at all (see the affected-models table in PLAN.md), so it
# would not exercise this bug. Keeping Qwen3.5-0.8B means play quality will be poor, but the
# textarena game engine drives the turn loop regardless of guess quality ("game-authoritative
# scoring", deps/verifiers/environments/wordle/wordle/taskset.py), which is what this variant
# actually needs: longer, multi-turn completions than reverse-text's single short turn.
name = "Qwen/Qwen3.5-0.8B"

[weight_broadcast]
type = "nccl"   # main-filesystem arm overrides this to "filesystem" on the CLI

[slurm]
partition = "all"           # the only partition on this cluster; "cluster" (the default) does not exist
launch_modelexpress = false # ModelExpress/Redis exist for NIXL, pure failure surface here

[monitors.wandb]
project = "prl-nccl-fp32-ab"
group = "ab-2-wordle"

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "wordle"
env.taskset.id = "wordle"
env.player.harness.id = "null"
env.player.runtime.type = "subprocess"

[trainer.optim]
# lr = 0 freezes every parameter across all steps (see rl.toml for why this matters).
lr = 0

[inference]

[inference.vllm]
max_model_len = 8192
seed = 0
enforce_eager = true
