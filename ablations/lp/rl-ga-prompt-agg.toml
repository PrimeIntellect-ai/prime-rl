# Length penalty ablations on general-agent, arm `prompt-agg`: the no-penalty baseline with
# prompt-mean loss aggregation, so each prompt group weighs the same in the rl loss instead of
# each token. Tests whether token-mean aggregation drives the baseline's length growth.
# Everything else matches rl-ga.toml.
#
# Qwen3.6-35B-A3B (thinking on) with the null harness: native tool calls to each task's tool
# server, colocated in one small Prime sandbox per rollout. Scoring is deterministic (final DB vs
# the task's verify()); there is no judge. Tasks: tiers 3-4 with a GLM-5.1 pass rate >= 0.05,
# minus the tasks a grader audit flagged (ga_exclude_names.txt: lenient or date-dependent
# verifiers, partial credit, gold chains that no longer verify), 1239 in total. 128 of them are
# held out for eval (ga_eval_idx.txt), avg@4. Both lists are inlined so the config needs no
# local files at launch.
#
# 1 trainer node + 1 inference node (tp1 dp8, no expert parallelism) on H200.
#
#   prime train run ablations/lp/rl-ga-prompt-agg.toml --ref <commit> --gpu-type H200_141GB -e WANDB_API_KEY
#   uv run rl @ ablations/lp/rl-ga-prompt-agg.toml --slurm.job-name lp-ga-prompt-agg

mode = "rl"
seq_len = 131072
max_steps = 500

[run]
name = "lp-ga-prompt-agg"

[model]
name = "Qwen/Qwen3.6-35B-A3B"

[weight_broadcast]
type = "nccl"

[ckpt]
interval = 20
keep_last = 2

[monitors.wandb]
project = "lp-ablations"
name = "ga-prompt-agg"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 1

# --- Trainer: the qwen3.6 example fits one 262144-token sample with cp 4, so 131072 fits with cp 2 ---

[trainer.model]
ep = 8
cp = 2
ac_offloading = "None"

# --- Orchestrator ---

[orchestrator]
batch_size = 64
max_staleness = 16

[orchestrator.concurrency]
min_inflight = 128
max_inflight = 512

[orchestrator.train]
group_size = 8

[[orchestrator.train.source]]
name = "ga"
# No algo.length_penalty: the GRPO default (None) disables it.
