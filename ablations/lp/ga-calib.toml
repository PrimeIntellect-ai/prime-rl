# general-agent calibration for the LP ablations: Qwen3.6-35B-A3B with the null harness (native
# tool calls to the task's tool server), no sandbox (subprocess runtimes), deterministic scoring.
# One source per difficulty tier. Policy served by Prime inference.
#
#   uv run eval @ ablations/lp/ga-calib.toml --client.base-url https://api.pinference.ai/api/v1

model = "qwen/qwen3.6-35b-a3b"
group_size = 4

[run]
name = "lp-ga-calib"

[select]
limit = 16
shuffle = true

[concurrency]
min_inflight = 64
max_inflight = 64

[[source]]
name = "ga-t0"
env.taskset.id = "general-agent"
env.taskset.min_tier = 0
env.taskset.max_tier = 0
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
env.agent.timeout.rollout = 3600

[[source]]
name = "ga-t1"
env.taskset.id = "general-agent"
env.taskset.min_tier = 1
env.taskset.max_tier = 1
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
env.agent.timeout.rollout = 3600

[[source]]
name = "ga-t2"
env.taskset.id = "general-agent"
env.taskset.min_tier = 2
env.taskset.max_tier = 2
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
env.agent.timeout.rollout = 3600

[[source]]
name = "ga-t3"
env.taskset.id = "general-agent"
env.taskset.min_tier = 3
env.taskset.max_tier = 3
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
