# SFT for nemotron-3-super: the model and the trainer setup of gpu/h200.toml (its trainer nodes,
# parallelism, offload and precision), with the sequence length of rl.toml. Not tested as SFT.
#
#   uv run sft @ recipes/nemotron-3-super/sft.toml @ recipes/data/sft.toml

[model]
name = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
cp = 8
ep = 8
ac_offloading = "None"

[optim]
type = "muon"

[data]
# Two packed rows per data-parallel rank per step (2 ranks at cp 8).
batch_size = 4
micro_batch_size = 1
seq_len = 262144

[deployment]
type = "multi_node"
num_train_nodes = 2

[slurm]
