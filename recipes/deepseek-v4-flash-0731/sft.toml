# SFT for deepseek-v4-flash-0731: the model and the trainer setup of gpu/h200.toml (its trainer nodes,
# parallelism, offload and precision), with the sequence length of rl.toml. Not tested as SFT.
#
#   uv run sft @ recipes/deepseek-v4-flash-0731/sft.toml @ recipes/data/sft.toml

[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
cp = 8

[model.quantization]
type = "fp8"
extra_ignore_patterns = ["compressor\\.", "indexer\\."]

[model.moe.compute]
type = "deepgemm_fp8"

[optim]
type = "muon"

[data]
# Two packed rows per data-parallel rank per step (4 ranks at cp 8).
batch_size = 8
micro_batch_size = 1
seq_len = 262144

# The checkpoint is not in the renderer map; same renderer as rl.toml.
[renderer]
name = "deepseek-v4"
enable_thinking = true
drop_thinking = false
thinking_retention = "all"
reasoning_effort = "low"

[deployment]
type = "multi_node"
num_train_nodes = 4

[slurm]
