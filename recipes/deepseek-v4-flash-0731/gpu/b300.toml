# B300 overlay for rl.toml: 4 trainer nodes and 4 one-node DEP8 inference replicas, MXFP8 on both
# sides. Not tested in this layout, and not run on B300 nodes in this form: the settings come from
# this example's earlier `gpu/b300.toml` (#4525) at 131k with cp 4. Its MXFP8 settings ran on B300 at
# 131k in research-prod #295 (4 + 4 nodes, cp 8, AdamW).
#
#   uv run rl @ recipes/deepseek-v4-flash-0731/rl.toml @ recipes/deepseek-v4-flash-0731/gpu/b300.toml @ recipes/fake.toml --trainer.model.debug.force-balanced-routing --trainer.data.fake.batch-size 4

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 4

# --- Trainer: MXFP8 to match vLLM's online MXFP8 bit for bit ---

[trainer]
dist_timeout_seconds = 14400

[trainer.model]
# Ring CP. 262144 / 8 = 32k tokens per rank, as at 131k with cp 4.
cp = 8

[trainer.model.moe.compute]
type = "mxfp8"

# Every linear vLLM runs in MXFP8 (wq_a, wkv, wq_b, wo_b, shared experts) runs in MXFP8 here too;
# what vLLM keeps bf16 (wo_a, compressors, router, lm_head) stays bf16. Both quantize 1x32 with
# power-of-two scales rounded up, so weights match bit for bit. The indexer stays bf16 on both
# sides: its top-k key selection is discrete, so FP8 rounding differences flip selected keys once
# sequences are long, and at 131k nearly every token is in that regime.
[trainer.model.quantization]
type = "mxfp8"
recipe = "mxfp8_rceil_wgrad_with_hp"
extra_ignore_patterns = ["o_a_proj", 'compressor\.', 'indexer\.']

# --- Orchestrator ---

[orchestrator.model.client]
# Loading and quantizing the 1.1 TB bf16 checkpoint over NFS takes well over the default timeout.
wait_for_ready_timeout = 7200

[orchestrator.concurrency]
initial_inflight = 1024
min_inflight = 1024

# --- Inference: one DEP8 replica per node, online MXFP8 ---

# Pinned off: vLLM derives it from `scale_fmt`, and this checkpoint has no `quantization_config`.
[inference.env_vars]
VLLM_USE_DEEP_GEMM_E8M0 = "0"

[inference.vllm]
tensor_parallel_size = 1
data_parallel_size = 8
enable_expert_parallel = true
dtype = "bfloat16"
quantization = "mxfp8"
gpu_memory_utilization = 0.85

[inference.vllm.quantization_config]
# wo_a: vLLM's deep_gemm_fp8_o_proj treats an MXFP8 `wo_a` as blockwise FP8 and fails a DeepGEMM
# assert. indexer: kept bf16 to match the trainer.
ignore = ["*.wo_a", "*.indexer.*"]
