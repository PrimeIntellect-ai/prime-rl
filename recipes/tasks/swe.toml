# SWE agent RL on ScaleSWE with a bash harness in prime sandboxes, evaluated on SWE-bench
# Verified. Compose it after a recipe.

[orchestrator]
batch_size = 256
max_staleness = 16

[orchestrator.train]
group_size = 8

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600

[trainer.optim]
type = "adamw"
lr = 1e-6
