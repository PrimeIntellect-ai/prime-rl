# SFT for nemotron-3.5-super: the model and the trainer setup of gpu/h200.toml (its trainer nodes,
# parallelism, offload and precision), with the sequence length of rl.toml. Not tested as SFT.
#
#   uv run sft @ recipes/nemotron-3.5-super/sft.toml @ recipes/data/sft.toml

[model]
name = "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16"
cp = 8
ep = 8

[optim]
type = "adamw"

[data]
# Two packed rows per data-parallel rank per step (4 ranks at cp 8).
batch_size = 8
micro_batch_size = 1
seq_len = 262144

# The checkpoint is not in the renderer map; same renderer as rl.toml.
[renderer]
name = "nemotron-3.5"

[deployment]
type = "multi_node"
num_train_nodes = 4

[slurm]
