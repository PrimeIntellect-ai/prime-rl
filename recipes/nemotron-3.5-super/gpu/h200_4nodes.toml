# H200 overlay for rl.toml: 4 trainer nodes and 4 one-node inference replicas. Not tested in this
# layout: the trainer parallelism and the TP8 + EP inference come from research-prod #412 (4 trainer
# nodes, cp 8, ep 8, at 131k). Nemotron 3 Super, the same 120B-A12B language model, fit 256k at cp 8
# on 2 nodes (recipes/nemotron-3-super/gpu/h200_2nodes.toml).
#
#   uv run rl @ recipes/nemotron-3.5-super/rl.toml @ recipes/nemotron-3.5-super/gpu/h200_4nodes.toml @ recipes/fake.toml --trainer.model.debug.force-balanced-routing --trainer.data.fake.batch-size 4

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 4

[trainer.model]
# The Mamba layers split their 8 groups across CP ranks, so cp is at most 8.
cp = 8
ep = 8

# One DEP8 replica per node: attention data parallel, experts sharded 8 ways.
[inference.vllm]
tensor_parallel_size = 1
data_parallel_size = 8
