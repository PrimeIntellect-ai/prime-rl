# H200 overlay for rl.toml: 6 trainer nodes and 6 one-node inference replicas, FP8 on the routed
# experts on both sides. Trainer fit on fake 16k samples (6 nodes, ep 8, full offload, Sign-SGD):
# 41.7k tok/s (870 per GPU), 107.6 GiB peak allocated. RL not tested in this layout; the inference
# settings come from examples/advanced/inkling2/{math-rl,swe-rl}.toml, which ran 6 trainer nodes and
# 2 inference replicas.
#
#   uv run rl @ recipes/inkling-2-small/rl.toml @ recipes/inkling-2-small/gpu/h200.toml @ recipes/fake.toml --trainer.model.debug.force-balanced-routing --trainer.data.fake.batch-size 48

[deployment]
type = "multi_node"
num_train_nodes = 6
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 6

[trainer]
dist_timeout_seconds = 1800

[trainer.model]
ep = 8
offload = "full"

# FP8 on the routed experts only, matching vLLM's online fp8_per_block; dense layers stay bf16.
[trainer.model.moe.compute]
type = "deepgemm_fp8"

# TP8: DEP8 needs ~100 GiB of KV per rank for one 32k request. The plugin supports only a bf16 KV
# cache (~0.9 MB per token), so KV room is the limit: max_num_seqs and the step budget reserve memory
# that comes out of the KV cache. Under a synthetic agentic load (one node), these settings decode
# ~2.5k tok/s from 128 to 192 sessions (KV 201k tokens); swe-rl.toml's 32 seqs / 2048 tokens at 0.72
# peaked at 1.4k, and 256 seqs / 8192 tokens collapsed above 128 sessions. 0.85 is untested with the
# RL weight update; lower it if the first update runs out of memory.
[inference.vllm]
tensor_parallel_size = 8
enable_expert_parallel = true
dtype = "bfloat16"
quantization = "fp8_per_block"
gpu_memory_utilization = 0.85
max_num_seqs = 128
max_num_batched_tokens = 4096

# ~160 sessions per inference node before turn latency climbs.
[orchestrator.concurrency]
max_inflight = 960
