# Qwen3.6-35B-A3B RL at 256k context on 8x H200 nodes: one trainer node and three one-node
# inference replicas. Add a task config with the sources and algorithm:
#
#   uv run rl @ recipes/qwen3.6-35b-a3b/rl/h200.toml @ recipes/rl/tasks/swe.toml

seq_len = 262144

[model]
name = "Qwen/Qwen3.6-35B-A3B"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
# With one replica, the trainer waited for batches 73% of the time on scaleswe.
num_infer_replicas = 3

[slurm]

[weight_broadcast]
type = "nccl"

[trainer.model]
ep = 8
cp = 4
# Offloading would save 8 GiB of the 87 GiB peak but cost 6% throughput.
ac_offloading = "None"

[inference.vllm]
# The model has 2 KV heads: TP above 2 replicates the KV cache.
tensor_parallel_size = 2
data_parallel_size = 4
max_model_len = 262144
gpu_memory_utilization = 0.85
enable_prefix_caching = true

# Text-only RL: skip the vision encoder.
[inference.vllm.limit_mm_per_prompt]
image = 0
video = 0
