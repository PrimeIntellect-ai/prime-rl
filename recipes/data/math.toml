# Single-turn math RL on INTELLECT-3 math, for functional tests (most groups get equal rewards), evaluated on AIME 2025. Compose it after a model's
# rl.toml and hardware overlay:
#
#   uv run rl @ recipes/qwen3.8-flash-next/rl.toml @ recipes/qwen3.8-flash-next/gpu/h200.toml @ recipes/data/math.toml

[orchestrator]
batch_size = 128
max_staleness = 8

[orchestrator.train]
group_size = 8

[orchestrator.train.algo]
type = "grpo"

[orchestrator.train.sampling]
max_completion_tokens = 65536

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
# A completion cut at max_completion_tokens is not scored: it gets reward 0.
env.agent.scoring.skip_on_truncated = true

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "aime2025"
env.taskset.id = "aime25"
env.agent.harness.id = "null"
group_size = 8
