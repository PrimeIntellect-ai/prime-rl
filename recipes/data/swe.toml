# Representative SWE agent RL: ScaleSWE with the bash harness (bash + edit tools) in prime
# sandboxes, evaluated on SWE-bench Verified. Update the tasksets as models get stronger.
# Compose it after a model's rl.toml and compute overlay:
#
#   uv run rl @ recipes/qwen3.8-flash-next/rl.toml @ recipes/qwen3.8-flash-next/gpu/h200.toml @ recipes/data/swe.toml

[orchestrator]
batch_size = 128
# Episodes span many trainer steps.
max_staleness = 16

[orchestrator.train]
group_size = 8

[orchestrator.train.algo]
type = "grpo"

# A small pass-rate-scaled penalty on length: groups whose rollouts all pass still differ in
# reward, so they train (prefer shorter episodes) instead of being dropped for having no signal.
[orchestrator.train.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.01
num_input_tokens_weight = 0.01
num_turns_weight = 0.01

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
# Fail hung rollouts so they do not hold in-flight slots and block the pipeline.
env.agent.timeout.rollout = 10800

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600
