# Qwen3.8 Flash Next (512-expert MoE, hybrid Gated DeltaNet + sparse attention) RL at 256k context.
# Model settings only: compose it with a compute overlay from `gpu/` and a data config from
# `recipes/data/`:
#
#   uv run rl @ recipes/qwen3.8-flash-next/rl.toml @ recipes/qwen3.8-flash-next/gpu/h200.toml @ recipes/data/swe.toml
#   uv run rl @ recipes/qwen3.8-flash-next/rl.toml @ recipes/qwen3.8-flash-next/gpu/h200.toml @ recipes/data/math.toml

seq_len = 262144

[slurm]

[model]
name = "Qwen/Qwen3.8-Flash-Next"

[weight_broadcast]
type = "modelexpress"
# Each inference GPU stages at most 2 x 4 GiB of an update instead of a full copy of its shard.
staging_buffer_bytes = 4294967296
staging_buffers_count = 2

[trainer]
enable_router_replay = true

[trainer.optim]
type = "muon"
lr = 1e-6

[inference]
enable_fp32_lm_head = true
enable_fp32_router_logits = true

[inference.vllm]
max_model_len = 262144
enable_expert_parallel = true
all2all_backend = "allgather_reducescatter"
enable_prefix_caching = true
mamba_cache_dtype = "float32"
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

# vLLM's strict weight check expects every shard of the fused hyper-connection weight from the
# checkpoint, including its alignment padding, which no checkpoint holds.
[inference.vllm.model_loader_extra_config]
enable_weights_track = false

[inference.vllm.engram_config]
cpu_offload = true

# Text-only RL: skip the vision encoder.
[inference.vllm.limit_mm_per_prompt]
image = 0
video = 0
