# SFT for qwen3.8-flash-next: the model and the trainer setup of gpu/h200.toml (its trainer nodes,
# parallelism, offload and precision), with the sequence length of rl.toml. Not tested as SFT.
#
#   uv run sft @ recipes/qwen3.8-flash-next/sft.toml @ recipes/data/sft.toml

[model]
name = "Qwen/Qwen3.8-Flash-Next"
cp = 8
ep = 8

[optim]
type = "muon"

[data]
# Two packed rows per data-parallel rank per step (3 ranks at cp 8).
batch_size = 6
micro_batch_size = 1
seq_len = 262144

[deployment]
type = "multi_node"
num_train_nodes = 3

[slurm]
