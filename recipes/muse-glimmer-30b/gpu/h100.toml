# H100 80GB overlay for rl.toml: 1 trainer node and 1 one-node inference replica. Not tested: on
# H200, cp 4 peaked at 56.5 GiB allocated on fake 256k samples and 60 GiB on ScaleSWE, so this uses
# cp 8 (52.2 GiB reserved on H200) for headroom.
#
#   uv run rl @ recipes/muse-glimmer-30b/rl.toml @ recipes/muse-glimmer-30b/gpu/h100.toml @ recipes/data/math.toml

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 1

# An 80 GB GPU leaves under 12 GB outside vLLM's budget, so stage weight updates through one 4 GiB buffer.
[weight_broadcast]
staging_buffers_count = 1

[trainer.model]
cp = 8

# Same layout as H200: 2 KV heads, so TP above 2 makes several GPUs read the same heads.
[inference.vllm]
tensor_parallel_size = 2
data_parallel_size = 4
