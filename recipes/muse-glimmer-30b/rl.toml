# Muse Glimmer 30B (dense, 13 of 52 layers full attention) RL at 256k context.
# Model settings only: compose it with a compute overlay from `gpu/` and a data config from
# `recipes/data/`:
#
#   uv run rl @ recipes/muse-glimmer-30b/rl.toml @ recipes/muse-glimmer-30b/gpu/h200_1node.toml @ recipes/data/scaleswe.toml
#   uv run rl @ recipes/muse-glimmer-30b/rl.toml @ recipes/muse-glimmer-30b/gpu/h200_1node.toml @ recipes/data/scaleswe-short.toml
#   uv run rl @ recipes/muse-glimmer-30b/rl.toml @ recipes/muse-glimmer-30b/gpu/h200_1node.toml @ recipes/data/math.toml

seq_len = 262144

[slurm]

[model]
name = "meta-models/Muse-Glimmer-30B"

[weight_broadcast]
type = "nccl"

[trainer.optim]
type = "muon"
lr = 1e-6

[inference.vllm]
# config.json caps context at 131072. The full-attention layers use no RoPE, but 256k is beyond
# what the model was trained on, so serve 128k until it is evaluated there.
max_model_len = 131072
enable_prefix_caching = true
# Text-only RL: skip the vision encoder.
language_model_only = true
