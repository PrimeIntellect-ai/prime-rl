# 2 nodes: 1 inference node (two TP=4 engines behind the router) and 1 trainer node.
# run.py sets max_steps, run.name, output_dir and PRIME_FAULT per scenario.
seq_len = 2048

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[slurm]
cleanup_grace_period = 300

[ckpt]
interval = 4

[weight_broadcast]
type = "nccl"

[inference.vllm]
tensor_parallel_size = 4

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 128

[orchestrator.train]
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "reverse-text-b"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.renderer]
name = "prime-qwen3"
