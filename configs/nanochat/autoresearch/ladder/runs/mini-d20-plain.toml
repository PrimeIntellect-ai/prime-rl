mode = "pretrain"
max_steps = 7280
gpu_type = "H200_141GB"
volume = "<your-volume>"  # needs datasets/, models/tokenizer-rustbpe32k, eval_bundle/ and models/cfg/<name>/ (copy from ../models)
image_tag = "v0.10.1.dev176"  # added on export: this run used the backend default image of 2026-11-11, which had the same heavy deps

# derived (launch.py): {"depth": 20, "flops_per_token": 3004189440, "scaling_params": 435162240, "total_params": 896535720, "tokens": 3816816640, "total_flops": 11466440244304281600, "weight_decay": 0.06057755690354568, "adamw_lr_scale": 0.7745966692414834}
[model]
name = "/volume/models/cfg/d20-plain-2d275723"
offload = "none"
ac = "None"
ac_offloading = "None"
dp_replicate = 8

[tokenizer]
name = "/volume/models/tokenizer-rustbpe32k"

[data]
paths = ["datasets/fineweb100b-packed/train"]
seq_len = 2048
batch_size = 256
micro_batch_size = 16
packed_rows = true

[val]
interval = 364
num_samples = 10240
bpb = true
final_bpb = true
core = true
core_max_per_task = -1
eval_bundle = "/volume/eval_bundle"

[val.data]
paths = ["datasets/fineweb100b-packed/val"]
seq_len = 2048
packed_rows = true
micro_batch_size = 16

[optim]
type = "nanochat_muon"
total_steps = 7280
weight_decay = 0.0605776
embedding_lr = 0.232379
unembedding_lr = 0.00309839

[scheduler]
type = "warmdown"
warmdown_ratio = 0.5

[deployment]
type = "single_node"
num_train_gpus = 8
