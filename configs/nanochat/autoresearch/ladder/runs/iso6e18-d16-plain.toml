mode = "pretrain"
max_steps = 6890
gpu_type = "H200_141GB"
volume = "<your-volume>"  # needs datasets/, models/tokenizer-rustbpe32k, eval_bundle/ and models/cfg/<name>/ (copy from ../models)
image_tag = "v0.10.1.dev176"  # added on export: this run used the backend default image of 2026-11-11, which had the same heavy deps

# derived (launch.py): {"depth": 16, "flops_per_token": 1660956672, "scaling_params": 234883072, "total_params": 536872992, "tokens": 3612344320, "total_flops": 5999947399865303040, "weight_decay": 0.06400647521884072, "adamw_lr_scale": 0.8660254037844387}
[model]
name = "/volume/models/cfg/d16-plain-41cb4b1a"
offload = "none"
ac = "None"
ac_offloading = "None"
dp_replicate = 8

[tokenizer]
name = "/volume/models/tokenizer-rustbpe32k"

[data]
paths = ["datasets/fineweb100b-packed/train"]
seq_len = 2048
batch_size = 256
micro_batch_size = 16
packed_rows = true

[val]
interval = 265
num_samples = 10240
bpb = true
final_bpb = true
core = true
core_max_per_task = -1
eval_bundle = "/volume/eval_bundle"

[val.data]
paths = ["datasets/fineweb100b-packed/val"]
seq_len = 2048
packed_rows = true
micro_batch_size = 16

[optim]
type = "nanochat_muon"
total_steps = 6890
weight_decay = 0.0640065
embedding_lr = 0.259808
unembedding_lr = 0.0034641

[scheduler]
type = "warmdown"
warmdown_ratio = 0.5

[deployment]
type = "single_node"
num_train_gpus = 8
