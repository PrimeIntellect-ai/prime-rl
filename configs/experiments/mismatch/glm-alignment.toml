# Compose after glm45air.toml, dense-alignment.toml, and fp32-head.toml.
# GPU/host fit and full-model alignment remain experimental.
[trainer.model]
ep = 1
optim_cpu_offload = false

[trainer.model.full_offload]
release_gradient_pages = true

[trainer.model.debug]
moe_alignment = true

[inference.env_vars]
PRIME_MOE_ALIGNMENT = "0"
PRIME_GLM_ALIGNMENT = "1"
# Large expert weights must not round up to power-of-two pinned allocations.
PYTORCH_ALLOC_CONF = "expandable_segments:False,pinned_max_round_threshold_mb:1"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:False,pinned_max_round_threshold_mb:1"

[inference.vllm]
tensor_parallel_size = 1
cpu_offload_gb = 150
max_model_len = 8192
gpu_memory_utilization = 0.75

[inference.vllm.kernel_config]
moe_backend = "triton"
