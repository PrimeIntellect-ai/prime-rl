# Serving-side ablation; this does not align the trainer's kernels.
[env_vars]
# Match vLLM 0.28's NCCL settings on both sides of the weight communicator.
NCCL_LAUNCH_MODE = "GROUP"
NCCL_COLLNET_ENABLE = "0"
NCCL_NVLS_ENABLE = "0"
NCCL_P2P_NET_DISABLE = "1"
NCCL_MIN_NCHANNELS = "1"
NCCL_MAX_NCHANNELS = "1"
NCCL_PROTO = "Simple"
NCCL_ALGO = "allreduce:tree"
NCCL_NTHREADS = "1"
NCCL_SOCKET_NTHREADS = "1"

[inference.env_vars]
VLLM_BATCH_INVARIANT = "1"
