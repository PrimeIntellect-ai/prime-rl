# Compose after math.toml. Equal pool weights give seeded uniform task sampling.
[[orchestrator.train.source]]
name = "gsm8k"
env.taskset.id = "gsm8k"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
env.agent.max_turns = 1

[orchestrator.train.source.curriculum.sampler]
type = "difficulty_pool"
seed = 42
pools = { hard = { threshold = 0.25, weight = 1.0 }, normal = { threshold = 0.75, weight = 1.0 }, easy = { threshold = 1.0, weight = 1.0 } }
