max_steps = 20
seq_len = 2048

[model]
name = "Qwen/Qwen3-8B"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
gpus_per_node = 8

[weight_broadcast]
type = "nccl"

[trainer.monitors.file]
float_decimals = "None"

[orchestrator.monitors.file]
float_decimals = "None"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
optim_cpu_offload = true

[trainer.model.debug]
mismatch_diagnostics = true

[trainer.optim]
lr = 1e-6

# This setting gives the unclipped importance-sampling policy gradient.
[trainer.loss]
type = "ipo"
eps = 1.0
adv_tau = 1.0
kl_tau = 0.0

[orchestrator]
batch_size = 32
group_size = 8
max_off_policy_steps = 0

[orchestrator.env_vars]
PYTHONDONTWRITEBYTECODE = "1"

[orchestrator.concurrency]
min_inflight = 32
max_inflight = 32
initial_inflight = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "qwen3"
enable_thinking = false

[orchestrator.train.sampling]
temperature = 1.0
top_p = 1.0
max_completion_tokens = 256

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
env.agent.max_turns = 1

[inference.vllm]
tensor_parallel_size = 1
dtype = "bfloat16"
seed = 42
generation_config = "vllm"
enable_prefix_caching = false

[ckpt]
keep_last = 1
