[run]
name = "baseline-linear-attention"

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
TMPDIR = "/tmp/adaptive-concurrency-linear"
TRITON_CACHE_DIR = "/tmp/adaptive-concurrency-linear/triton"

[slurm]
job_name = "ac-linear-terminal-lego"
pre_run_command = 'mkdir -p /tmp/adaptive-concurrency-linear ; timeout 120 prime sandbox delete --label "ac-linear-terminal-lego" -y || true'

[deployment]
num_infer_nodes = 1
num_infer_replicas = 2

[monitors.wandb]
name = "baseline-linear-attention"

[model]
name = "Qwen/Qwen3.5-35B-A3B"

[orchestrator.renderer]
name = "qwen3.5"

[[orchestrator.train.source]]
name = "terminal-lego"
env.taskset.id = "terminal-lego"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["ac-linear-terminal-lego"]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/adaptive-concurrency-linear/vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/adaptive-concurrency-linear/flashinfer"

[inference.vllm]
enable_prefix_caching = true
