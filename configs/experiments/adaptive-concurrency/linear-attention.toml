max_steps = 20
seq_len = 65536
output_dir = "/home/mikasenghaas/outputs/adaptive-concurrency-improvs"

[run]
name = "baseline-linear-attention"

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
TMPDIR = "/tmp/adaptive-concurrency-linear"
TRITON_CACHE_DIR = "/tmp/adaptive-concurrency-linear/triton"

[slurm]
job_name = "ac-linear-baseline"
partition = "all"
pre_run_command = 'mkdir -p /tmp/adaptive-concurrency-linear ; timeout 120 prime sandbox delete --label "ac-linear-baseline" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 2

[monitors.wandb]
project = "adaptive-concurrency-improvs"
name = "baseline-linear-attention"

[weight_broadcast]
type = "nccl"
timeout = 3600

[model]
name = "Qwen/Qwen3.5-35B-A3B"

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 8
cp_style = "ulysses"
ep = 8
optim_cpu_offload = false
full_offload = true
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "sign_sgd"

[orchestrator]
batch_size = 128
group_size = 16
max_off_policy_steps = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "qwen3.5"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["ac-linear-baseline"]

[inference]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/adaptive-concurrency-linear/vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/adaptive-concurrency-linear/flashinfer"

[inference.vllm]
max_model_len = 65536
tensor_parallel_size = 8
enable_prefix_caching = true
enable_expert_parallel = true
enable_return_routed_experts = true
