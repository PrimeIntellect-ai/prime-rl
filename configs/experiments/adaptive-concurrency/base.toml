max_steps = 50
seq_len = 65536
output_dir = "outputs/adaptive-concurrency-improvs"

[slurm]
partition = "all"

[deployment]
type = "multi_node"
num_train_nodes = 1

[monitors.wandb]
project = "adaptive-concurrency-improvs"

[weight_broadcast]
type = "nccl"
timeout = 3600

[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"

[trainer]
dist_timeout_seconds = 3600

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 8
cp_style = "ulysses"
ep = 8
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "sign_sgd"

[orchestrator]
batch_size = 128
group_size = 8
max_off_policy_steps = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "qwen3"

[inference]

[inference.vllm]
max_model_len = 65536
tensor_parallel_size = 8
enable_expert_parallel = true
