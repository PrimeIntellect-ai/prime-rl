[run]
name = "terminal-lego-pd-disagg-v2"

[env_vars]
TMPDIR = "/tmp/adaptive-concurrency-pd"
TRITON_CACHE_DIR = "/tmp/adaptive-concurrency-pd/triton"

[slurm]
job_name = "ac-pd-terminal-lego-v2"
pre_run_command = 'mkdir -p /tmp/adaptive-concurrency-pd ; timeout 120 prime sandbox delete --label "ac-pd-terminal-lego-v2" -y || true'

[deployment]
num_infer_nodes = 2
num_infer_replicas = 1

[monitors.wandb]
name = "terminal-lego-pd-disagg-v2"

[[orchestrator.train.source]]
name = "terminal-lego"
env.taskset.id = "terminal-lego"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["ac-pd-terminal-lego-v2"]

[inference.deployment]
type = "disaggregated"
prefill_nodes_per_replica = 1
decode_nodes_per_replica = 1

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/adaptive-concurrency-pd/vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/adaptive-concurrency-pd/flashinfer"
