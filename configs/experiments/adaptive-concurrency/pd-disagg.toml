max_steps = 20
seq_len = 131072
output_dir = "/home/mikasenghaas/outputs/adaptive-concurrency-improvs"

[run]
name = "baseline-pd-disagg"

[env_vars]
TMPDIR = "/tmp/adaptive-concurrency-pd"
TRITON_CACHE_DIR = "/tmp/adaptive-concurrency-pd/triton"

[slurm]
job_name = "ac-pd-baseline"
partition = "all"
pre_run_command = 'mkdir -p /tmp/adaptive-concurrency-pd ; timeout 120 prime sandbox delete --label "ac-pd-baseline" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 2
num_infer_replicas = 1

[monitors.wandb]
project = "adaptive-concurrency-improvs"
name = "baseline-pd-disagg"

[weight_broadcast]
type = "nccl"
timeout = 3600

[model]
name = "zai-org/GLM-4.5-Air"

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 4
cp_style = "ulysses"
optim_cpu_offload = false
full_offload = true
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "sign_sgd"

[orchestrator]
batch_size = 128
group_size = 16
max_off_policy_steps = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["ac-pd-baseline"]

[inference]

[inference.deployment]
type = "disaggregated"
prefill_nodes_per_replica = 1
decode_nodes_per_replica = 1

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/adaptive-concurrency-pd/vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/adaptive-concurrency-pd/flashinfer"

[inference.vllm]
max_model_len = 131072
tensor_parallel_size = 8
quantization = "fp8"
enable_return_routed_experts = true
