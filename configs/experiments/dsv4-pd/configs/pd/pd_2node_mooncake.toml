# pd_2node.toml + Mooncake KV offload: the prefill node contributes 1 TB of DRAM to the shared store, decode joins
# without capacity and saves the KV it generates (save_decode_cache) for the next turn's prefill.
#
# DeepSeek-V4-Flash online MXFP8, P/D disaggregated on 2 nodes: one DP8+EP prefill node, one DP8+EP decode node,
# NIXL KV transfer, vllm-router (PD mode) on the prefill node's :8000. Same engine settings as the aggregated
# baseline (/home/phi/exp/dsv4-nvfp4/configs/mxfp8.toml).
#
#   uv run inference @ /home/phi/exp/dsv4-pd/configs/pd_2node.toml

output_dir = "/home/phi/exp/dsv4-pd/outputs/pd_2node_mooncake"

[slurm]
job_name = "dsv4-pd-mc"
partition = "all"

[deployment]
type = "disaggregated"
prefill_nodes_per_replica = 1
decode_nodes_per_replica = 1

[env_vars]
VLLM_USE_DEEP_GEMM_E8M0 = "0"
VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR = "/home/phi/.cache/vllm-flashinfer-autotune"

[vllm]
model = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
dtype = "bfloat16"
quantization = "mxfp8"
# Each role fits one NVLink domain; vLLM's MXFP8 MoE kernels do not run behind DeepEP HT/LL.
all2all_backend = "flashinfer_nvlink_one_sided"
gpu_memory_utilization = 0.85
max_model_len = 131072
kv_cache_dtype = "fp8"
block_size = 256
tool_call_parser = "deepseek_v4"
reasoning_parser = "deepseek_v4"

[vllm.quantization_config]
ignore = ["*.wo_a", "*.indexer.*"]

[deployment.prefill_kv_cache_offload]
type = "mooncake"
# The GPU fabric's 400G NDR NICs: auto-discovery also picks the 100G HDR NICs (mlx5_0-3, another IB fabric) and
# the RoCE bond, which the peer cannot reach, so a share of the puts fail.
device_name = "mlx5_4,mlx5_7,mlx5_8,mlx5_9,mlx5_10,mlx5_11,mlx5_12,mlx5_13"
[deployment.prefill_kv_cache_offload.cpu]
num_bytes = 1_000_000_000_000

[deployment.decode_kv_cache_offload]
type = "mooncake"
device_name = "mlx5_4,mlx5_7,mlx5_8,mlx5_9,mlx5_10,mlx5_11,mlx5_12,mlx5_13"
[deployment.decode_kv_cache_offload.cpu]
num_bytes = 0
