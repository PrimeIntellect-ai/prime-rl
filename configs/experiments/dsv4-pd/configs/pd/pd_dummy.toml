# DSV4-Flash P/D plumbing test with dummy weights (dry run only: generates per-role engine configs).
dry_run = true
output_dir = "/home/phi/exp/dsv4-pd/outputs/pd_dummy"

[slurm]
partition = "all"

[deployment]
type = "disaggregated"

[env_vars]
VLLM_USE_DEEP_GEMM_E8M0 = "0"
VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR = "/home/phi/.cache/vllm-flashinfer-autotune"

[vllm]
model = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
load_format = "dummy"
dtype = "bfloat16"
quantization = "mxfp8"
gpu_memory_utilization = 0.85
max_model_len = 131072
kv_cache_dtype = "fp8"
block_size = 256
tool_call_parser = "deepseek_v4"
reasoning_parser = "deepseek_v4"

[vllm.quantization_config]
ignore = ["*.wo_a", "*.indexer.*"]
