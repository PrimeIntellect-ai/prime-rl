output_dir = "outputs/ngu-screen-3000/inference"

[deployment]
type = "multi_node"
num_nodes = 8
gpus_per_node = 8

[slurm]
job_name = "ngu-swe-screen"

[env_vars]
TRITON_CACHE_DIR = "/tmp/mika-ngu-screen-3000/triton"
VLLM_CACHE_ROOT = "/tmp/mika-ngu-screen-3000/vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/mika-ngu-screen-3000/flashinfer"

[vllm]
model = "PrimeIntellect/GLM-4.5-Air-Scaleswe"
tensor_parallel_size = 8
data_parallel_size = 1
enable_expert_parallel = true
gpu_memory_utilization = 0.85
max_model_len = 131072
enable_auto_tool_choice = true
tool_call_parser = "glm45"
reasoning_parser = "glm45"
