model = "PrimeIntellect/GLM-4.5-Air-Scaleswe"
num_examples = 1000
group_size = 8
output_dir = "outputs/ngu-profile"
dashboard = false

[run]
name = "swerebench-1k"

[client]
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"

[concurrency]
min_inflight = 256
max_inflight = 1000

[[source]]
name = "swerebench-1k"
env.taskset.id = "ngu-swe"
env.taskset.manifest = "tools/ngu/sample-1000.json"
env.agent.harness.id = "bash"
env.agent.runtime.type = "prime"
env.agent.timeout.rollout = 3600
