model = "PrimeIntellect/GLM-4.5-Air-Scaleswe"
num_examples = 1000
group_size = 8
output_dir = "outputs/ngu-profile"
dashboard = false

[run]
name = "swerebench-1000-avg8"

[client]
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"

[concurrency]
min_inflight = 256
max_inflight = 256

[sampling]
temperature = 1.0
top_p = 1.0

[[source]]
name = "swerebench-profile"
env.taskset.id = "ngu-swe"
env.taskset.manifest = "configs/experiments/ngu/sample-1000.json"
env.agent.harness.id = "bash"
env.agent.runtime.type = "prime"
env.agent.runtime.labels = ["ngu-swe-profile"]
env.agent.timeout.rollout = 3600
