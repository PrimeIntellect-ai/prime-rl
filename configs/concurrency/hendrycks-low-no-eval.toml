# Adaptive-concurrency e2e 1b: like hendrycks-low but WITHOUT eval — the simplest case. The
# cap holds at initial_inflight through step 1, jumps to the capacity budget at freeze exit,
# then converges smoothly as the train cost estimate replaces the seq_len bootstrap, with no
# eval-census repricing in the trace and no preemptions.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 12

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[monitors.wandb]
project = "adaptive-concurrency"
name = "hendrycks-low-initial-no-eval"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 64
group_size = 8
seq_len = 4096

[orchestrator.concurrency]
initial_inflight = 16

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 8192

[inference.vllm]
max_model_len = 4096
gpu_memory_utilization = 0.4
max_num_seqs = 1024
