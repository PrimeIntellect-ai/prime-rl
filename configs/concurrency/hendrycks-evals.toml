# Adaptive-concurrency e2e: hendrycks-math sanity, single node (4 train + 4 infer GPUs),
# reasonable starting cap (256) WITH AIME evals (avg@4 every 10 steps). Expect: the
# eval waves shift the in-flight mix and the usage-driven cap absorbs them reactively.
# gpu_memory_utilization is lowered artificially so the KV budget is small enough that the
# controller operates well below max_inflight. No evals — the trace isolates the controller.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 50

[run]
name = "hendrycks-evals"

[slurm]
job_name = "hendrycks-evals"
partition = "all"

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[monitors.wandb]
project = "adaptive-concurrency"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 512
group_size = 8
seq_len = 8192
max_off_policy_steps = 16

[orchestrator.concurrency]
max_inflight = 1024
initial_inflight = 256

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.eval]
interval = 10
group_size = 4

[[orchestrator.eval.source]]
name = "aime2024"

[orchestrator.eval.source.env.taskset]
id = "aime24"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 16384
attn = "flash_attention_2"

[inference.vllm]
max_model_len = 8192
max_num_seqs = 1024
gpu_memory_utilization = 0.2
