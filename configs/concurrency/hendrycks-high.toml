# Adaptive-concurrency e2e 2: hendrycks-math sanity on 2 GPUs with a starting cap far past the
# engine's KV capacity. Expect: the resulting preemptions trip a HARD cut during warmup (the
# emergency brake is live even while the feedforward loop is frozen), the cap drops to
# 0.75 x actual inflight, and after the drain the cap settles at the capacity budget — no
# repeated cuts on the stale draining signal. Eval every 5 steps as in the low variant.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 12

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[monitors.wandb]
project = "adaptive-concurrency"
name = "hendrycks-high-initial"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 64
group_size = 8
seq_len = 4096

[orchestrator.concurrency]
initial_inflight = 1024

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.eval]
interval = 5
num_examples = 8
group_size = 4

[[orchestrator.eval.source]]
name = "hendrycks-math-eval"

[orchestrator.eval.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 8192

[inference.vllm]
max_model_len = 4096
gpu_memory_utilization = 0.3
max_num_seqs = 1024
