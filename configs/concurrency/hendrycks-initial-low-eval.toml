# Adaptive-concurrency e2e: hendrycks-math sanity on 2 GPUs (1 trainer + 1 inference) with a
# LOW starting cap and no ceiling. Expect: the cap holds at initial_inflight through step 1,
# jumps to the capacity budget at freeze exit, then converges as per-env cost estimates replace
# the seq_len bootstrap — with no preemptions (concurrency/signal stays clear of HARD). AIME
# evals (avg@4, every 10 steps) have a different length profile than train, so the eval census
# visibly reprices the cap at epoch boundaries.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 50

[run]
name = "hendrycks-initial-low-eval"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[monitors.wandb]
project = "adaptive-concurrency"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 64
group_size = 8
seq_len = 8192

[orchestrator.concurrency]
initial_inflight = 16

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.eval]
interval = 10
group_size = 4

[[orchestrator.eval.source]]
name = "aime2024"

[orchestrator.eval.source.env.taskset]
id = "aime24"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 16384

[inference.vllm]
max_model_len = 8192
max_num_seqs = 1024
