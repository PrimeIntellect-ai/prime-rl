# Adaptive-concurrency e2e: hendrycks-math sanity, single node (4 train + 4 infer GPUs),
# NO starting cap. Expect: the pessimistic C / max_model_len derivation seeds the cap,
# then turnover-paced growth into the usage band.
# gpu_memory_utilization is lowered artificially so the KV budget is small enough that the
# controller operates well below max_inflight. No evals — the trace isolates the controller.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 50

[run]
name = "hendrycks-initial-none"

[slurm]
job_name = "hendrycks-initial-none"
partition = "all"
pre_run_command = 'timeout 120 prime sandbox delete --label "hendrycks-initial-none" -y || true' 

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[monitors.wandb]
project = "adaptive-concurrency"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 512
group_size = 8
seq_len = 8192
max_off_policy_steps = 16

[orchestrator.concurrency]
max_inflight = 300
# initial_inflight unset: derived at runtime as C / max_model_len

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "prime"
labels = ["hendrycks-initial-none"]

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 16384
attn = "flash_attention_2"

[inference.vllm]
max_model_len = 8192
max_num_seqs = 1024
api_server_count = 4
gpu_memory_utilization = 0.3
# Pin the KV budget directly: the 1.5B model gets ~9M KV tokens even at low
# utilization, putting the usage band above the max_inflight ceiling. 12288
# blocks/engine x 16-token blocks (FA2) x 4 engines ~= 786K tokens -> optimal
# band ~175, below every run's ceiling. Peak sandbox load across the three
# runs stays under 1k (400 + 300 + 256) to avoid gateway 429s.
num_gpu_blocks_override = 12288
