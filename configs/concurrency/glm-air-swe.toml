# Adaptive-concurrency e2e 3: GLM-4.5-Air on the scaleswe taskset, 2 nodes (1 train + 1 infer),
# rlm harness on a prime sandbox runtime. Starts from a reasonable cap and converges from there.
# Eval (SWE-Bench Verified, every 10 steps) is capped at 10 turns, so eval episodes are much
# cheaper than train episodes — expect the cap to INCREASE at eval boundaries when the eval
# census reprices the cost estimate, and to fall back once the epoch drains.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 100
seq_len = 131072

[env_vars]
TRITON_CACHE_DIR = "/tmp/.triton-cache"

[slurm]
job_name = "glm45air-swe-concurrency"
partition = "all"
pre_run_command = 'timeout 120 prime sandbox delete --label "glm45air-swe-concurrency" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[monitors.wandb]
project = "adaptive-concurrency"
name = "glm45air-swe-concurrency"

[weight_broadcast]
type = "nccl"
timeout = 3600

[model]
name = "zai-org/GLM-4.5-Air"

# --- Trainer ---

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 4
cp_style = "ulysses"
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "muon"

# --- Orchestrator ---

[orchestrator]
batch_size = 256
group_size = 16
max_off_policy_steps = 32

[orchestrator.concurrency]
initial_inflight = 256

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "scaleswe"

[orchestrator.train.source.env.taskset]
id = "scaleswe"

[orchestrator.train.source.env.agent.harness]
id = "rlm"
summarize_at_tokens = [65536, 131072]

[orchestrator.train.source.env.agent.runtime]
labels = ["glm45air-swe-concurrency"]

# --- Eval: SWE-Bench Verified every 10 steps, capped at 10 turns ---

[orchestrator.eval]
interval = 10

[[orchestrator.eval.source]]
name = "swebench-verified"

[orchestrator.eval.source.env.agent]
max_turns = 10

[orchestrator.eval.source.env.taskset]
id = "swebench-verified"

[orchestrator.eval.source.env.agent.harness]
id = "rlm"
summarize_at_tokens = 98304

[orchestrator.eval.source.env.agent.runtime]
labels = ["glm45air-swe-concurrency"]

[orchestrator.eval.source.env.agent.timeout]
rollout = 3600

# --- Inference ---

[inference]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/.vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/.flashinfer-cache"

[inference.vllm]
max_model_len = 131072
tensor_parallel_size = 8
enable_return_routed_experts = true
