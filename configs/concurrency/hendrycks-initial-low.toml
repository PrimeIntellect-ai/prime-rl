# Adaptive-concurrency e2e: like hendrycks-initial-low-eval but WITHOUT eval — the simplest case.
# The cap grows from the low start at the turnover pace while the engines stay clear, then
# settles into the KV usage band, with no preemptions in the trace.
# Verify via the concurrency/* gauges in W&B or the "Concurrency ..." lines in the orchestrator log.

max_steps = 50

[run]
name = "hendrycks-initial-low"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[monitors.wandb]
project = "adaptive-concurrency"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 64
group_size = 8
seq_len = 8192
max_off_policy_steps = 16

[orchestrator.concurrency]
max_inflight = 1024
initial_inflight = 16

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 16384

[inference.vllm]
max_model_len = 8192
max_num_seqs = 1024
