# Adaptive-concurrency e2e 1: hendrycks-math sanity on 2 GPUs (1 trainer + 1 inference) with a
# LOW starting cap and no ceiling. Expect: the cap holds at initial_inflight through step 1,
# jumps to the capacity budget at freeze exit, then tightens as per-env cost estimates replace
# the seq_len bootstrap — with no preemptions (concurrency/signal stays clear of HARD). Eval
# epochs (every 5 steps) reprice the cap from the eval env's own cost estimate.
# Verify via concurrency/* in <output_dir>/orchestrator/metrics.jsonl.

max_steps = 12

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[monitors.wandb]
project = "adaptive-concurrency"
name = "hendrycks-low-initial"

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 64
group_size = 8
seq_len = 4096

[orchestrator.concurrency]
initial_inflight = 16

[[orchestrator.train.source]]
name = "hendrycks-math"

[orchestrator.train.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.eval]
interval = 5
num_examples = 8
group_size = 4

[[orchestrator.eval.source]]
name = "hendrycks-math-eval"

[orchestrator.eval.source.env.taskset]
id = "math-env"
dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
dataset_subset = "default"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[orchestrator.renderer]
name = "default"
reasoning_parser = "think"

[trainer.model]
seq_len = 8192

[inference.vllm]
max_model_len = 4096
gpu_memory_utilization = 0.4
max_num_seqs = 1024
