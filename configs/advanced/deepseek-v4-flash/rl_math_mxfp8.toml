# DeepSeek-V4-Flash RL on `math` with online MXFP8 vLLM inference and a trainer whose forward is
# quantized the same way, on 3 trainer nodes + 1 inference node (B300).
#
# The checkpoint's dense weights sit exactly on the e4m3 grid (DeepSeek ships them as FP8), so an
# lr-1e-6 update mostly rounds back to the base value when vLLM re-quantizes. A bf16 trainer then
# drifts away from inference step by step; quantizing the trainer's forward identically keeps
# both on the same weights.
#
#   uv run rl @ configs/advanced/deepseek-v4-flash/rl_math_mxfp8.toml

max_steps = 60
seq_len = 4096

# bf16 re-export of the published checkpoint, which vLLM cannot serve as bf16. Currently private.
[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"

[monitors.wandb]
project = "deepseek-v4-flash"
group = "dsv4-mxfp8-math"

[deployment]
type = "multi_node"
num_train_nodes = 3
num_infer_nodes = 1

[slurm]
job_name = "ds-v4-math-mxfp8"
partition = "all"

[weight_broadcast]
type = "nccl"
port = 29501
timeout = 3600

[orchestrator]
batch_size = 64

[orchestrator.concurrency]
max_inflight = 128

[orchestrator.train]
group_size = 8

[orchestrator.train.algo]
type = "grpo"

[orchestrator.renderer]
name = "deepseek-v4"

[orchestrator.train.sampling]
max_completion_tokens = 3072

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "math-env"
# Deterministic scoring. The default reference judge calls out to Prime inference whenever
# math-verify scores 0, which makes the reward nondeterministic and errors the rollout if the
# judge call fails.
env.taskset.task.judge = "None"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer]
enable_router_replay = true
dist_timeout_seconds = 14400

[trainer.model]
freeze_moe_router = false
ep = 8

[trainer.model.compile]

[trainer.model.moe.dispatch]
type = "torch"

# Routed experts in MXFP8, like vLLM's FLASHINFER_TRTLLM MoE.
[trainer.model.moe.compute]
type = "mxfp8"

# Every linear vLLM runs in MXFP8 (wq_a, wkv, wq_b, wo_b, shared experts, indexer wq_b) runs in
# MXFP8 here too; what vLLM keeps bf16 (wo_a, compressors, indexer weights_proj, router, lm_head)
# stays bf16. Both quantize 1x32 with power-of-two scales rounded up, so weights match bit for bit.
[trainer.model.quantization]
type = "mxfp8"
recipe = "mxfp8_rceil_wgrad_with_hp"
# Keeps the default ignores (lm_head, router, gates, weights_proj, ...) and adds DeepSeek-V4's wo_a
# and compressors.
extra_ignore_patterns = ["o_a_proj", 'compressor\.']

[trainer.model.ac]
freq = 1

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.optim]
lr = 1e-6
weight_decay = 0.0

# Pinned off: vLLM derives it from `scale_fmt`, and this checkpoint has no `quantization_config`.
[inference.env_vars]
VLLM_USE_DEEP_GEMM_E8M0 = "0"

[inference.vllm]
dtype = "bfloat16"
quantization = "mxfp8"
tensor_parallel_size = 8
enable_expert_parallel = true
gpu_memory_utilization = 0.8
max_model_len = 4096
# Required: DeepSeek V4 sets `use_fp8_ds_mla_layout`, and sparse MLA asserts against `auto`.
kv_cache_dtype = "fp8"
block_size = 256

[inference.vllm.quantization_config]
# vLLM's deep_gemm_fp8_o_proj treats an MXFP8 `wo_a` as blockwise FP8 and fails a DeepGEMM assert.
ignore = ["*.wo_a"]
