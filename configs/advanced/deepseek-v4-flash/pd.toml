# DeepSeek-V4-Flash with online MXFP8 inference, P/D disaggregated on two nodes: one DP8+EP prefill node and one
# DP8+EP decode node, KV transfer over NIXL, vllm-router in PD mode on the prefill node's server port.
#
#   uv run inference @ configs/advanced/deepseek-v4-flash/pd.toml

[slurm]
job_name = "dsv4-pd"
partition = "all"

[deployment]
type = "disaggregated"
prefill_nodes_per_replica = 1
decode_nodes_per_replica = 1

[env_vars]
# The bf16 checkpoint has no `quantization_config`, so vLLM cannot derive this from `scale_fmt`.
VLLM_USE_DEEP_GEMM_E8M0 = "0"

[vllm]
model = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
dtype = "bfloat16"
quantization = "mxfp8"
enable_expert_parallel = true
# Each role's expert-parallel group fits one NVLink domain. vLLM's MXFP8 MoE kernels do not run behind the DeepEP
# backends P/D otherwise defaults to (decode fails to start, prefill falls back to weight-only Marlin).
all2all_backend = "flashinfer_nvlink_one_sided"
gpu_memory_utilization = 0.85
max_model_len = 131072
# DeepSeek V4's sparse-MLA layout only takes an fp8 KV cache, in 256-token blocks.
kv_cache_dtype = "fp8"
block_size = 256
tool_call_parser = "deepseek_v4"
reasoning_parser = "deepseek_v4"

[vllm.quantization_config]
ignore = ["*.wo_a", "*.indexer.*"]
