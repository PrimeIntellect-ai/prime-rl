# GLM-5.3: 16 training nodes and 16 P/D inference nodes behind vllm-router.

max_steps = 10000000
seq_len = 131072

[log]
level = "debug"

[slurm]

[deployment]
type = "multi_node"
num_train_nodes = 16
gpus_per_node = 8
num_infer_replicas = 1

[inference.deployment]
type = "disaggregated"
prefill_nodes_per_replica = 2
num_prefill_replicas = 4
decode_nodes_per_replica = 8
num_decode_replicas = 1

[inference.deployment.prefill_env_vars]
"VLLM_ENABLE_MOE_DP_CHUNK" = "0"
"VLLM_DEEP_GEMM_WARMUP" = "skip"
"UCX_RCACHE_MAX_UNRELEASED" = "1024"

[inference.deployment.decode_env_vars]
"VLLM_DEEP_GEMM_WARMUP" = "skip"
"UCX_RCACHE_MAX_UNRELEASED" = "1024"

[inference.deployment.prefill_vllm_overrides]
enable_dbo = true

[inference.deployment.decode_vllm_overrides]
max_num_batched_tokens = 96
max_num_seqs = 96

[inference.router]
type = "vllm-router"

[inference.vllm]
model = "zai-org/GLM-5.3-BF16"
dtype = "bfloat16"
quantization = "fp8_per_block"
max_model_len = 131072
tool_call_parser = "glm47"
reasoning_parser = "glm45"
gpu_memory_utilization = 0.75
enable_expert_parallel = true
enable_eplb = false
enable_ep_weight_filter = true
safetensors_load_strategy = "prefetch"

[ckpt]
interval = 100

[weight_broadcast]
type = "nccl"
port = 29502
timeout = 12000

[trainer]
dist_timeout_seconds = 1800

[trainer.model]
name = "zai-org/GLM-5.3-BF16"
impl = "custom"
attn = "flash_attention_2"
fused_lm_head_token_chunk_size = 1024
cp = 4
ep = 8

[trainer.model.quantization]
type = "fp8"

[trainer.model.moe.compute]
type = "deepgemm_fp8"

[trainer.model.ac]
freq = 1

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.0

[orchestrator]
batch_size = 256
group_size = 16
max_off_policy_steps = 8

[orchestrator.concurrency]
initial_inflight = 256
max_inflight = 512

[orchestrator.model]
name = "zai-org/GLM-5.3-BF16"

[orchestrator.renderer]
name = "glm-5.3"
clear_thinking = false

[orchestrator.train.sampling]
temperature = 1.0

[orchestrator.train.sampling.extra_body.chat_template_kwargs]
clear_thinking = false

[inference]
use_deep_gemm = true
enable_fp32_lm_head = true
