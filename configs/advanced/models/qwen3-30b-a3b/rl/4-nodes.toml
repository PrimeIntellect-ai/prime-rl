# Qwen3-30B-A3B Thinking: two training and two inference nodes.

max_steps = 1000
seq_len = 131072

[log]
level = "debug"

[slurm]

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 2

[ckpt]
interval = 100

[weight_broadcast]
type = "nccl"

[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
cp = 2

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 512
max_off_policy_steps = 16

[orchestrator.concurrency]
initial_inflight = 1024

[inference.vllm]
tensor_parallel_size = 8
