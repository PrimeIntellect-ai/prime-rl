max_steps = 3
seq_len = 2048

[slurm]
job_name = "nemotron-3.5-super-text"

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 1

[model]
name = "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16"

[trainer.model]
ep = 8

[trainer.model.ac]

[trainer.optim]
type = "adamw"

[orchestrator]
batch_size = 8

[orchestrator.train]
group_size = 2

[orchestrator.train.sampling]
max_completion_tokens = 128

[orchestrator.renderer]
name = "nemotron-3.5"

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference.vllm]
trust_remote_code = true
tensor_parallel_size = 8
language_model_only = true
max_model_len = 2048
