# Nemotron 3.5 Super text-only SWE-rebench-V2 validation on Model Factory.
# 4 trainer nodes + 4 TP8 inference replicas = 8 H200 nodes / 64 GPUs.
# Stage nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 on the named volume
# at models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 before dispatch.
# v0.10.1.dev160 is built from this branch's base commit with matching GPU dependencies.
#
# prime train configs/advanced/nemotron-3.5-super/swe-hosted.toml \
#   --ref 70bfbf0ace4b1a3d1714e87ba7a904a397d47255 --image-tag v0.10.1.dev160 \
#   --gpu-type H200_141GB --volume nemotron-35-super \
#   -e WANDB_API_KEY -e HF_TOKEN

max_steps = 20
seq_len = 131072

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[ckpt]
interval = 10
keep_last = 1

[trainer.log]
level = "debug"

[orchestrator.log]
level = "debug"

[model]
name = "/volume/models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16"

[monitors.wandb]
project = "nemotron-35-super"
name = "swerebench-4t4i-smoke"

[weight_broadcast]
type = "nccl"
timeout = 12000

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 1
num_infer_replicas = 4
orchestrator_on_inference = true

[trainer]
enable_router_replay = true
dist_timeout_seconds = 1800

[trainer.model]
attn = "flash_attention_3"
ep = 8
# Mamba head/group sharding supports CP8; each GPU handles 16K tokens.
cp = 8

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.0

[orchestrator]
batch_size = 32
max_staleness = 8

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 64
max_inflight = 128

[orchestrator.renderer]
name = "nemotron-3.5"
truncate_history_thinking = false

[orchestrator.train.sampling]
temperature = 1.0

[[orchestrator.train.source]]
name = "swerebench"
env.taskset.id = "swerebench-v2"
env.taskset.dataset_name = "PrimeIntellect/SWE-rebench-V2-Filtered-Verified"
env.agent.harness.id = "bash"
env.agent.runtime.type = "prime"
env.agent.runtime.labels = ["nemotron-35-super", "swerebench-smoke"]
env.agent.max_turns = 20
env.timeout.episode = 7200

[inference.vllm]
trust_remote_code = true
language_model_only = true
tensor_parallel_size = 8
enable_expert_parallel = true
enable_prefix_caching = true
max_model_len = 131072
# Leave headroom for receiving weights during policy updates.
gpu_memory_utilization = 0.75
max_num_seqs = 128
# Local model paths do not match the parser auto-detection rules.
tool_call_parser = "qwen3_coder"
reasoning_parser = "nemotron_v3"
safetensors_load_strategy = "prefetch"
