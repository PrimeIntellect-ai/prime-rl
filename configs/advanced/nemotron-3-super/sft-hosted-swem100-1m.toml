# Nemotron 3.5 Super (text backbone) — distillation SFT on GLM-5.3 swe-marathon-100 trajectories (OpenCode harness).
# Same recipe as sft-hosted-swem-1m.toml (the swe-marathon 1M redo, run iv9uiuy8hg61k8voxoei8o4t): 1M context, cp16/ep16,
# batch 6, lr 1e-5, warmup 10% of epoch 1, cosine to 1e-6, 4 epochs, val every 20 steps, best/last retention, text-only
# HF export at the end (user, 2026-11-03: "the same config as in the previous swe-marathon").
# prime train configs/advanced/nemotron-3-super/sft-hosted-swem100-1m.toml --volume nemotron-sft-swem100 \
#     -e ~/.config/prime-export/hf.env -y          # forwards HF_TOKEN for the end-of-run push; without it the
#                                                  # exports stay on the volume
#
# Starting checkpoint: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 @ fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe,
# trained as its text-only language model (/volume/models/nemotron-3.5-super-text). Check before every
# launch: data-prep/verify_checkpoint.py --revision fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe (exit 0).
#
# Data: datasets/nemotron-distill-sft-swem100-1m, subset swe-marathon-100, from export
# swe-marathon-100-glm53-measure-sft-20261103 (sha256 8fc30d26...ecef1; 1,185 rows = 100 tasks x 8 traces: 90
# swe-marathon-100 tasks + 10 PostTrainBench tasks; exported as 800 main conversations + 32 continuations after a
# compaction + 353 subagent conversations, every segment of a trace exactly once). Collected with OpenCode 2.0.26
# (341 traces) and 2.1.4 (459), compaction 1048576 / 917504 / 131072, GLM-5.3 at temperature 1.0 / reasoning effort
# high (traces: 528 internal high-throughput, 252 OpenRouter z-ai/glm-5.3 with reasoning restored from
# reasoning_details, 20 internal fast). Every rollout is kept: no reward filter (771
# reward-0 rows kept, incl. 32 PostTrainBench rollouts the harness stopped on a full disk), no teacher filter.
# Dropped: 15 rows with an interrupted provider stream and 19 conversations longer than the model's 1M context in
# Nemotron tokens. Build: handoff/nemotron-3.5-super-sft-swem100/data-prep.
#   train      1,041 rows, 90 tasks, 313.1M tokens, 206.5M loss tokens
#   validation   110 rows, 10 tasks (data-prep/swe-marathon-100-val-tasks.txt, 10% by task: 9 swe-marathon-100 +
#                1 PostTrainBench), 30.5M tokens
# Packed as the trainer packs them (seed 42, 2 data ranks x 2 workers, data-prep/packing.py): 377 packed rows in
# epoch 1 (62.83 steps at batch_size 6), 1,508 over 4 epochs (251.33 steps), ~4.98M tokens per step.
#
# Disk (5 TiB volume): a full checkpoint (fp32 params + AdamW state) is ~1.45 TB, the best snapshot (fp32 params
# only) ~0.48 TB, each HF export ~0.25 TB, models/ + datasets/ ~0.25 TB. Peak ~3.6 TB in all: the previous
# checkpoint + the one being written + best. End of run: 1.45 + 0.48 + 2 x 0.25 = 2.43 TB of run data.

image_tag = "v0.10.1.dev74"
# exp/nemotron-sft-swem100 = exp/nemotron-sft-v3 @ 9132030e2 (68deedf7c + configs) + this config. Code is identical
# to the swe-marathon / nl2repo 1M, GeneBench and ProgramBench runs.
source_ref = "exp/nemotron-sft-swem100"
gpu_type = "H200_141GB"

# 4 epochs: 1,508 packed rows / 6 = 251.33 steps (the 4 data streams' 4-epoch lengths are 369 / 368 / 401 / 370).
# No step count is exactly 4 epochs; 251 is the floor.
max_steps = 251
dist_timeout_seconds = 7200   # first step compiles (checkpoint saves use their own 4 h gloo timeout)

[scheduler]
type = "cosine"
warmup_steps = 6   # 10% of epoch 1 (62.83 steps); linear 1e-6 (step 1, start = min_lr) -> 1e-5 (step 7)
min_lr = 1e-6      # then cosine decay to 1e-6 at max_steps

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 4

[monitors.wandb]
project = "nemotron-3.5-super-sft"
name = "nemotron-3.5-super-distill-sft-swem100-1m-4ep"

[ckpt]
# Resumable checkpoints for crash recovery at 33, 66, ..., 231 (~0.53 epoch, ~1.6 h apart; a save takes ~205 s).
# The final step (251) is saved once, after the loop. None falls on a validation step (multiples of 20).
interval = 33
# Each full checkpoint is ~1.45 TB: keep only the latest (two exist while a new one is written). The final step
# is always saved. The best weights are kept separately ([val] keep_best).
keep_last = 1

[resume]

[model]
name = "/volume/models/nemotron-3.5-super-text"
attn = "flash_attention_3"
# seq_len 1048576 (1M, the model's max) at cp=16 / ep=16 on 32 GPUs: as the swe-marathon, nl2repo, GeneBench and
# ProgramBench 1M runs.
cp = 16
ep = 16
fused_lm_head_token_chunk_size = 1024

[model.ac]
token_chunk_size = 8192

[model.ac_offloading]
max_inflight_activations = 1

[model.compile]

[optim]
type = "adamw"
lr = 1e-5

[renderer]
name = "nemotron-3.5"
# OpenCode sends GLM-5.3 its past reasoning back (as in the swe-marathon and ProgramBench collections), so past
# reasoning stays in the rendered history.
truncate_history_thinking = false

[data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-swem100-1m"
seq_len = 1048576
batch_size = 6   # packed rows: ~5.0M tokens per step; 2 data ranks x 3 grad-accum micro-steps
micro_batch_size = 1
num_workers = 2
stopping_strategy = "all_exhausted"
shuffle = true
seed = 42
subsets = [
    "swe-marathon-100",
]
probabilities = [
    1.0,
]

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

# Validation on the held-out tasks: 38 packed rows per pass (19 per data rank), the same as the swe-marathon 1M run.
# The rows are stored in an order that packs evenly on
# the 2 data ranks (world 32 / cp 16 x num_workers 1): built with --val-data-ranks 2, keep shuffle = false and
# num_workers = 1.
# after_optimizer_step: val/loss at step N is the loss of the weights after N updates (what a checkpoint of step N
# holds), and the final step is validated too: base (eval_on_start, before step 1), then after steps 20, 40, ...,
# 240 and 251 (13 candidates).
# keep_best: the lowest of those losses keeps a weights-only snapshot in runs/<id>/best-weights/ (best.json: step,
# loss, every candidate's loss); the eval_on_start pass is not a candidate.
[val]
interval = 20
eval_on_start = true
after_optimizer_step = true
keep_best = true

[val.data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-swem100-1m"
subsets = [
    "swe-marathon-100",
]
splits = [
    "validation",
]
seq_len = 1048576
batch_size = 6
micro_batch_size = 1
num_workers = 1
shuffle = false

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false

# After the final step and checkpoint: the best and the last weights as text-only NemotronHForCausalLM models,
# written into the layout of /volume/models/nemotron-3.5-super-text (63 shards, 42,683 tensors; the untrained
# mtp.* tensors copied as they are) under runs/<id>/hf-export/{best,last}/, then pushed to private repos.
[hf_export]
checkpoints = ["best", "last"]
best_repo = "PrimeIntellect/Nemotron-3.5-Super-swe-marathon-100-sft-best"
last_repo = "PrimeIntellect/Nemotron-3.5-Super-swe-marathon-100-sft-last"
private = true
model_card = """
- Base: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 (revision fb0ee0bc), its language model only.
- Data: every GLM-5.3 swe-marathon-100 trajectory in the OpenCode harness (export
  swe-marathon-100-glm53-measure-sft-20261103; main conversations, continuations after compaction and subagent
  conversations; no reward or teacher filter, interrupted streams and conversations over 1M tokens dropped),
  90 training tasks, 1M-token packed sequences, 4 epochs, AdamW, peak learning rate 1e-5, cosine decay to 1e-6.
- Training rendered past assistant turns with their reasoning kept. To match it at inference, pass
  `chat_template_kwargs={"truncate_history_thinking": false}`.
"""
