# Nemotron 3.5 Super swe-marathon SFT -> Hugging Face export job (no training).
# prime train configs/advanced/nemotron-3-super/sft-hosted-hf-export.toml --volume nemotron-training -e ~/.config/prime-export/hf.env -y
#
# On source_ref exp/nemotron-sft-hf-export the SFT trainer runs src/prime_rl/trainer/sft/hf_export.py and exits.
# For step_104 of run hnp5pwsw3fx9p5b7r6bjmnnx and step_156 of run siuskw4we4txi09583x5x807, it does the following:
# - Loads only the model weights from the DCP checkpoint.
# - Rewrites the 64 safetensors files of nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
#   (fb0ee0bc; read from /volume/models/omni-src after a sha256 check) with the fine-tuned language-model tensors.
#   The vision tower, projector and the untrained MTP head are kept as they are.
# - Writes the result to /volume/runs/<thisRunId>/hf-export/<name>/.
# - Checks it against the release.
# - Pushes it to private repos in hf_export.HF_ORG (PrimeIntellect), using the forwarded HF_TOKEN.
#
# The model is built exactly as in training (same [model] topology, which loaded these checkpoints), except
# fusions are disabled so every parameter has its canonical name and shape. [data] and [renderer] are
# unused but kept so that the config validates like the training runs did.

image_tag = "v0.10.1.dev74"
source_ref = "exp/nemotron-sft-hf-export"
gpu_type = "H200_141GB"

max_steps = 1   # never reached: the export returns before the training loop
dist_timeout_seconds = 7200

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 4

[monitors.wandb]
project = "nemotron-3.5-super-sft"
name = "nemotron-3.5-super-distill-sft-swe-marathon-opencode-hf-export"

[ckpt]
# The platform points output_dir at /volume/runs/<runId>; the export writes under it. No checkpoint is saved.
interval = 26
keep_last = 1

[model]
name = "/volume/models/nemotron-3.5-super-text"
attn = "flash_attention_3"
cp = 16
ep = 16
fused_lm_head_token_chunk_size = 1024

[model.fusions]
enabled = []

[model.ac]
token_chunk_size = 8192

[model.ac_offloading]
max_inflight_activations = 1

[model.compile]

[optim]
type = "adamw"
lr = 1e-5

[renderer]
name = "nemotron-3.5"
truncate_history_thinking = false

[data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-v2"
seq_len = 655360
batch_size = 10
micro_batch_size = 1
num_workers = 2
stopping_strategy = "all_exhausted"
shuffle = true
seed = 42
subsets = [
    "swe-marathon",
]
probabilities = [
    1.0,
]

[data.loss_mask]
system = false
user = false
assistant = true
tool = false
