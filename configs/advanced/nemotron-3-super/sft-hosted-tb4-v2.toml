# Nemotron 3.5 Super (text backbone) — distillation SFT on GLM-5.3 tb4 (Terminal-Bench) trajectories, v2 data.
# The restart of sft-hosted-tb4-1m.toml (run eivawxtikvt75p1ietxg4lok): same recipe (1M context, 7 epochs, lr 1e-5,
# warmup over 10% of epoch 1, cosine to 1e-6) on the updated export, plus best/last checkpoint retention, an HF export at the end and
# the in-run pass@8 eval of both exports ([inrun_eval], PREREQS.md).
# prime train configs/advanced/nemotron-3-super/sft-hosted-tb4-v2.toml --volume nemotron-sft-tb4-v2 \
#     -e ~/.config/prime-export/hf.env -y
# hf.env holds HF_TOKEN only: the end-of-run push (without it the exports stay on the volume and the eval has no
# download fallback). `prime train -e` forwards only HF_TOKEN / WANDB_API_KEY for SFT runs. The eval's Prime
# credential is the platform's per-run PRIME_API_KEY in the pods (its presence is logged at the hand-off; without it
# the eval phase records no_credentials and ends); the team is [env_vars] PRIME_TEAM_ID (not a secret).
#
# Starting checkpoint: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 @ fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe,
# trained as its text-only language model (/volume/models/nemotron-3.5-super-text). Check before every
# launch: data-prep/verify_checkpoint.py --revision fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe (exit 0).
#
# Data: datasets/nemotron-distill-sft-tb4-1m-v2, subset tb4, from export tb4-glm53-measure-sft-20261027 (sha256
# 8bd3e535...; the 20261026 export plus terminal-bench/convolution_filters_english). NO rollout is filtered out:
# every GLM-5.3 rollout of all three endpoints (internal/glm-5.3-high-throughput 3,965, z-ai/glm-5.3 30, whose
# reasoning_details text became reasoning_content, internal/glm-5.3-fast 5), every reward (2,232 pass / 1,767 fail /
# 1 partial); 91 leaked per-rollout api_key values redacted in place in 74 rows. 4,000 rows / 500 tasks:
# train 3,600 rows / 450 tasks (449.0M tokens, 274.8M loss), validation 10% = 400 rows / 50 tasks
# (data-prep/tb4-val-tasks-v2.txt: the 44 frozen tasks + 6 zero-pass tasks; worst feature |SMD| 0.045), longest row
# 557,836 tokens. ~474 packed rows/epoch = ~78.7 steps/epoch at batch_size 6.
#
# Disk (5 TiB volume): a full checkpoint (fp32 params + AdamW state) is ~1.45 TB, the best snapshot (fp32 params
# only) ~0.48 TB, each HF export ~0.25 TB. Peak ~3.9 TB of run data (rolling checkpoint + one in flight + best +
# a best in flight) on top of models/ + datasets/. The volume must not hold old run directories.
# What stays on the volume after the run ([hf_export.cleanup], [inrun_eval]): the final checkpoint (1.45 TB), the
# best snapshot (best-weights/ + best.json, 0.48 TB), the two exports (2 x 0.25 TB; every node writes the same
# paths of the shared run dir, so one copy of each file) and runs/<id>/eval/ (results + compressed stores): ~2.4 TB
# of run data. Nothing is deleted: a delete on one node removes the file for every node (the run dir is shared), and
# a restart after the last step must still find best.json and its snapshot (it then trains nothing, reuses the
# checked exports and skips the checkpoints whose eval is complete).

image_tag = "v0.10.1.dev74"
# exp/nemotron-sft-tb4-v2 = 017c0883549e (the code that trained swe-marathon and the first TB4 run) + [val]
# after_optimizer_step / keep_best + [hf_export] + [inrun_eval]. Don't push other changes to it.
source_ref = "exp/nemotron-sft-tb4-v2"
gpu_type = "H200_141GB"

# Exactly 7 epochs: 551 is the fewest steps that consume all 7 epochs of train rows (checked row by row against
# the trainer's SFTDataset/CatDataset packing, seed 42, 2 data ranks x 2 workers); it also trains 294 samples of
# epoch 8 (~8% of an epoch). The trainer can't stop on epochs and the cosine schedule needs max_steps.
max_steps = 551
dist_timeout_seconds = 7200   # first step compiles (checkpoint saves use their own 4 h gloo timeout)

[scheduler]
type = "cosine"
warmup_steps = 8   # 10% of epoch 1 (~78.7 steps); linear 1e-6 -> 1e-5 (start = min_lr)
min_lr = 1e-6      # then cosine decay to 1e-6 at max_steps

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
PRIME_TEAM_ID = "cmlr3u2er002zhr01tj8f48ts"   # owns the private TB4 task images (in-run eval)

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 4

[monitors.wandb]
project = "nemotron-3.5-super-sft"
name = "nemotron-3.5-super-distill-sft-tb4-1m-v2-7ep"

[ckpt]
interval = 48   # resumable checkpoints for crash recovery, ~every 0.6 epoch
# Each full checkpoint is ~1.45 TB: keep only the latest (two exist while a new one is written). The final step
# is always saved. The best weights are kept separately ([val] keep_best).
keep_last = 1

[resume]

[model]
name = "/volume/models/nemotron-3.5-super-text"
attn = "flash_attention_3"
# seq_len 1048576 (1M, the model's max) at cp=16 / ep=16 on 32 GPUs: proven by eivawxtikvt75p1ietxg4lok
# (174 s/step, 69.4/140 GiB peak, no host OOM).
cp = 16
ep = 16
fused_lm_head_token_chunk_size = 1024

[model.ac]
token_chunk_size = 8192

[model.ac_offloading]
max_inflight_activations = 1

[model.compile]

[optim]
type = "adamw"
lr = 1e-5

[renderer]
name = "nemotron-3.5"
truncate_history_thinking = false

[data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-tb4-1m-v2"
seq_len = 1048576
batch_size = 6   # packed rows: ~5.8M tokens per step; 2 data ranks x 3 grad-accum micro-steps
micro_batch_size = 1
num_workers = 2
stopping_strategy = "all_exhausted"
shuffle = true
seed = 42
subsets = [
    "tb4",
]
probabilities = [
    1.0,
]

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

# Validation on the 50 held-out tasks: 400 rows, 50.3M tokens, 26 packed rows per data rank (~313 s per pass). The rows must
# be stored in an order that packs evenly on the 2 data ranks (world 32 / cp 16 x num_workers 1): build with
# --val-data-ranks 2, keep shuffle = false and num_workers = 1.
# after_optimizer_step: val/loss at step N is the loss of the weights after N updates (what a checkpoint of step N
# holds), and the final step is validated too. eval_on_start still measures the base model before step 1.
# keep_best: the lowest of those losses keeps a weights-only snapshot in runs/<id>/best-weights/ (best.json: step,
# loss, every candidate's loss); the eval_on_start pass is not a candidate.
[val]
interval = 20
eval_on_start = true
after_optimizer_step = true
keep_best = true

[val.data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-tb4-1m-v2"
subsets = [
    "tb4",
]
splits = [
    "validation",
]
seq_len = 1048576
batch_size = 6
micro_batch_size = 1
num_workers = 1
shuffle = false

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false

# After the final step and checkpoint: the best and the last weights as text-only NemotronHForCausalLM models,
# written into the layout of /volume/models/nemotron-3.5-super-text (63 shards, 42,683 tensors; the untrained
# mtp.* tensors copied as they are) under runs/<id>/hf-export/{best,last}/, then pushed to private repos.
[hf_export]
checkpoints = ["best", "last"]
best_repo = "PrimeIntellect/Nemotron-3.5-Super-tb4-v2-sft-best"
last_repo = "PrimeIntellect/Nemotron-3.5-Super-tb4-v2-sft-last"
private = true
model_card = """
- Base: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 (revision fb0ee0bc), its language model only.
- Data: GLM-5.3 Terminal-Bench (tb4) trajectories in the mini-swe-agent harness (export tb4-glm53-measure-sft-20261027),
  1M-token packed sequences, 7 epochs, AdamW, peak learning rate 1e-5, cosine decay to 1e-6.
- Training rendered past assistant turns with their reasoning kept. To match it at inference, pass
  `chat_template_kwargs={"truncate_history_thinking": false}`.
"""

# What the exports made redundant may be deleted, each only once its export is verified on Hugging Face. All off:
# the volume has room (5 TiB), and the best snapshot is what lets a restart keep the true best.
[hf_export.cleanup]
best_snapshot = false   # keep best-weights/ and best.json (0.48 TB)
# DECISION: true drops the 1.45 TB final checkpoint (parameters + optimizer state): the run could not be resumed or
# trained further. The 'last' export (bf16 weights) is on HF either way.
final_checkpoint = false
pushed_exports = false

# After the export, the 4 nodes serve vLLM (TP2 x DP4 with EP per node, 16 engines) and node 0 replays the TB4
# collection harness (sft-gen flow run, verifiers 24107a4ea, mini-swe-agent 2.4.6, the three collection runs'
# attempt_2 configs): 500 tasks x 8 rollouts per checkpoint, best then last ('best' at the final step is evaluated
# once). Results: runs/<id>/eval/<best|last>/summary.json (pass@k overall / val / train / per source), per_task.jsonl,
# the flow configs and logs, stores/*.tar.zst. Needs the eval bundle at /volume/datasets/tb4-eval (PREREQS.md).
# No wall-clock cap (budget_hours unset): every draw runs under the collection's own timeouts (rollout 86400 s,
# scoring up to 21600 s), so a checkpoint's round lasts until its slowest draw ends. Spec D5 is on (harness
# d5_exclude_newer = 2026-10-24T07:23Z, in-box uv 0.13.5: the defaults).
[inrun_eval]
checkpoints = ["best", "last"]
schedule = "sequential"

[inrun_eval.harness]
# Off: the probe was only validated with a user CLI key; if the platform's per-run token may create sandboxes but not
# list them, the probe would wrongly skip the whole eval. Without it, bad credentials show up as errored rollouts.
credential_probe = false
