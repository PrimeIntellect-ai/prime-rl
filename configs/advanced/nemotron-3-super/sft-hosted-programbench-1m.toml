# Nemotron 3.5 Super (text backbone) — distillation SFT on GLM-5.3 ProgramBench trajectories (OpenCode harness).
# Same recipe as sft-hosted-swem-1m.toml (1M context, cp16/ep16, lr 1e-5, warmup 10% of epoch 1, cosine to 1e-6,
# best/last retention, text-only HF export at the end) for 2 epochs: the data is ~7x swe-marathon's (2.30B training
# tokens, 512 steps per epoch), so the user chose 2 epochs and validation every ~0.2 epoch (2026-10-31).
# prime train configs/advanced/nemotron-3-super/sft-hosted-programbench-1m.toml --volume nemotron-sft-programbench \
#     -e ~/.config/prime-export/hf.env -y          # forwards HF_TOKEN for the end-of-run push; without it the
#                                                  # exports stay on the volume
#
# Starting checkpoint: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 @ fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe,
# trained as its text-only language model (/volume/models/nemotron-3.5-super-text). Check before every
# launch: data-prep/verify_checkpoint.py --revision fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe (exit 0).
#
# Data: datasets/nemotron-distill-sft-programbench-1m, subset programbench, from export
# programbench-glm53-measure-sft-20261031 (sha256 07f39831...1e64; 4,471 rows = 500 tasks x 8 traces, exported as
# 4,000 main conversations + 258 continuations after a compaction + 213 subagent conversations). Collected with
# OpenCode 2.1.4 (3 traces 2.0.26), compaction 1048576 / 917504 / 131072 (fired in 227 of the kept traces), GLM-5.3 at
# temperature 1.0 / reasoning effort high (3,024 traces via OpenRouter z-ai/glm-5.3, reasoning restored from
# reasoning_details; 976 internal). Every rollout is kept: no reward filter (285 reward-0 rows kept), no teacher
# filter. Dropped: 47 rows with an interrupted provider stream, and 137 conversations longer than the model's 1M
# context in Nemotron tokens (Nemotron needs ~10% more tokens than GLM-5.3; they fit GLM's window). Leaked
# per-rollout keys are redacted in place (157 rows). Build: handoff/nemotron-3.5-super-sft-programbench/data-prep.
#   train      3,863 rows, 450 tasks, 2,299.7M tokens, 1,779.7M loss tokens
#   validation   424 rows,  50 tasks (data-prep/programbench-val-tasks.txt, 10% by task, best-balanced of 20k
#                candidates, max |SMD| 0.080), 251.2M tokens
# Packed as the trainer packs them (seed 42, 2 data ranks x 2 workers, data-prep/packing.py): 3,072 packed rows in
# epoch 1 (512 steps at batch_size 6), 6,134 over 2 epochs (1,022.33 steps), ~4.5M tokens per step.
#
# Disk (5 TiB volume): a full checkpoint (fp32 params + AdamW state) is ~1.45 TB, the best snapshot (fp32 params
# only) ~0.48 TB, each HF export ~0.25 TB, models/ + datasets/ ~0.26 TB. Peak ~3.6 TB in all: the previous
# checkpoint + the one being written + best. End of run: 1.45 + 0.48 + 2 x 0.25 = 2.43 TB of run data.

image_tag = "v0.10.1.dev74"
# exp/nemotron-sft-programbench = exp/nemotron-sft-v3 @ 9132030e2 (68deedf7c + configs) + this config. Code is
# identical to the swe-marathon / nl2repo 1M and GeneBench runs.
source_ref = "exp/nemotron-sft-programbench"
gpu_type = "H200_141GB"

# 2 epochs: 6,134 packed rows / 6 = 1,022.33 steps. 1,022 is the floor.
max_steps = 1022
dist_timeout_seconds = 7200   # first step compiles (checkpoint saves use their own 4 h gloo timeout)

[scheduler]
type = "cosine"
warmup_steps = 51   # 10% of epoch 1 (512 steps); linear 1e-6 (step 1, start = min_lr) -> 1e-5 (step 52)
min_lr = 1e-6       # then cosine decay to 1e-6 at max_steps

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 4

[monitors.wandb]
project = "nemotron-3.5-super-sft"
name = "nemotron-3.5-super-distill-sft-programbench-1m-2ep"

[ckpt]
# Resumable checkpoints for crash recovery every 62 steps (~3 h at ~175 s/step; a save takes ~205 s): 62, 124, ...,
# 992. None falls on a validation step (multiples of 100). The final step is saved once, after the loop.
interval = 62
# Each full checkpoint is ~1.45 TB: keep only the latest (two exist while a new one is written). The final step
# is always saved. The best weights are kept separately ([val] keep_best).
keep_last = 1

[resume]

[model]
name = "/volume/models/nemotron-3.5-super-text"
attn = "flash_attention_3"
# seq_len 1048576 (1M, the model's max) at cp=16 / ep=16 on 32 GPUs: as the swe-marathon, nl2repo and GeneBench
# 1M runs.
cp = 16
ep = 16
fused_lm_head_token_chunk_size = 1024

[model.ac]
token_chunk_size = 8192

[model.ac_offloading]
max_inflight_activations = 1

[model.compile]

[optim]
type = "adamw"
lr = 1e-5

[renderer]
name = "nemotron-3.5"
# GLM-5.3 saw its past reasoning during collection (Nemotron tokens per row / GLM's last prompt ~1.10, with reasoning
# ~76% of the characters), so past reasoning stays in the rendered history.
truncate_history_thinking = false

[data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-programbench-1m"
seq_len = 1048576
batch_size = 6   # packed rows: ~4.5M tokens per step; 2 data ranks x 3 grad-accum micro-steps
micro_batch_size = 1
num_workers = 2
stopping_strategy = "all_exhausted"
shuffle = true
seed = 42
subsets = [
    "programbench",
]
probabilities = [
    1.0,
]

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

# Validation on the held-out tasks: 332 packed rows per pass (166 per data rank), ~37 min per pass (GeneBench
# measured ~6.6 s per validation row). The rows are stored in an order that packs evenly on the 2 data ranks
# (world 32 / cp 16 x num_workers 1): built with --val-data-ranks 2, keep shuffle = false and num_workers = 1.
# after_optimizer_step: val/loss at step N is the loss of the weights after N updates, and the final step is
# validated too: base (eval_on_start, before step 1), then after steps 100, 200, ..., 1000 and 1022 (11
# candidates, ~0.2 epoch apart).
# keep_best: the lowest of those losses keeps a weights-only snapshot in runs/<id>/best-weights/ (best.json: step,
# loss, every candidate's loss); the eval_on_start pass is not a candidate.
[val]
interval = 100
eval_on_start = true
after_optimizer_step = true
keep_best = true

[val.data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-programbench-1m"
subsets = [
    "programbench",
]
splits = [
    "validation",
]
seq_len = 1048576
batch_size = 6
micro_batch_size = 1
num_workers = 1
shuffle = false

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false

# After the final step and checkpoint: the best and the last weights as text-only NemotronHForCausalLM models,
# written into the layout of /volume/models/nemotron-3.5-super-text (63 shards, 42,683 tensors; the untrained
# mtp.* tensors copied as they are) under runs/<id>/hf-export/{best,last}/, then pushed to private repos.
[hf_export]
checkpoints = ["best", "last"]
best_repo = "PrimeIntellect/Nemotron-3.5-Super-programbench-sft-best"
last_repo = "PrimeIntellect/Nemotron-3.5-Super-programbench-sft-last"
private = true
model_card = """
- Base: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 (revision fb0ee0bc), its language model only.
- Data: every GLM-5.3 ProgramBench trajectory in the OpenCode harness (export programbench-glm53-measure-sft-20261031;
  main conversations, continuations after compaction and subagent conversations; no reward or teacher filter,
  interrupted streams and conversations over 1M tokens dropped), 450 training tasks, 1M-token packed sequences,
  2 epochs, AdamW, peak learning rate 1e-5, cosine decay to 1e-6.
- Training rendered past assistant turns with their reasoning kept. To match it at inference, pass
  `chat_template_kwargs={"truncate_history_thinking": false}`.
"""
