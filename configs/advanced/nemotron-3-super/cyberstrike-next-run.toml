[orchestrator.train.source.select.exclude]
idx = [566]

[orchestrator.concurrency]
# AIMD observes KV, running requests, queue depth, and preemptions. Six inference
# replicas x DP4 = 24 DP schedulers. initial 512 averages ~21 episodes/scheduler;
# max 800 averages ~33. This follows the 600->700 probe based on low measured
# KV, zero waiting, and unsaturated env gates, not a claimed safe ceiling.
min_inflight = 384
initial_inflight = 800
max_inflight = 1200

[orchestrator.renderer]
name = "nemotron-3.5"
truncate_history_thinking = false

[orchestrator.eval]
# Run the base-policy eval for comparison, then full 300-rollout evals at
# steps 40/80/120/160/200. Completed valid epochs are deduplicated on resume.
interval = 40
skip_first_step = false
retrigger_on_resume = true

[[orchestrator.eval.source]]
name = "cyberstrike-heldout"
# Three samples per held-out task = 150 rollouts per eval. Preserve the
# pass@1..3 metric quality and continuous_reward-based BEST selection.
group_size = 3

[orchestrator.eval.source.env]
id = "prime/cyberstrike-env@0.1.4"

[orchestrator.eval.source.env.taskset]
id = "cyberstrike-harbor"
dataset = "cyberstrike-vendor@72702ad4d19f"
registry_path = "/volume/datasets/cyberstrike/registry.json"
artifact_max_bytes = 1073741824

[orchestrator.eval.source.env.taskset.task]
reward_key = "continuous_reward"

[orchestrator.eval.source.env.agent.harness]
id = "rlm"
version = "5cdeebad72fd2b2cfa300f5c4b45d74066b97f5a"
max_depth = 0
builtin_tools = ["bash", "edit", "ipython"]
allow_git = false
forward_env = []
exec_timeout = 3600
# Client requirement: no turn limit. max_total_turns stays unset (None = uncapped).
# Disable the 10M cumulative new-token budget; context compaction remains enabled.
max_total_tokens = 0

[orchestrator.eval.source.env.agent.harness.env]
UV_CACHE_DIR = "/tmp/vf-uv-cache"
RLM_EXTRA_UV_ARGS = "--no-cache"
# uv install receipt/completions can't write to a non-root agent's $HOME/.config on some
# images; install unmanaged + skip profile writes (see train block). Binary-only install.
UV_UNMANAGED_INSTALL = "1"
INSTALLER_NO_MODIFY_PATH = "1"

[orchestrator.eval.source.env.agent.harness.compaction]
summarize_at_tokens = 524288

[orchestrator.eval.source.env.agent.runtime]
type = "prime"
region = "us"
idle_timeout = 3600.0
creates_per_min = 60
allow = []
labels = [
    "nemotron-3.5-super-cyberstrike-next-v1",
]

[orchestrator.eval.source.env.agent.timeout]
# Set to 28800 (8h): measured on vnt6/fjg2/j2x8mw the real rollout tail maxes at ~138 min
# across ~2550 rollouts and NONE hit the original 28800 (8h) cap. 5400 (90 min) truncated the
# ~5-14% long tail (biasing the held-out curve); 14400 gives ~3x margin over the 138-min max
# for training to lengthen rollouts, and the off-policy staleness sweep drops stuck stragglers.
# A rollout timeout stops the trace as `rollout_timeout` (not an error) and still scores.
rollout = 28800.0
setup = 3600.0
finalize = 3600.0
scoring = 3600.0

[orchestrator.eval.source.env.timeout]
episode = 86400.0

[orchestrator.eval.source.env.retries]
rules = [
    { type = "ProviderError", status_code = [404], max_retries = 0 },
    { type = "HarnessError", message = "Error code: 404", max_retries = 1 },
    { type = "ProviderError", max_retries = 3 },
    { type = "SandboxError", max_retries = 3 },
    { type = "HarnessError", max_retries = 3 },
]

# Env-server backpressure for the eval pool (eval epoch runs ~300 concurrent -> 3 workers covers
# it). Same caveat as train: runaway-backstop consistent with the target, not a measured limit.
[orchestrator.eval.source.serve]
max_concurrent = 128

[orchestrator.eval.source.serve.pool]
type = "elastic"
max_workers = 3
multiplex = 128

