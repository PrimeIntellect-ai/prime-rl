# Nemotron 3.5 Super (text backbone): compound distillation SFT C2 on GLM-5.3 trajectories: ProgramBench (1,375 tasks) + NL2Repo (200).
# Extension B of the Nvidia QC plan, on the recipe of the single runs (1M context, batch 6, lr 1e-5, warmup,
# cosine to 1e-6, held-out tasks validated ~10 times, best/last retention, text-only HF export at the end).
# User, 2026-11-07: each dataset's share = its best single-run epochs rounded to the nearest whole number; most recent
# export of every dataset.
# 8-node variant of sft-hosted-compound-c2-1m.toml: the layout of the abundant-programbench run m7js89tt (8x8 H200,
# cp32/ep32, ~100 s/step at ~4.9M tokens/step). Same data, recipe, steps, data order and validation packing: at 64 GPUs
# cp32 leaves the same 2 data ranks x 3 grad-accum micro-steps as cp16 at 32 GPUs, so batch 6 and the 4 train streams
# (2 ranks x 2 workers) are unchanged. Only num_train_nodes and cp/ep differ from the 4-node config.
# prime train configs/advanced/nemotron-3-super/sft-hosted-compound-c2-8nodes-1m.toml \
#     --volume nemotron-sft-nl2repo -e ~/.config/prime-export/hf.env -y
# (nemotron-sft-nl2repo, expanded to 7 TiB: it already holds the verified base model; the single run's outputs
# under runs/ stay untouched)
#
# Starting checkpoint: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 @ fb0ee0bc6b3f70342afd8d84cb80dbadbaa8a1fe,
# trained as its text-only language model (/volume/models/nemotron-3.5-super-text).
#
# Data: datasets/nemotron-distill-sft-compound-c2-1m, built by handoff/nemotron-3.5-super-sft-compound/data-prep. Subset `mix` holds every train row
# k times in a fixed order (each dataset's copies are its epochs, spread evenly over the run), so shuffle = false and one
# pass is the whole run; the trainer's subsets + probabilities cannot give exact repeats. No re-render: rows and token
# counts are the single datasets'. No reward or teacher filter; only interrupted streams and rows over 1M were dropped
# at build.
#   dataset                k  best at (epochs)  export
#   programbench           2  1.96 (step 1000, run capped at 2 epochs)  programbench-glm53-measure-sft-20261031
#   abundant-programbench  2  2.00 (step 1117 = last, run m7js89ttdf85m4s6r3gccg4v, capped at 2 epochs)  abundant-programbench-glm53-measure-sft-20261106
#   nl2repo                2  1.95 (step 200)  nl2repo-glm53-measure-sft-20261106
#   23,868 rows (11,934 distinct), 11,079.1M tokens, 8,279.5M loss tokens
#
# Disk: a full checkpoint is ~1.45 TB, the best snapshot ~0.48 TB, each HF export ~0.25 TB. Peak ~3.4 TB for this run
# (previous checkpoint + the one being written + best), plus up to 6 arrow copies of the mix.
image_tag = "v0.10.1.dev74"
# exp/nemotron-sft-compound = a96965c3f (the code of the single runs) + the resume fix 63274c75e + [val] per_subset + these
# configs. Neither change touches the training path.
source_ref = "exp/nemotron-sft-compound"
gpu_type = "H200_141GB"

# One pass over the mix: all 4 data streams pack into 3,525 rows, 4 x that / 6 = 2,350 steps; every row trains exactly k times.
max_steps = 2350
dist_timeout_seconds = 7200   # first step compiles (checkpoint saves use their own 4 h gloo timeout)

[scheduler]
type = "cosine"
warmup_steps = 117   # 10% of one pass over all rows (the sum of the single runs' warmups); linear 1e-6 (step 1) -> 1e-5 (step 118)
min_lr = 1e-6       # then cosine decay to 1e-6 at max_steps

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 8

[monitors.wandb]
project = "nemotron-3.5-super-sft"
name = "nemotron-3.5-super-distill-sft-compound-c2-1m"

[ckpt]
# Resumable checkpoints for crash recovery every 62 steps: 62, 124, ..., 2294. None falls on a validation step
# (multiples of 235). The final step is saved once, after the loop.
interval = 62
# Each full checkpoint is ~1.45 TB: keep only the latest (two exist while a new one is written). The final step
# is always saved. The best weights are kept separately ([val] keep_best).
keep_last = 1

[resume]

[model]
name = "/volume/models/nemotron-3.5-super-text"
attn = "flash_attention_3"
# seq_len 1048576 (1M, the model's max) at cp=32 / ep=32 on 64 GPUs: as the abundant-programbench run m7js89tt
# (cp16 at 64 GPUs would need a batch divisible by 4).
cp = 32
ep = 32
fused_lm_head_token_chunk_size = 1024

[model.ac]
token_chunk_size = 8192

[model.ac_offloading]
max_inflight_activations = 1

[model.compile]

[optim]
type = "adamw"
lr = 1e-5

[renderer]
name = "nemotron-3.5"
# GLM-5.3 saw its past reasoning during collection (Nemotron tokens per row / GLM's last prompt ~1.10, with reasoning
# ~76% of the characters), so past reasoning stays in the rendered history.
truncate_history_thinking = false

[data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-compound-c2-1m"
seq_len = 1048576
batch_size = 6   # packed rows: ~4.7M tokens per step; 2 data ranks x 3 grad-accum micro-steps
micro_batch_size = 1
num_workers = 2
stopping_strategy = "all_exhausted"
shuffle = false   # the file order is the plan
seed = 42
subsets = [
    "mix",
]
probabilities = [
    1.0,
]

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

# Validation on the held-out tasks: 780 packed rows per pass, ~100 min on 4 nodes (~66 min expected here, from m7js89tt: 380 rows in ~32 min). [val] per_subset validates each dataset's split on its own,
# in its stored order, as in its single run: val/<dataset>/loss per dataset, and val/loss = their token-weighted mean, which
# keep_best compares. The rows are stored in an order that packs evenly on the 2 data ranks: keep shuffle = false and
# num_workers = 1.
# after_optimizer_step: base (eval_on_start, before step 1), then after steps 235, 470, ..., 2350 and 2350. keep_best: the lowest of
# those losses keeps a weights-only snapshot in runs/<id>/best-weights/; the eval_on_start pass is not a candidate.
[val]
interval = 235
per_subset = true
eval_on_start = true
after_optimizer_step = true
keep_best = true

[val.data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-compound-c2-1m"
subsets = [
    "programbench",
    "abundant-programbench",
    "nl2repo",
]
splits = [
    "validation",
    "validation",
    "validation",
]
seq_len = 1048576
batch_size = 6
micro_batch_size = 1
num_workers = 1
shuffle = false

[val.data.loss_mask]
system = false
user = false
assistant = true
tool = false

# After the final step and checkpoint: the best and the last weights as text-only NemotronHForCausalLM models,
# written into the layout of /volume/models/nemotron-3.5-super-text (63 shards, 42,683 tensors; the untrained
# mtp.* tensors copied as they are) under runs/<id>/hf-export/{best,last}/, then pushed to private repos.
[hf_export]
checkpoints = ["best", "last"]
best_repo = "PrimeIntellect/Nemotron-3.5-Super-compound-c2-sft-best"
last_repo = "PrimeIntellect/Nemotron-3.5-Super-compound-c2-sft-last"
private = true
model_card = """
- Base: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 (revision fb0ee0bc), its language model only.
- Data: compound C2 of GLM-5.3 trajectories, every row repeated k times: programbench x2, abundant-programbench x2, nl2repo x2 (exports 20261031, 20261106, 20261106; no reward or teacher filter, interrupted streams and conversations over 1M tokens dropped), 2,350 steps,
  1M-token packed sequences, AdamW, peak learning rate 1e-5, cosine decay to 1e-6.
- Trained on 64 NVIDIA H200 GPUs (8 nodes), context parallelism 32, expert parallelism 32.
- Training rendered past assistant turns with their reasoning kept. To match it at inference, pass
  `chat_template_kwargs={"truncate_history_thinking": false}`.
"""
