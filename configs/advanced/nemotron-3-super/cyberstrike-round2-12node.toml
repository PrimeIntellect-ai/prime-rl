[inference.vllm]
max_model_len = 655360
tool_call_parser = "qwen3_coder"
reasoning_parser = "nemotron_v3"
# TP2/DP4 with EP8: 64/512 experts per GPU and four DP schedulers per node.
# Startup confirmed EP8. Keep sticky_least_loaded routing and Mamba prefix caching:
# current logs show ~95% prefix hits and essentially zero waiting. TP4 would halve
# DP lanes without reducing KV heads/GPU, so it is not a latency default here.
tensor_parallel_size = 2
data_parallel_size = 4
enable_expert_parallel = true
enable_prefix_caching = true
gpu_memory_utilization = 0.85
mamba_cache_dtype = "float32"
safetensors_load_strategy = "prefetch"
max_num_seqs = 256
max_num_batched_tokens = 8192
all2all_backend = "allgather_reducescatter"
dtype = "bfloat16"
seed = 0

# Exact stored dataset registry and selected keys were checked; known malformed
# grader fallbacks missing continuous/binary channels intentionally fail TaskError.
# Native CPU checkpoint/tiny-DCP tests passed; Linux/GPU and full-size export remain unexercised.
