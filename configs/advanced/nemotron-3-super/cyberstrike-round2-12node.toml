# Nemotron 3.5 Super — CyberStrike throughput candidate on 12 nodes (96 H200 GPUs).
# Checkpoint and 150-rollout held-out validation every 20 steps; base eval enabled.
# Composite training reward, dual-metric BEST + LATEST retention, final private Hub upload.
# 4 trainer nodes (CP16/EP16) + 8 one-node inference replicas (TP2/DP4, EP8).
# Per-rank diagnostics: <run_dir>/diagnostics/; native output remains in torchrun logs.
# Prepared only: no launch or resume is authorized by this file.
# Composite code and environment 0.1.5 are published; this source pin is immutable.
# LAUNCH GATE: verify HF write credentials, final export host RAM and exact resume.
# HF_TOKEN must reach the orchestrator; final export/upload is part of run completion.
# max_steps=200 is the total training horizon, not 200 additional steps after resume.
# No resume path is set: choose and verify the joint checkpoint before any continuation.
# GeneBench H200 measurements motivate these limits; CyberStrike throughput is unmeasured.
# Monitor prefix hit, output tok/s, policy lag, sandbox errors and held-out reward together.

# Base image + source overlay: image provides the heavy wheels (lockfile matches the
# branch: vllm 0.32.0); source_ref overlays feat/nemotron-h-long-context-cp (audited sha).
image_tag = "v0.10.1.dev74"
# Immutable source overlay includes the application-route watchdog and drain-safe pool.
# Backend accepts canonical branch names for unmerged code, not raw SHAs.
# Verified branch target: f55fab28722a332af84d1af1d3ca22bfeb31f90d; recheck prepare resolution before launch.
source_ref = "feat/cyberstrike-composite-source"
gpu_type = "H200_141GB"

max_steps = 200
seq_len = 655360

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
VLLM_HTTP_TIMEOUT_KEEP_ALIVE = "120"
# Bring-up insurance: INIT,NET only logs during NCCL communicator setup (a startup
# burst, not per-step), so if this run's allocation stalls at the trainer<->inference
# NCCL broadcast it names the stuck rank/transport instead of hanging silently.
NCCL_DEBUG = "INFO"
NCCL_DEBUG_SUBSYS = "INIT,NET"
# Per-rank trainer logs, EP/chunk events, and host/GPU sampling on the run volume.
PRL_CRASH_DIAGNOSTICS = "1"
PRL_DIAGNOSTICS_SAMPLE_INTERVAL = "30"
TORCH_LOGS = "recompiles"

[log]
level = "debug"

[deployment]
type = "multi_node"
gpus_per_node = 8
# Four trainer nodes (32 GPUs) plus eight one-node inference replicas (64 GPUs).
# TP2/DP4 gives four DP schedulers per inference node, 32 total.
num_train_nodes = 4
num_infer_nodes = 1
num_infer_replicas = 8
orchestrator_on_inference = true

[monitors.wandb]
project = "nemotron-3.5-super-cyberstrike"
name = "nemotron-3.5-super-cyberstrike-round2-12node"

[weight_broadcast]
type = "nccl"
# The trainer waits for the inference pool to join each step's weight broadcast, but the
# receiver can't join until it finishes the current (very long, deep-rollout) eval epoch.
# The 3600s default tripped "TimeoutError: No receiver joined the broadcast within 3600s"
# (transports/weights/base.py:87) ~hourly on the huge step-0 batch+eval, SIGTERM-restarting
# the whole run in a loop (0 steps sealed in 5h, run fjg2r4ydcyitj7f59thvofmh). The source
# comment there prescribes raising weight_broadcast.timeout; 12h comfortably covers the
# step-0 eval epoch. It's a c10d store wait (wait_for_master), independent of
# dist_timeout_seconds (the NCCL watchdog), so this doesn't delay genuine-hang detection.
timeout = 43200

[ckpt]
interval = 20
# Three logical roles, up to three distinct checkpoints once pending evals resolve.
# In-progress writes, pending evals and the newest resumable joint checkpoint stay safe.
keep_last = 1
export = true
best_metrics = ["training_reward", "continuous_reward"]
hf_repo_prefix = "PrimeIntellect/Nemotron-3.5-Super-cyberstrike-rl"


[model]
name = "/volume/models/nemotron-3.5-super-text"

[trainer]
# Raised 3600->9000 (2.5h): the NCCL watchdog killed step 0's weight-transfer collective
# at the 1h default once collection ran long (the 2nd timeout loop, after weight_broadcast).
# With batch_size=32 step 0 is ~1h, so 9000 gives margin without a huge genuine-hang delay.
dist_timeout_seconds = 9000
enable_router_replay = false

[trainer.model]
attn = "flash_attention_3"
# CP16 halves the sequence shard to 40,960 tokens/rank, reducing activation offload.
# EP must be a multiple of CP. Persistent states remain 32-way sharded in this branch.
cp = 16
ep = 16
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]
token_chunk_size = 8192

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.0
max_norm = 1.0

[trainer.ckpt]
skip_optimizer = false

[orchestrator]
# batch_size = number of EPISODES (rollouts) per training step, NOT groups (verified in
# orchestrator/train_sink.py: pending_batch is keyed by trace_id and cut when
# len(pending_batch) >= batch_size). So distinct prompts/step = batch_size / group_size.
# 256 / 16 = 16 prompt groups per step, matching GeneBench round 2.
# This doubles episodes per optimizer update; unchanged max_steps is not equal episode cost.
# Allow up to 32 policy steps of lag for longer rollouts; this is not a freshness guarantee.
batch_size = 256
max_off_policy_steps = 32

[orchestrator.train]
group_size = 16

[orchestrator.train.sampling]
temperature = 1.0
top_p = 1.0

[orchestrator.model.client.timeout]
connect = 30.0
read = 1800.0
write = 60.0
pool = 60.0

[orchestrator.train.algo]
type = "grpo"

[[orchestrator.train.source]]
name = "cyberstrike"
group_size = 16

[orchestrator.train.source.curriculum.sampler]
type = "standard"

[orchestrator.train.source.curriculum.gates.zero_advantage]
# Keep exact-zero gating: GeneBench's +/-1e-6 bound assumes its discrete rewards,
# which is not established for CyberStrike continuous_reward.
type = "advantage_range"
reject_min = 0.0
reject_max = 0.0

[orchestrator.train.source.env]
id = "prime/cyberstrike-env@0.1.5"

[orchestrator.train.source.env.taskset]
id = "cyberstrike-harbor"
dataset = "cyberstrike-vendor@72702ad4d19f"
registry_path = "/volume/datasets/cyberstrike/registry.json"
artifact_max_bytes = 1073741824

[orchestrator.train.source.env.taskset.task]
# Keep grader metrics unchanged; use continuous_reward + binary_reward for optimization.
reward_key = "training_reward"

[orchestrator.train.source.env.agent.harness]
id = "rlm"
version = "5cdeebad72fd2b2cfa300f5c4b45d74066b97f5a"
max_depth = 0
builtin_tools = ["bash", "edit", "ipython"]
allow_git = false
forward_env = []
exec_timeout = 3600
# Client requirement: no turn limit. max_total_turns stays unset (None = uncapped).
# Disable the 10M cumulative new-token budget; context compaction remains enabled.
max_total_tokens = 0

[orchestrator.train.source.env.agent.harness.env]
# Tasks run the agent as a non-root user, so verifiers installs rlm as root while the
# agent's `uv sync --script` runs as that user; a uv cache root touched first is EACCES
# for the agent. Root's only uv call is nano-rlm's `uv tool install`, which forwards
# RLM_EXTRA_UV_ARGS, so `--no-cache` there leaves no root-owned cache and the agent
# creates this one itself. (The agent's cache must persist: uv keeps the script's venv in it.)
UV_CACHE_DIR = "/tmp/vf-uv-cache"
RLM_EXTRA_UV_ARGS = "--no-cache"
# Some task images run the agent as a non-root user whose $HOME/.config is not
# agent-writable; uv's standalone installer then fails writing its receipt and shell
# completions there (HarnessError: "failed to prepare uv script: ... uv-receipt.json:
# Permission denied"). Install uv unmanaged + skip profile writes so the installer only
# drops the binary at UV_INSTALL_DIR and touches nothing under the agent's home. Verified
# in Docker across non-writable-.config, non-writable-$HOME, healthy, and root images.
UV_UNMANAGED_INSTALL = "1"
INSTALLER_NO_MODIFY_PATH = "1"

[orchestrator.train.source.env.agent.harness.compaction]
summarize_at_tokens = 524288

[orchestrator.train.source.env.agent.runtime]
type = "prime"
region = "us"
idle_timeout = 3600.0
# Shared train/eval provisioning budget; confirm quota before launch.
creates_per_min = 140
allow = []
labels = [
    "nemotron-3.5-super-cyberstrike-round2-12node",
]

[orchestrator.train.source.env.agent.timeout]
# Set to 28800 (8h): measured on vnt6/fjg2/j2x8mw the real rollout tail maxes at ~138 min
# across ~2550 rollouts and NONE hit the original 28800 (8h) cap. 5400 (90 min) truncated the
# ~5-14% long tail (biasing the held-out curve); 14400 gives ~3x margin over the 138-min max
# for training to lengthen rollouts, and the off-policy staleness sweep drops stuck stragglers.
# A rollout timeout stops the trace as `rollout_timeout` (not an error) and still scores.
rollout = 28800.0
setup = 3600.0
finalize = 3600.0
scoring = 3600.0

[orchestrator.train.source.env.timeout]
episode = 86400.0

[orchestrator.train.source.env.retries]
rules = [
    { type = "ProviderError", status_code = [404], max_retries = 0 },
    { type = "HarnessError", message = "Error code: 404", max_retries = 1 },
    { type = "ProviderError", max_retries = 3 },
    { type = "SandboxError", max_retries = 3 },
    { type = "HarnessError", max_retries = 3 },
]

# Train-side capacity: 25 workers x 128 episodes = 3200, matching max_inflight.
# Workers are processes, not extra GPU nodes. This is a backstop, not a measured safe
# host-memory limit; monitor env-server memory and startup failures at this scale.
[orchestrator.train.source.serve]
max_concurrent = 128

[orchestrator.train.source.serve.pool]
type = "elastic"
max_workers = 25
multiplex = 128

