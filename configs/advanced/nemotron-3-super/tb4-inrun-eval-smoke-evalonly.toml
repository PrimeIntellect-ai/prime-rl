# EVAL-ONLY SMOKE of the in-run TB4 eval ([inrun_eval], PREREQS.md): no training. The trainer goes straight to the
# hand-off (eval_only), serves the GA text backbone with vLLM on 1 node and runs the collection harness on the 3 tasks
# of /volume/datasets/tb4-eval/smoke-tasks.txt, 1 rollout each. A quick check of serving + harness + credentials only;
# the production path (training, per-node export, two rounds, cross-node) is tb4-inrun-eval-smoke.toml.
# prime train configs/advanced/nemotron-3-super/tb4-inrun-eval-smoke-evalonly.toml --volume nemotron-sft-tb4-v2 -y
# (no -e: nothing is pushed; the Prime credential is the platform's per-run PRIME_API_KEY, the team [env_vars].)
# Then read runs/<id>/eval/base/summary.json and status.json (after the run's sync), and the run's log for the
# credential line ("PRIME_API_KEY present: yes"), the hand-off, the vLLM start-up time, "harness ready", the probe and
# the flow runs.

image_tag = "v0.10.1.dev74"
source_ref = "exp/nemotron-sft-tb4-v2"
gpu_type = "H200_141GB"

max_steps = 1   # unused (eval_only: no training step runs)

[env_vars]
PRIME_TEAM_ID = "cmlr3u2er002zhr01tj8f48ts"

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 1

[model]
name = "/volume/models/nemotron-3.5-super-text"

[renderer]   # never used (eval_only); SFTConfig requires the typed renderer
name = "nemotron-3.5"
truncate_history_thinking = false

[data]
type = "sft"
name = "/volume/datasets/nemotron-distill-sft-tb4-1m-v2"   # never loaded (eval_only)
seq_len = 1048576
batch_size = 1
micro_batch_size = 1

[inrun_eval]
eval_only = true
model_dir = "/volume/models/nemotron-3.5-super-text"
model_name = "base"
# Optional safety cap for the smoke only (the real run has none): draws it cuts are reported as 'cut', not failures.
budget_hours = 8
reserve_minutes = 30
keep_work_dir = false

[inrun_eval.harness]
tasks_file = "/volume/datasets/tb4-eval/smoke-tasks.txt"
k = 1
expected_tasks = 3
