# Nemotron 3.5 Super - swe-marathon eval: SFT after 2 epochs (run hnp5pwsw3fx9p5b7r6bjmnnx step 104; HF PrimeIntellect/Nemotron-3.5-Super-swe-marathon-sft-ep2).
# A pure eval under the training setup (OpenCode 2.0.26, 640K context, compaction at 512K, 131,072-token output
# limit, no turn cap, temperature 1.0, past reasoning kept: truncate_history_thinking = false).
# Every task runs 8x; reward = fraction of the task's deterministic tests passed (no LLM judge).
# Hosted eval-only RL run: inference serves the model and the orchestrator's step-0 (v0) eval runs the tasks
# in Prime sandboxes, graded like the training data (open network while the task's tests install their
# requirements); the one training step is a no-op (lr 0, debug algo).
#   prime train configs/advanced/nemotron-3-super/swe-marathon-eval/sft-ep2.toml --volume nemotron-training -y
# (one RL run per volume: the volume takes a single writer)
# Traces and per-rollout rewards: /volume/runs/<runId>/monitors/file/traces/stream/00000.jsonl and
# stream.index.jsonl (eval records with run.work.step == 0). Reaching max_steps forces a second eval epoch
# (same weights): stop the run once the orchestrator logs "Evaluated swe-marathon | Policy v0".

image_tag = "v0.10.1.dev74"
source_ref = "exp/nemotron-swe-marathon-eval"   # = prime-rl 017c0883 (the SFT runs' commit) + these configs
gpu_type = "H200_141GB"

max_steps = 1
# Only bounds the no-op train step (train samples longer than this are truncated, not dropped).
# Eval context is bounded by inference.vllm.max_model_len, not by seq_len.
seq_len = 131072

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
VLLM_HTTP_TIMEOUT_KEEP_ALIVE = "120"
NCCL_DEBUG = "INFO"
NCCL_DEBUG_SUBSYS = "INIT,NET"
# Two broadcasts only (v0 at start, v1 after the no-op step): TCP is slow but robust to the IB fault.
NCCL_IB_DISABLE = "1"

[deployment]
type = "multi_node"
gpus_per_node = 8
# 2 train nodes (cp 8 / ep 8, started up in run c5mvu) holding the model in bf16 (optimization_dtype): per node the
# same GPU and host-RAM footprint as the proven 4-node fp32 runs (jkp21, xbm6). The checkpoints are bf16, so the
# weights broadcast to inference are exactly the checkpoint's.
num_train_nodes = 2
num_infer_nodes = 1      # nodes per inference replica
num_infer_replicas = 2   # 2 inference nodes in total (TP2 x DP4 each)
orchestrator_on_inference = true

[monitors.wandb]
project = "nemotron-3.5-super-swe-marathon-eval"
name = "swe-marathon-eval-sft-ep2"

[weight_broadcast]
type = "nccl"
timeout = 43200

[model]
name = "/volume/runs/vroplftttq1qfz6tw78jdzy9/text-export/ep2-step104"

[trainer]
# The trainer idles waiting for its one train batch until the eval queue is fully dispatched
# (tens of hours): never let a distributed timeout kill it.
dist_timeout_seconds = 259200
enable_router_replay = false

[trainer.model]
attn = "flash_attention_3"
optimization_dtype = "bfloat16"
cp = 8
ep = 8
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]
token_chunk_size = 8192

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "adamw"
# EVAL-ONLY: lr 0 makes the one optimizer step a no-op (v1 weights == v0 weights).
lr = 0.0
weight_decay = 0.0
max_norm = 1.0

# EVAL-ONLY: no [ckpt] / [trainer.ckpt]: no 1.4 TB final checkpoint.

[orchestrator]
batch_size = 2
max_off_policy_steps = 1

[orchestrator.train]
group_size = 2

[orchestrator.train.sampling]
temperature = 1.0
top_p = 1.0

[orchestrator.train.algo]
# EVAL-ONLY: constant advantage so the 2-rollout batch always ships, whatever the rewards.
type = "debug"

[[orchestrator.train.source]]
name = "swe-marathon-noop-train"
group_size = 2

[orchestrator.train.source.env]
id = "prime/swe-marathon-env@0.2.0"

[orchestrator.train.source.env.taskset]
id = "harbor"
dataset = "swe-marathon-vendor@10e808bd17ef"
registry_path = "/volume/datasets/swe-marathon/registry.json"
artifact_max_bytes = 1073741824

[orchestrator.train.source.env.agent.harness]
id = "swe-marathon-opencode"

[orchestrator.train.source.env.agent.harness.compaction]
context_window = 655360
summarize_at_tokens = 524288
max_output_tokens = 131072

[orchestrator.train.source.env.agent.scoring.network]
# Grade with an open network, as the training data was (verifiers add87f8d2 shared_grading = "open"): each
# task's tests/test.sh runs `pip install -r requirements.txt` first. The agent itself stays offline.
allow = ["*"]

[orchestrator.train.source.env.agent.runtime]
type = "prime"
region = "us"
idle_timeout = 14400.0
creates_per_min = 100
labels = ["swe-marathon-eval-sft-ep2"]

[orchestrator.train.source.env.agent.timeout]
rollout = 14400.0
setup = 3600.0
finalize = 3600.0
scoring = 3600.0

[orchestrator.train.source.env.timeout]
episode = 86400.0

[orchestrator.train.source.env.retries]
rules = [
    { type = "ProviderError", max_retries = 3 },
    { type = "SandboxError", max_retries = 10 },
    { type = "HarnessError", max_retries = 3 },
]

[orchestrator.train.source.serve]
max_concurrent = 2

[orchestrator.train.source.serve.pool]
type = "elastic"
max_workers = 1
multiplex = 2

# EVAL-ONLY: the fastest base-eval task (8/8 rollouts finished in <= 0.93 h on the base eval).
[orchestrator.train.source.select.include]
names = ["sifflet-clone"]

[orchestrator.concurrency]
# ~150 sessions per inference node, as in the running eval-only run xbm6 (800 over 6 nodes): long OpenCode
# sessions need KV room.
min_inflight = 192
initial_inflight = 256
max_inflight = 300

[orchestrator.renderer]
name = "nemotron-3.5"
truncate_history_thinking = false

[orchestrator.eval]
interval = 1000
skip_first_step = false

# Temperature 1.0, as the training data was generated. top_p is left to the server
# (vLLM applies the model's generation_config.json default, top_p 0.95).
[orchestrator.eval.sampling]
temperature = 1.0
# Eval requests go to vLLM's chat template (not the renderer); keep past reasoning as in training.
chat_template_kwargs = { truncate_history_thinking = false }

[[orchestrator.eval.source]]
name = "swe-marathon"
group_size = 8

[orchestrator.eval.source.env]
id = "prime/swe-marathon-env@0.2.0"

[orchestrator.eval.source.env.taskset]
id = "harbor"
dataset = "swe-marathon-vendor@10e808bd17ef"
registry_path = "/volume/datasets/swe-marathon/registry.json"
artifact_max_bytes = 1073741824

[orchestrator.eval.source.env.agent.harness]
# OpenCode 2.0.26 with the training data's settings (prime/swe-marathon-env ports verifiers add87f8d2's
# compaction): the training spec's 640K window, compaction at 512K, 131,072-token output limit, no turn cap.
id = "swe-marathon-opencode"

[orchestrator.eval.source.env.agent.harness.compaction]
context_window = 655360
summarize_at_tokens = 524288
max_output_tokens = 131072

[orchestrator.eval.source.env.agent.scoring.network]
# Grade with an open network, as the training data was (verifiers add87f8d2 shared_grading = "open"): each
# task's tests/test.sh runs `pip install -r requirements.txt` first. The agent itself stays offline.
allow = ["*"]

[orchestrator.eval.source.env.agent.runtime]
type = "prime"
region = "us"
idle_timeout = 14400.0
creates_per_min = 100
labels = ["swe-marathon-eval-sft-ep2"]

[orchestrator.eval.source.env.agent.timeout]
rollout = 86400.0
setup = 3600.0
finalize = 3600.0
scoring = 3600.0

[orchestrator.eval.source.env.timeout]
episode = 86400.0

[orchestrator.eval.source.env.retries]
rules = [
    { type = "ProviderError", max_retries = 3 },
    { type = "SandboxError", max_retries = 10 },
    { type = "HarnessError", max_retries = 3 },
]

[orchestrator.eval.source.serve]
max_concurrent = 128

[orchestrator.eval.source.serve.pool]
type = "elastic"
max_workers = 7
multiplex = 128

[inference.vllm]
# The training spec's 640K context (the SFT runs trained at seq_len 655360).
max_model_len = 655360
tool_call_parser = "qwen3_coder"
reasoning_parser = "nemotron_v3"
tensor_parallel_size = 2
data_parallel_size = 4
enable_expert_parallel = true
enable_prefix_caching = true
gpu_memory_utilization = 0.85
mamba_cache_dtype = "float32"
safetensors_load_strategy = "prefetch"
max_num_seqs = 256
max_num_batched_tokens = 8192
all2all_backend = "allgather_reducescatter"
dtype = "bfloat16"
seed = 0
