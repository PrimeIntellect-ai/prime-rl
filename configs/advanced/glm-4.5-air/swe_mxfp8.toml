# Experiment config, as used for the GLM-4.5-Air MXFP8 SWE run. It should be run on B300 GPUs.
#
#   uv run rl @ configs/advanced/glm-4.5-air/swe_mxfp8.toml
#
# MXFP8 variant of research-prod int4/rl/swe-terminal/air/scaleswe-regular.toml (4a9de10): identical
# except for online MXFP8 vLLM inference, a trainer quantized the same way, and run names/labels.
# `cp_style = "ulysses"` is dropped: prime-rl main removed the field (Ulysses is the only CP style).
# `attn = "flash_attention_3"` is dropped: FA3 has no B300 kernels; the default `auto` picks FA4 there.
#
# GLM-4.5-Air (100B MoE) SWE RL on scaleswe — REGULAR arm: bash-edit harness, taskset reward
# (no judge). Ablation pair with scaleswe-judge.toml (agentic judge); the two differ ONLY in the
# train env section. Deployment/trainer/inference mirror prime-rl advanced example glm-4.5-air/swe.toml.
max_steps = 1000
seq_len = 131072

[run]
name = "int4-rl-swe-air-scaleswe-regular-mxfp8"

[env_vars]
TRITON_CACHE_DIR = "/tmp/int4-triton-cache"
# Namespace ALL tmp usage per project: tempfile.gettempdir() honors TMPDIR, fixing
# /tmp collisions between co-tenant jobs (e.g. verifiers rate-limiter buckets, jit caches).
TMPDIR = "/tmp/int4-tmp"
# FlashInfer autotuning takes ~20 min of each replica's startup; cache it on shared storage.
VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR = "$HOME/.cache/vllm-flashinfer-autotune"

[slurm]
job_name = "air-scaleswe-regular-mxfp8"
partition = "all"
pre_run_command = 'mkdir -p /tmp/int4-tmp ; uv sync --all-extras --all-packages ; timeout 120 prime sandbox delete --label "air-scaleswe-regular-mxfp8" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 1
num_infer_replicas = 4

[monitors.wandb]
project = "agentic-judging"

[monitors.prime]

[weight_broadcast]
type = "nccl"
timeout = 3600

[resume]

[ckpt]
interval = 50
keep_last = 1

[model]
name = "zai-org/GLM-4.5-Air"

# --- Trainer ---
# GLM-4.5-Air is a glm4_moe model: router replay (trainer.enable_router_replay) replays the
# routed-expert decisions returned by inference (inference.enable_return_routed_experts). cp=8
# ulysses + muon + the GLM-5.1 prod memory recipe (LM-head token chunking, AC freq=1 + activation
# offloading, optimizer CPU offload, skip-gather / skip-optimizer ckpt).

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[trainer.model]
cp = 4
fused_lm_head_token_chunk_size = 1024
offload = "optimizer"

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

# MXFP8 trainer matching vLLM's online MXFP8: 1x32 blocks, power-of-two scales rounded up.
# Default ignores keep lm_head, router and gates bf16, as vLLM does.
[trainer.model.quantization]
type = "mxfp8"
recipe = "mxfp8_rceil_wgrad_with_hp"

[trainer.model.moe.compute]
type = "mxfp8"

[trainer.ckpt]
skip_optimizer = true

[trainer.optim]
type = "muon"

# --- Orchestrator ---

[orchestrator]
batch_size = 256
max_off_policy_steps = 32

[orchestrator.concurrency]
initial_inflight = 384
max_inflight = 1536

[orchestrator.train]
group_size = 16

[orchestrator.train.algo]
type = "grpo"

[orchestrator.train.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

# --- Train source: REGULAR bash-edit harness, taskset reward (no judge). ---

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset = { id = "scaleswe" }
env.agent.harness = { id = "bash" }
env.agent.runtime = { labels = ["air-scaleswe-regular-mxfp8"] }

# --- Eval: SWE-Bench Verified at step 0 then every 20 steps, bash-edit harness on prime
# (no judge). Full taskset: 500 tasks @ group_size 1 -> 500 rollouts. ---

[orchestrator.eval]
interval = 20

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset = { id = "swebench-verified" }
env.agent.harness = { id = "bash" }
env.agent.runtime = { labels = ["air-scaleswe-regular-mxfp8"] }
group_size = 1
env.agent.timeout = { rollout = 3600 }

# --- Inference ---

[inference]

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/int4-vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/int4-flashinfer-cache"

[inference.vllm]
max_model_len = 131072
# TP=2: vLLM's MXFP8 needs each TP shard's input dim divisible by 32, and the dense layer-0
# down_proj (10944) only splits cleanly at TP<=2. Experts stay expert-parallel over all 8 GPUs.
tensor_parallel_size = 2
data_parallel_size = 4
enable_expert_parallel = true
quantization = "mxfp8"
enable_return_routed_experts = true
