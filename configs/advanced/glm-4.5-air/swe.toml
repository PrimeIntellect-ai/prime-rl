# GLM-4.5-Air on the `scaleswe` SWE taskset at 131k context, bash harness on a prime sandbox runtime.
# A model swap of configs/advanced/deepseek-v4-flash/swe.toml: every run-level knob (context, batch,
# optimizer, length penalty, checkpointing, online FP8 serving with an FP8 KV cache, 8 trainer + 8
# inference nodes) is kept identical so the two runs differ only in the model. Model-specific trainer
# and renderer settings follow examples/advanced/glm-4.5-air/swe.toml.

max_steps = 1000
seq_len = 131072

[run]
name = "glm45air-swe-131k"

# TODO: all six of these are temporary and hardcode a user path; see the DeepSeek config for why.
[env_vars]
TRITON_CACHE_DIR = "/tmp/garrett/.triton-cache"
DG_JIT_CACHE_DIR = "/tmp/garrett/.research_deep_gemm"
TILELANG_CACHE_DIR = "/tmp/garrett/.tilelang-cache"
VLLM_CACHE_ROOT = "/tmp/garrett/.vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/garrett/.flashinfer-cache"
HF_HOME = "/home/garrett/.cache/huggingface"

[slurm]
job_name = "glm45air-swe"
partition = "all"
pre_run_command = 'timeout 120 prime sandbox delete --label "glm45air-swe" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 8
num_infer_nodes = 1
num_infer_replicas = 8

[model]
name = "zai-org/GLM-4.5-Air"

[monitors.wandb]
entity = "primeintellect"
project = "deepseek-v4-flash"
name = "swe-scaleswe-131k-fp8-adamw1e-6-bs64g8-8t8i-glm45air"
tags = ["swe", "scaleswe", "131k", "fp8", "adamw", "bring-up", "glm-4.5-air"]

[weight_broadcast]
type = "nccl"
port = 29501
timeout = 3600

# Checkpointing disabled for quick testing: these checkpoints are 1-3 TB each.

[resume]

[trainer]
dist_timeout_seconds = 14400
enable_router_replay = true

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
cp = 4
# GLM-4.5-Air has a softmax attention path, so the ulysses style the GLM example recommends applies.
cp_style = "ulysses"
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]
freq = 1

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.compile]

[trainer.model.moe.dispatch]
type = "torch"

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.01

[orchestrator]
batch_size = 64
group_size = 8
max_off_policy_steps = 32

[orchestrator.model.client]
wait_for_ready_timeout = 7200

[orchestrator.concurrency]
max_inflight = 512

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.harness.compaction.summarize_at_tokens = 98304
env.agent.runtime.labels = ["glm45air-swe"]

[inference]
use_deep_gemm = true

[inference.env_vars]
VLLM_USE_DEEP_GEMM_E8M0 = "0"

[inference.vllm]
dtype = "bfloat16"
quantization = "fp8_per_block"
# Blockwise FP8 needs every sharded weight dimension to be a multiple of 128. GLM-4.5-Air's dense MLP in
# layer 0 (intermediate 10944) and its shared expert (1408, split 8 ways to 176) are not, and the Triton
# block-scaled GEMM asserts on them at startup. Routed experts stay whole under expert parallelism (1408 =
# 11 x 128) and attention shards cleanly, so only these two module families are kept in bf16.
quantization_config = { ignore = ["re:.*\\.layers\\.0\\.mlp\\..*", "re:.*\\.shared_experts\\..*"] }
tensor_parallel_size = 8
enable_expert_parallel = true
enable_return_routed_experts = true
gpu_memory_utilization = 0.75
max_model_len = 131072
kv_cache_dtype = "fp8"
