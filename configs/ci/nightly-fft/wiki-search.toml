max_steps = 200
seq_len = 4096

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[wandb]
project = "wiki-search"
name = "wiki-search"

[ckpt]

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[orchestrator]
token_batch_size = 786432 # 512 rollouts x ~1.5k avg tokens
max_inflight_episodes = 1024
group_size = 16

[[orchestrator.train.source]]
name = "wiki-search"

[orchestrator.train.source.env.taskset]
id = "wiki-search"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.train.sampling]
max_completion_tokens = 512

[trainer]

[inference.vllm]
tool_call_parser = "hermes"
data_parallel_size = 4
