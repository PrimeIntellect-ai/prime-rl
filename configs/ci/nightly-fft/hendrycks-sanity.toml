max_steps = 5000

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[monitors.wandb]
project = "hendrycks-sanity"
name = "hendrycks-sanity"

[ckpt]

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[orchestrator]
batch_size = 512
group_size = 8
seq_len = 8192

[orchestrator.concurrency]
max_inflight = 128

[[orchestrator.train.source]]
name = "hendrycks-math"
env.taskset.id = "math-env"
env.taskset.dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
env.taskset.dataset_subset = "default"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 50

[[orchestrator.eval.source]]
name = "aime2024"
group_size = 32
env.taskset.id = "aime24"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer]

[trainer.model]
seq_len = 16384
attn = "flash_attention_2"

[inference.vllm]
max_model_len = 8192
data_parallel_size = 4
[orchestrator.renderer]
name = "default"
reasoning_parser = "think"
