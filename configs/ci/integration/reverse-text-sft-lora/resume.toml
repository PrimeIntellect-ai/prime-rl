max_steps = 10

[ckpt]

[resume]
step = 5

[model]
name = "PrimeIntellect/Qwen3-0.6B"

[model.lora]
rank = 8
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]

[data]
batch_size = 4
seq_len = 1024

[[data.source]]
dataset = "PrimeIntellect/Reverse-Text-SFT"

[optim]
lr = 1.5e-5
