# Env server config for the multi-run RL integration test. One shared server; every
# orchestrator connects to the deterministic address of its only source.
address = "tcp://127.0.0.1:5000"

[env]
name = "reverse-text"

[env.env.taskset]
id = "reverse-text-v1"

[env.env.agent.harness]
id = "null"

[env.env.agent.runtime]
type = "subprocess"
