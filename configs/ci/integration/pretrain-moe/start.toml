# Tiny prime_moe with the base components (Gated Residual, null experts, gated attention, XSA, LatentMoE, quantile
# balancing) in FP8 on 2 GPUs. The test writes the token shards (Reverse-Text-SFT, Qwen3 tokenizer) and passes their
# folder as --data.sources.reverse.path.
max_steps = 20

[model]
name = "configs/ci/integration/pretrain-moe/model"
ac = "None"

[model.quantization]
type = "fp8"

[model.moe.compute]
type = "deepgemm_fp8"

[model.moe.balance]
bias_update = "quantile"

[tokenizer]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
type = "tokens"
seq_len = 2048
batch_tokens = 16384
micro_batch_tokens = 4096
max_epochs = 100

[data.sources]
reverse = { path = "set-by-the-test" }

[[data.phases]]
weights = { reverse = 1.0 }

[optim]
type = "muon"
lr = 0.004

[scheduler]
type = "constant"

[ckpt]
