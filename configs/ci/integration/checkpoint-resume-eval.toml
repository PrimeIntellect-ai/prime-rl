# CI eval smoke for checkpointed retries: the task's first attempt dies as its third
# turn goes upstream, and the retry resumes the same trace from the prime sandbox's
# newest filesystem checkpoint (the bash harness continues in a restored box). Needs
# PRIME_API_KEY for the sandbox and Prime Inference; the taskset is verifiers' own
# integration fixture (deps/verifiers/tests/integration/fixtures on PYTHONPATH).
dashboard = false

[select]
limit = 1

[sampling]
max_completion_tokens = 4096

[[source]]
env.taskset.id = "checkpoint-resume-v1"
env.agent.harness.id = "bash"
env.agent.runtime.type = "prime"
env.agent.max_turns = 8
env.agent.retries.rules = [
  {type = "ProviderError", max_retries = 1},
]
