max_steps = 20
seq_len = 2048

[weight_broadcast]
# TEMP: NCCL weight broadcast currently crashes the trainer on CI GPU runners
# (trainer exits during NCCL init). Use filesystem transport until the NCCL
# path is fixed. See CI RL integration test failures on main.
type = "filesystem"

[ckpt]

[model]
name = "samsja/mini-glm-moe"

[trainer.optim]
lr = 3e-6

[trainer.model]
impl = "custom"

[orchestrator]
batch_size = 128
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"

[orchestrator.train.source.env.taskset]
id = "reverse-text-v1"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[inference]

[inference.vllm]
max_model_len = 2048
gpu_memory_utilization = 0.7
[orchestrator.renderer]
name = "default"
