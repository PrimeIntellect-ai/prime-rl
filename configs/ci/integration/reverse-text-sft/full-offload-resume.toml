max_steps = 6

[ckpt]
skip_optimizer = true
skip_scheduler = true

[resume]
step = 5

[model]
name = "PrimeIntellect/Qwen3-0.6B-untied"
optim_cpu_offload = false
full_offload = true

[optim]
lr = 0.0

# The -untied suffix misses the MODEL_RENDERER_MAP exact match; select the renderer explicitly.
[renderer]
name = "prime-qwen3"

[data]
name = "PrimeIntellect/Reverse-Text-SFT"
batch_size = 4
seq_len = 1024
