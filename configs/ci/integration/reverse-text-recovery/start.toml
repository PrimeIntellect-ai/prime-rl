max_steps = 15
seq_len = 2048

[weight_broadcast]
# Matches the other CI reverse-text runs (NCCL init is unreliable on CI GPU runners).
type = "filesystem"

[ckpt]
interval = 3

[trainer_recovery]
max_restarts = 2

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 128

[orchestrator.train]
group_size = 16

[orchestrator.concurrency]
max_inflight = 128

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]

# PrimeIntellect Qwen3 fine-tune - select its renderer explicitly (the -SFT
# suffix misses the MODEL_RENDERER_MAP exact match).
[orchestrator.renderer]
name = "prime-qwen3"
