# Qwen3-0.6B trained from scratch on Reverse-Text-SFT as token shards. The test writes the shards and passes their
# folder as --data.paths and as the path of the raw validation set.
mode = "pretrain"
max_steps = 20

[ckpt]

[model]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
paths = ["set-by-the-test"]
seq_len = 1024
batch_size = 8
micro_batch_size = 2

[val]
interval = 10

[[val.sets]]
type = "raw"
name = "reverse-text"
path = "set-by-the-test"

[[val.sets]]
type = "sft"
name = "reverse-text-sft"
path = "PrimeIntellect/Reverse-Text-SFT"
split = "train"
