# A model of Qwen3-0.6B's shape trained from scratch on Reverse-Text-SFT as token shards. The test writes the shards
# and passes their folder as --data.paths and --val.data.paths.
mode = "pretrain"
max_steps = 20

[ckpt]

[model.config]
model_type = "qwen3"
hidden_size = 1024
intermediate_size = 3072
num_hidden_layers = 28
num_attention_heads = 16
num_key_value_heads = 8
tie_word_embeddings = true

[tokenizer]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
paths = ["set-by-the-test"]
seq_len = 1024
batch_size = 8
micro_batch_size = 2

[val]
interval = 10
num_samples = 16

[val.data]
paths = ["set-by-the-test"]
seq_len = 1024
micro_batch_size = 2
