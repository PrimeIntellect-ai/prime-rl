# A small dense model trained from scratch on token shards. The test writes the shards (Reverse-Text-SFT, Qwen3
# tokenizer) and passes their folder as --data.paths.
max_steps = 20

[model]
name = "configs/ci/integration/pretrain/model"

[model.init]

[tokenizer]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
type = "tokens"
paths = ["set-by-the-test"]
seq_len = 1024
batch_size = 8
micro_batch_size = 2

[optim]
lr = 3e-3

[ckpt]
