# Based on configs/debug/multimodal.toml but tuned for CI.
max_steps = 25
seq_len = 4096

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[model]
name = "PrimeIntellect/Qwen3.5-4B-untied"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[orchestrator]
batch_size = 256

# The -untied suffix misses the MODEL_RENDERER_MAP exact match; select the renderer explicitly.
[orchestrator.renderer]
name = "qwen3.5"

[orchestrator.train]
group_size = 16

[orchestrator.concurrency]
max_inflight = 128

[orchestrator.train.sampling]
max_completion_tokens = 64

[[orchestrator.train.source]]
name = "color-codeword"
env.taskset.id = "color-codeword"
env.taskset.images_per_turn = 1
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer]

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.optim]
lr = 3e-6

[inference]
