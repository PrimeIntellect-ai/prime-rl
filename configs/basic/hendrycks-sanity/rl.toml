# Hendrycks-math sanity on 2 GPUs (1 trainer + 1 inference) — a single-turn math env meant to
# run long (reward climbs slowly). Dev-sized mirror of examples/basic/hendrycks-sanity.

max_steps = 5000

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[monitors.wandb]
project = "hendrycks-sanity"
name = "hendrycks-sanity"

[orchestrator]
batch_size = 128
group_size = 8
seq_len = 8192

[[orchestrator.train.source]]
name = "hendrycks-math"
env.taskset.id = "math-env"
env.taskset.dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B"
env.taskset.dataset_subset = "default"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.model]
seq_len = 16384

[inference.vllm]
max_model_len = 8192
[orchestrator.renderer]
name = "default"
reasoning_parser = "think"
