# Evaluate a model on alphabet-sort against a local inference server
# (`uv run inference --vllm.enable-lora --vllm.model Qwen/Qwen3-4B-Instruct-2507`).
# Override the model with `-m` to evaluate a trained checkpoint.
#
#   uv run eval @ configs/basic/alphabet-sort/eval.toml

model = "Qwen/Qwen3-4B-Instruct-2507"
num_examples = 20
group_size = 3

[client]
base_url = "http://localhost:8000/v1"

[sampling]
max_completion_tokens = 768

[[source]]
name = "alphabet-sort"
env.taskset.id = "alphabet-sort"
env.taskset.min_turns = 3
env.taskset.max_turns = 5
env.taskset.task.power_per_turn = false
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
