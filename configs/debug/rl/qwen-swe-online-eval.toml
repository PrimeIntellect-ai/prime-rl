# Hosted validation of online eval accounting; derived from the Qwen SWE base.
max_steps = 2
seq_len = 131072
dashboard = false

[log]
level = "debug"

[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"

[weight_broadcast]
type = "nccl"
timeout = 3600

[deployment]
type = "single_node"
gpus_per_node = 8
num_train_gpus = 2
num_infer_gpus = 6

[monitors.wandb]
project = "qwen30b-swe"

[monitors.file]

[trainer.model]
attn = "flash_attention_3"
ep = 2
cp = 2
cp_style = "ulysses"
optim_cpu_offload = false
fused_lm_head_token_chunk_size = 256
optimization_dtype = "float32"
reduce_dtype = "float32"

[trainer.model.full_offload]
numa_bind = false

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-06

[orchestrator]
batch_size = 32
max_off_policy_steps = 2

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 16384

[[orchestrator.train.source]]
name = "swe"
select.shuffle = true
select.seed = 42
env.taskset.id = "r2e-gym"
env.taskset.system_prompt = "configs/debug/rl/swe-system-prompt.txt"
env.agent.harness.id = "bash"
env.agent.harness.edit = false
env.agent.runtime.type = "prime"
env.agent.max_turns = 64
env.agent.max_output_tokens = 65536

[orchestrator.concurrency]
min_inflight = 8
initial_inflight = 16
max_inflight = 32

[orchestrator.eval]
interval = 2

[orchestrator.eval.sampling]
max_completion_tokens = 16384

[[orchestrator.eval.source]]
name = "swe-bench-verified"
env.taskset.id = "swebench-verified"
env.taskset.system_prompt = "configs/debug/rl/swe-system-prompt.txt"
env.agent.harness.id = "bash"
env.agent.harness.edit = false
env.agent.runtime.type = "prime"
env.agent.max_turns = 64
env.agent.max_output_tokens = 65536

[orchestrator.eval.select]
limit = 16

[[orchestrator.eval.env.retries.rules]]
type = "SandboxError"
message = "Failed to route request to sandbox"
max_retries = 3

[[orchestrator.eval.env.retries.rules]]
type = "ProviderError"
status_code = [
    429,
    "5xx",
]
max_retries = 3

[[orchestrator.eval.env.retries.rules]]
type = "InterceptionError"
max_retries = 3

[[orchestrator.eval.env.retries.rules]]
type = "TunnelError"
max_retries = 3

[inference.vllm]
max_model_len = 131072
tensor_parallel_size = 2
data_parallel_size = 3
api_server_count = 12

[inference.router]
type = "vllm-router"

[run]
name = "qwen-swe-online-eval-smoke"
