# Single env, resume: gsm8k with a low pinned concurrency so the run can be
# interrupted partway. Relaunch with the same --run.name and --resume: the landed
# episodes are restored from the trace stream and only the owed rollouts run.
# Resuming a finished run restores everything and exits.
#
#   uv run eval @ configs/debug/eval/resume.toml --run.name resume-debug
#   <Ctrl-C partway>
#   uv run eval @ configs/debug/eval/resume.toml --run.name resume-debug --resume

num_examples = 8
group_size = 2

[concurrency]
min_inflight = 2
max_inflight = 2

[sampling]
max_completion_tokens = 8192

[[source]]
env.taskset.id = "gsm8k"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
