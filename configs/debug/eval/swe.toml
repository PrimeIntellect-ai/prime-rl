# swe - SWE-bench Verified + Terminal-Bench 2, one epoch each, against
# DeepSeek V4.1 Flash on Prime Inference.
#
#   uv run eval @ configs/debug/eval/swe.toml
#
# The tasksets run in prime sandboxes (the default runtime), so PRIME_API_KEY
# also authenticates sandbox creation. External API endpoints expose no vLLM
# /metrics, so adaptive concurrency has no load signal - the band must be
# pinned (min_inflight = max_inflight, or `-c N`) or the run refuses to start.

[concurrency]
min_inflight = 32
max_inflight = 32

[[source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600

[[source]]
name = "terminal-bench-2"
env.taskset.id = "terminal-bench-2"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600
