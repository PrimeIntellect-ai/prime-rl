# Single env, single turn: gsm8k with the null harness (one chat completion per
# task, no sandbox) against Prime Inference.
#
#   uv run eval @ configs/debug/eval/single-turn.toml

num_examples = 8
group_size = 2

[sampling]
max_completion_tokens = 8192

[[source]]
env.taskset.id = "gsm8k"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
