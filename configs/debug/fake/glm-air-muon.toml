max_steps = 3
dist_timeout_seconds = 180

[model]
name = "zai-org/GLM-4.5-Air"
seq_len = 256
attn = "flash_attention_3"
impl = "custom"
cp = 4
cp_style = "ulysses"
ep = "auto"
optim_cpu_offload = true

[model.compile]
fullgraph = false

[model.ac]
mode = "full"

[model.ac_offloading]
pin_memory = true
max_inflight_activations = 1

[data]
type = "fake"
batch_size = 4
micro_batch_size = 1
seq_len = 256
input_ids = "random"
seed = 0

[optim]
type = "muon"
lr = 1e-6
weight_decay = 0.01
warmup_all_to_all = true

[deployment]
type = "multi_node"
num_train_nodes = 2
gpus_per_node = 8

[slurm]
