max_steps = 5
dashboard = false

[model]
name = "Qwen/Qwen3.5-9B"
impl = "custom"
seq_len = 8192
optim_cpu_offload = false
fsdp_cpu_offload = false
ac_offloading = "None"

[model.debug]
random_init = true

[model.compile]
fullgraph = true
mode = "reduce-overhead"
cudagraph_partition_ops = [
  "prime_rl_qwen3_5::causal_conv1d",
  "prime_rl_qwen3_5::causal_conv1d_backward",
  "prime_rl_qwen3_5::chunk_gated_delta_rule",
  "prime_rl_qwen3_5::chunk_gated_delta_rule_backward",
]

[data]
type = "fake"
batch_size = 8
micro_batch_size = 1
seq_len = 8192
length = "fixed"
input_ids = "random"

[deployment]
type = "single_node"
gpus_per_node = 8
num_train_gpus = 8

[env_vars]
TORCH_LOGS = "perf_hints,cudagraphs"

[slurm]
job_name = "qwen3-5-9b-fullgraph"
partition = "all"
time = "00:45:00"
