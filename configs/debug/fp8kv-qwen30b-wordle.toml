# A/B KL experiment: Qwen3-30B-A3B at 8k context on Wordle. One 8-GPU
# trainer node and one 8-GPU inference node keep all non-KV variables fixed.
# FP8 KV is enabled on inference; the replay condition is auto-propagated to
# the trainer. Compose fp8kv-qwen30b-wordle-no-replay.toml for the control.

max_steps = 20
seq_len = 8192

[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"

[log]
level = "info"

[monitors.file]

[weight_broadcast]
type = "nccl"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[slurm]
job_name = "fp8kv-wordle"
partition = "all"
time = "04:00:00"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8

[trainer.model.compile]

[trainer.model.ac]
freq = 1

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 64
group_size = 8
max_off_policy_steps = 8

[orchestrator.concurrency]
initial_inflight = 128
max_inflight = 256

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "wordle"
env.taskset.id = "wordle"
env.player.harness.id = "null"
env.player.runtime.type = "subprocess"

[orchestrator.renderer]
name = "prime-qwen3"

[inference.vllm]
tensor_parallel_size = 8
max_model_len = 8192
kv_cache_dtype = "fp8"
