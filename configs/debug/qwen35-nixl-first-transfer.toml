max_steps = 1
seq_len = 4096
output_dir = "outputs"

[run]
name = "qwen35-nixl-first-transfer"

[model]
name = "Qwen/Qwen3.5-35B-A3B"

[log]
level = "debug"

[weight_broadcast]
type = "nixl"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[slurm]
job_name = "qwen35-nixl-smoke"
partition = "all"
time = "00:45:00"
cleanup_grace_period = 0

[trainer.model]
impl = "custom"
ep = 8
optim_cpu_offload = false
full_offload = true

[trainer.model.ac]
mode = "selective"

[trainer.optim]
type = "sign_sgd"

[orchestrator]
batch_size = 16
group_size = 4

[orchestrator.concurrency]
min_inflight = 4
max_inflight = 16

[orchestrator.train.sampling]
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "math-env"
env.agent.harness.id = "null"
env.agent.runtime.type = "prime"
env.agent.runtime.labels = ["qwen35-nixl-first-transfer"]

[inference.vllm]
tensor_parallel_size = 8
max_model_len = 4096

[env_vars]
TRITON_CACHE_DIR = "/tmp/qwen35-nixl-triton"

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/qwen35-nixl-vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/qwen35-nixl-flashinfer"
