# Score centering debug run (arXiv:2609.20807): policy gradient with a
# zero-expected-score baseline that cancels trainer/sampler drift.
#   uv run rl @ configs/debug/algo/score_centering.toml
# The rl entrypoint stamps `orchestrator.train.sampling.logprobs = 128` (the
# paper's k) automatically; trainer.loss.topk below is that default.

max_steps = 20
seq_len = 2048

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[monitors.wandb]
project = "algorithms-debug"
name = "debug-score-centering"

[orchestrator]
batch_size = 128
group_size = 16

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "prime-qwen3"

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 1
num_examples = 128

[orchestrator.eval.sampling]
max_completion_tokens = 128

[[orchestrator.eval.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.loss]
type = "score_centering"
topk = 128

[trainer.optim]
lr = 3e-6

[ckpt]

[inference]

[inference.vllm]
gpu_memory_utilization = 0.5
