# Tiny binary reverse-text run: one trainer GPU and one inference GPU.
max_steps = 5
seq_len = 2048
output_dir = "outputs/ngu-smoke"
dashboard = false

[run]
name = "reverse-text-ngu"

[slurm]
partition = "all"
job_name = "ngu-smoke"

[deployment]
type = "single_node"
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[env_vars]
TRITON_CACHE_DIR = "/tmp/mika-ngu-smoke/triton"

[orchestrator]
batch_size = 16
group_size = 4
preserve_groups = true
max_zero_output_batches = 100

[orchestrator.algo]
type = "ngu"
continuation_probability = 0.875
history_max_policy_age = 4

[orchestrator.concurrency]
min_inflight = 16
max_inflight = 32

[orchestrator.renderer]
name = "prime-qwen3"

[orchestrator.train.sampling]
max_completion_tokens = 256

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.taskset.task.rewards.lcs.fn = "tools/ngu/reverse_text.py:binary_lcs"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 5
num_examples = 16
group_size = 1

[orchestrator.eval.sampling]
max_completion_tokens = 256

[[orchestrator.eval.source]]
name = "reverse-text-eval"
env.taskset.id = "reverse-text"
env.taskset.task.rewards.lcs.fn = "tools/ngu/reverse_text.py:binary_lcs"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 2
keep_last = 2

[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/mika-ngu-smoke/vllm"
FLASHINFER_WORKSPACE_BASE = "/tmp/mika-ngu-smoke/flashinfer"

[inference.vllm]
max_model_len = 2048
enforce_eager = true
