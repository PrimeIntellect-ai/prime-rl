# Weight-broadcast benchmark: Qwen3-30B-A3B, 1 train + 1 inference node.
# Compose with a transport overlay, e.g.
#   uv run rl @ configs/debug/weight-broadcast/qwen3-30b-a3b.toml @ configs/debug/weight-broadcast/modelexpress.toml
max_steps = 10
seq_len = 2048

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[slurm]
job_name = "wb-qwen30b"
partition = "all"

[trainer.model]
attn = "flash_attention_3"

[trainer.model.ac]

[trainer.optim]
lr = 1e-7

[orchestrator]
batch_size = 64
max_off_policy_steps = 1

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]

[inference.vllm]
max_model_len = 2048
tensor_parallel_size = 2
