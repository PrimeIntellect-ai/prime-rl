# Every kernel in this package, one table per kernel.
#
# The table name is the folder next to this file, and holds the kernel's Python surface and
# its C++/CUDA sources — committed under `csrc/` or checked out as a git submodule inside
# the folder. Paths are relative to that folder.
#
#   description  what the kernel does
#   ops          torch.ops namespace the compiled extension registers into
#   sources      C++/CUDA files to compile into prime_kernels.<name>._C
#   arch         compute capabilities to compile for; matched exactly against the device
#   cxx-std      C++ standard

# Sources come from the prime-flash-moe submodule checked out inside the kernel folder
# (git submodule update --init kernels/prime_kernels/flash_moe/prime-flash-moe).
[flash_moe]
description = "Fused MoE forward (bf16 + mxfp8) on Blackwell tcgen05"
ops = "prime_moe"
sources = [
    "prime-flash-moe/prime_moe/csrc/torch_interface.cpp",
    "prime-flash-moe/prime_moe/csrc/kernels/fused_moe_bf16_kernel.cu",
    "prime-flash-moe/prime_moe/csrc/kernels/fused_moe_mxfp8_kernel.cu",
]
include-dirs = ["prime-flash-moe/prime_moe/csrc/kernels"]
arch = ["10.0a"]
cxx-std = 20
