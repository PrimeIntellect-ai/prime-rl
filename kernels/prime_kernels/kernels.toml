# Every kernel in this package, one table per kernel.
#
# The table name is the folder next to this file, and holds the kernel's Python surface, its
# vendored checkout under `upstream/` (a submodule) and/or its own sources. Paths are
# relative to that folder.
#
#   description  what the kernel does
#   ops          torch.ops namespace the compiled extension registers into
#   upstream     repo the vendored sources come from, if any
#   sources      C++/CUDA files to compile into prime_kernels.<name>._C
#   arch         compute capabilities to compile for; matched exactly against the device
#   min-cuda     oldest CUDA toolkit that can build it
#   cxx-std      C++ standard

[flash_moe]
description = "Fused MoE forward (bf16 + mxfp8) on Blackwell tcgen05"
ops = "prime_moe"
upstream = "https://github.com/PrimeIntellect-ai/prime-flash-moe"
sources = [
    "upstream/prime_moe/csrc/torch_interface.cpp",
    "upstream/prime_moe/csrc/kernels/fused_moe_bf16_kernel.cu",
    "upstream/prime_moe/csrc/kernels/fused_moe_mxfp8_kernel.cu",
]
include-dirs = ["upstream/prime_moe/csrc/kernels"]
# tcgen05 + block scaled MMA are architecture specific: sm_100a only, CUDA >= 12.8.
arch = ["10.0a"]
min-cuda = "12.8"
cxx-std = 20
