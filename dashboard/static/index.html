<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prime-rl dashboard</title>
<link rel="icon" href="/static/butterfly-white.svg">
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <img src="/static/butterfly-white.svg" alt="Prime Intellect">
    <span class="brand-name">prime-rl</span>
  </div>
  <select id="run-select" title="run"></select>
  <nav id="tabs">
    <button data-tab="metrics" class="active">Metrics</button>
    <button data-tab="config">Config</button>
    <button data-tab="traces">Traces</button>
    <button data-tab="logs">Logs</button>
  </nav>
  <label class="toggle" title="poll for updates"><input type="checkbox" id="live-toggle" checked><span class="dot"></span>live</label>
</header>

<div id="run-overview"></div>

<main>
  <section id="tab-metrics">
    <div class="controls">
      <div class="seg" id="metrics-mode">
        <button data-mode="overview" class="active">Overview</button>
        <button data-mode="all">All metrics</button>
      </div>
      <input id="metrics-search" class="search" type="search" placeholder="regex filter, e.g. ^entropy/ or reward" hidden>
      <label class="ctl">smooth <input id="smooth-range" type="range" min="1" max="50" value="1"><span id="smooth-val">off</span></label>
      <span id="metrics-status" class="muted"></span>
    </div>
    <div id="metrics-body"></div>
  </section>

  <section id="tab-config" hidden>
    <div class="controls">
      <select id="config-file"></select>
      <input id="config-search" class="search" type="search" placeholder="regex search, e.g. lora|lr">
      <span id="config-hits" class="muted"></span>
      <span id="config-status" class="muted"></span>
    </div>
    <pre id="config-view"></pre>
  </section>

  <section id="tab-traces" hidden>
    <div class="controls">
      <div id="step-strip"></div>
    </div>
    <div class="controls">
      <div class="seg" id="trace-kind">
        <button data-kind="train" class="active">Train</button>
        <button data-kind="eval">Eval</button>
      </div>
      <div class="seg" id="trace-subset">
        <button data-subset="all">All</button>
        <button data-subset="effective" class="active">Effective</button>
      </div>
      <select id="trace-env"><option value="">all envs</option></select>
      <label class="toggle"><input type="checkbox" id="trace-errors"><span class="dot"></span>errors only</label>
      <select id="trace-sort">
        <option value="line:asc">order: arrival</option>
        <option value="reward:desc">reward ↓</option>
        <option value="reward:asc">reward ↑</option>
        <option value="advantage:desc">advantage ↓</option>
        <option value="advantage:asc">advantage ↑</option>
        <option value="output_tokens:desc">tokens ↓</option>
      </select>
      <span id="trace-status" class="muted"></span>
    </div>
    <div id="trace-empty" hidden></div>
    <div id="episode-table-wrap">
      <table id="episode-table">
        <thead><tr>
          <th>#</th><th>env</th><th>group</th><th>reward</th><th>adv</th>
          <th>in tok</th><th>out tok</th><th>turns</th><th>stop</th><th>disp.step</th><th>status</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="episode-pager" class="controls"></div>
  </section>

  <section id="tab-logs" hidden>
    <div id="logs-layout">
      <aside id="log-sidebar">
        <div class="sidebar-head">
          <label class="t-label">attempt</label>
          <select id="attempt-select"></select>
        </div>
        <div id="log-files"></div>
      </aside>
      <div id="log-main">
        <div class="controls">
          <label class="toggle"><input type="checkbox" id="log-follow" checked><span class="dot"></span>follow</label>
          <select id="log-level">
            <option value="DEBUG">all levels</option>
            <option value="INFO">info+</option>
            <option value="WARNING">warn+</option>
            <option value="ERROR">error+</option>
          </select>
          <input id="log-search" class="search" type="search" placeholder="filter lines…">
          <button id="log-older" class="btn">load older</button>
          <span id="log-status" class="muted"></span>
        </div>
        <div id="log-stream" class="mono"></div>
      </div>
    </div>
  </section>
</main>

<div id="drawer-backdrop" hidden></div>
<aside id="drawer" hidden>
  <div id="drawer-head">
    <button id="drawer-close" class="btn">✕</button>
    <div id="drawer-title"></div>
    <div class="spacer"></div>
    <select id="token-signal">
      <option value="">text view</option>
      <option value="advantage">tokens: advantage</option>
      <option value="logprob">tokens: logprob</option>
      <option value="mask">tokens: mask</option>
      <option value="is_content">tokens: is_content</option>
    </select>
  </div>
  <div id="drawer-body"></div>
</aside>

<script src="/static/vendor/uPlot.iife.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
