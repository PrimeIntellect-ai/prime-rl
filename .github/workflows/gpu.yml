name: GPU Tests

on:
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.label.name == 'gpu-ci')
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to run GPU jobs
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEWER: ${{ github.event.review.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set_run_and_exit() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]] && set_run_and_exit true

          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::notice::Fork PRs get no secrets on these events, so GPU CI cannot run here. A maintainer can push the branch to $GITHUB_REPOSITORY and apply the gpu-ci label to that PR."
            set_run_and_exit false
          fi

          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$REVIEWER/permission" --jq .role_name)
            echo "Reviewer $REVIEWER has role: $role"
            case "$role" in
              admin|maintain|write|triage) ;;
              *) set_run_and_exit false ;;
            esac
          fi

          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gpu.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | \"\(.id) \(.html_url)\"")
          while read -r run_id run_url; do
            [[ -n "$run_id" ]] || continue
            job_states=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '
              [.jobs[] | select(.name != "Gate")] as $gpu_jobs
              | "\(($gpu_jobs | length > 0) and all($gpu_jobs[]; .conclusion == "success" or (.status != "completed" and .conclusion == null))) \(any($gpu_jobs[]; .status != "completed"))"')
            read -r passing_or_pending in_flight <<< "$job_states"
            [[ "$passing_or_pending" == "true" ]] || continue
            if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
              echo "::notice::Head commit $HEAD_SHA is already covered by GPU run $run_url"
              set_run_and_exit false
            elif [[ "$in_flight" == "true" ]]; then
              echo "::notice::Head commit $HEAD_SHA already has GPU run $run_url in flight"
              set_run_and_exit false
            fi
          done <<< "$runs"

          set_run_and_exit true
      - name: Remove gpu-ci label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/gpu-ci"

  unit-gpu:
    name: Unit (GPU)
    needs: gate
    runs-on: prime-rl-2xh200
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all
    timeout-minutes: 45
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: ${{ needs.gate.outputs.run == 'true' && format('gpu-ci-{0}-unit-gpu', github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id) || format('noop-{0}-unit-gpu', github.run_id) }}
      cancel-in-progress: ${{ github.event.pull_request != null }}
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - parallel:
          - name: Init public submodules
            run: |
              git config --global url."https://github.com/".insteadOf "git@github.com:"
              git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
          - name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
              enable-cache: true
              cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-extras --all-packages --locked
      - name: Run unit tests
        env:
          USERNAME_CI: CI_RUNNER
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
        run: uv run pytest tests/unit -m gpu

  integration:
    name: Integration / ${{ matrix.name }}
    needs: gate
    runs-on: prime-rl-2xh200
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all
    timeout-minutes: 60
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: ${{ needs.gate.outputs.run == 'true' && format('gpu-ci-{0}-integration-{1}', github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id, matrix.test) || format('noop-{0}-integration-{1}', github.run_id, matrix.test) }}
      cancel-in-progress: ${{ github.event.pull_request != null }}
    strategy:
      fail-fast: false
      # Bound per-PR fan-out: at most 5 integration jobs at a time (plus unit-tests),
      # i.e. 6 h200 pods per PR. Tune together with the ARC scale set maxRunners.
      max-parallel: 5
      matrix:
        include:
          - {test: reverse_text_sft, name: Reverse Text SFT}
          - {test: reverse_text_sft_lora, name: Reverse Text SFT LoRA}
          - {test: reverse_text, name: Reverse Text}
          - {test: reverse_text_rl_opd, name: Reverse Text RL OPD}
          - {test: reverse_text_rl_sft, name: Reverse Text RL SFT}
          - {test: alphabet_sort, name: Alphabet Sort}
          - {test: reverse_text_lora, name: Reverse Text LoRA}
          - {test: reverse_text_moe, name: Reverse Text MoE}
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - parallel:
          - name: Init public submodules
            run: |
              git config --global url."https://github.com/".insteadOf "git@github.com:"
              git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
          - name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
              enable-cache: true
              cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-extras --all-packages --locked
      - name: Run integration tests
        env:
          USERNAME_CI: CI_RUNNER
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          PRIME_BASE_URL: ${{ secrets.PRIME_BASE_URL }}
          PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        run: uv run pytest -vvs tests/integration/test_${{ matrix.test }}.py
      - name: Upload run logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test }}-logs
          path: /tmp/outputs/**/*.log
          retention-days: 7
          if-no-files-found: ignore
