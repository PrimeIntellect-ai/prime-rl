name: GPU Tests

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.label.name == 'gpu-ci')
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.label.name == 'gpu-ci')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove gpu-ci label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/gpu-ci"

  unit-gpu:
    name: Unit (GPU)
    needs: gate
    runs-on: prime-rl-2xh200
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all
    timeout-minutes: 45
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - parallel:
          - name: Init public submodules
            run: |
              git config --global url."https://github.com/".insteadOf "git@github.com:"
              git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
          - name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
              enable-cache: true
              cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-extras --all-packages --locked
      - name: Run unit tests
        env:
          USERNAME_CI: CI_RUNNER
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
        run: uv run pytest tests/unit -m gpu

  integration:
    name: Integration / ${{ matrix.name }}
    needs: gate
    runs-on: prime-rl-2xh200
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Bound per-PR fan-out: at most 5 integration jobs at a time (plus unit-tests),
      # i.e. 6 h200 pods per PR. Tune together with the ARC scale set maxRunners.
      max-parallel: 5
      matrix:
        include:
          - {test: reverse_text_sft, name: Reverse Text SFT}
          - {test: reverse_text_sft_lora, name: Reverse Text SFT LoRA}
          - {test: reverse_text, name: Reverse Text}
          - {test: reverse_text_rl_opd, name: Reverse Text RL OPD}
          - {test: reverse_text_rl_sft, name: Reverse Text RL SFT}
          - {test: alphabet_sort, name: Alphabet Sort}
          - {test: reverse_text_lora, name: Reverse Text LoRA}
          - {test: reverse_text_moe, name: Reverse Text MoE}
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - parallel:
          - name: Init public submodules
            run: |
              git config --global url."https://github.com/".insteadOf "git@github.com:"
              git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
          - name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
              enable-cache: true
              cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-extras --all-packages --locked
      - name: Run integration tests
        env:
          USERNAME_CI: CI_RUNNER
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          PRIME_BASE_URL: ${{ secrets.PRIME_BASE_URL }}
          PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        run: uv run pytest -vvs tests/integration/test_${{ matrix.test }}.py
      - name: Upload run logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test }}-logs
          path: /tmp/outputs/**/*.log
          retention-days: 7
          if-no-files-found: ignore
