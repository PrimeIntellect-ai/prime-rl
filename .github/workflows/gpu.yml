name: GPU Tests

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.label.name == 'gpu-ci')
      && format('pr-{0}', github.event.pull_request.number)
      || (github.event_name == 'push' && format('push-{0}', github.ref))
      || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.label.name == 'gpu-ci')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove gpu-ci label
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/gpu-ci"

  unit-gpu:
    name: Unit (GPU)
    needs: gate
    runs-on: prime-rl-2xh100
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all
    timeout-minutes: 45
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - parallel:
          - name: Init public submodules
            env:
              GITHUB_TOKEN: ${{ github.token }}
            run: |
              git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
              git config --global url."https://github.com/".insteadOf "git@github.com:"
              git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
          - name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
              enable-cache: false
      - name: Install dependencies
        timeout-minutes: 20
        env:
          UV_LOCK_TIMEOUT: "600"
          UV_HTTP_RETRIES: "8"
        run: uv sync --all-extras --all-packages --locked
      - name: Run unit tests
        env:
          USERNAME_CI: CI_RUNNER
          UV_NO_SYNC: "1"
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
        run: uv run pytest tests/unit -m gpu

  integration:
    name: Integration / ${{ matrix.name }}
    needs: gate
    runs-on: prime-rl-2xh100
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Bound per-PR fan-out: at most 5 integration jobs at a time (plus unit-tests),
      # i.e. 6 h100 pods per PR. Tune together with the ARC scale set maxRunners.
      max-parallel: 5
      matrix:
        include:
          - {test: reverse_text_sft, name: Reverse Text SFT, dashboard: true}
          - {test: reverse_text_sft_lora, name: Reverse Text SFT LoRA, dashboard: true}
          - {test: pretrain, name: Pretrain}
          - {test: reverse_text, name: Reverse Text, dashboard: true}
          - {test: reverse_text_rl_opd, name: Reverse Text RL OPD, dashboard: true}
          - {test: reverse_text_rl_sft, name: Reverse Text RL SFT, dashboard: true}
          - {test: alphabet_sort, name: Alphabet Sort, dashboard: true}
          - {test: reverse_text_lora, name: Reverse Text LoRA}
          - {test: reverse_text_moe, name: Reverse Text MoE}
          - {test: reverse_text_modelexpress, name: Reverse Text ModelExpress}
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - parallel:
          - name: Init public submodules
            env:
              GITHUB_TOKEN: ${{ github.token }}
            run: |
              git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
              git config --global url."https://github.com/".insteadOf "git@github.com:"
              git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
          - name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
              enable-cache: false
      - name: Install dependencies
        timeout-minutes: 20
        env:
          UV_LOCK_TIMEOUT: "600"
          UV_HTTP_RETRIES: "8"
        run: uv sync --all-extras --all-packages --locked
      - name: Install Playwright browser
        if: matrix.dashboard
        timeout-minutes: 16
        shell: bash
        run: |
          for attempt in 1 2 3; do
            time timeout 300 uv run --no-sync playwright install --with-deps --only-shell chromium && exit 0
            echo "Playwright install attempt $attempt failed"
          done
          exit 1
      - name: Install ModelExpress server
        if: matrix.test == 'reverse_text_modelexpress'
        run: |
          apt-get install -y curl make gcc
          bash scripts/install_modelexpress.sh
      - name: Run integration tests
        env:
          USERNAME_CI: CI_RUNNER
          UV_NO_SYNC: "1"
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          PRIME_BASE_URL: ${{ secrets.PRIME_BASE_URL }}
          PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          # The runner pods expose an InfiniBand device without a usable address, and UCX
          # auto-selects it, so ModelExpress's NIXL agent fails with uct_iface_open "Address
          # not valid". "^ib" excludes the InfiniBand transports, leaving TCP and CUDA IPC.
          # ModelExpress applies it to UCX_TLS only for its agent. An empty value leaves UCX untouched.
          NIXL_UCX_TLS: ${{ matrix.test == 'reverse_text_modelexpress' && '^ib' || '' }}
        run: uv run pytest -vvs tests/integration/test_${{ matrix.test }}.py
      - name: Upload run logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test }}-logs
          path: /tmp/outputs/**/*.log
          retention-days: 7
          if-no-files-found: ignore
