name: Build Kernels

# Builds the `prime-kernels` wheel (kernels/) for x86_64 and aarch64. Runs on any change
# under kernels/ to catch build breakage, and with `release_tag` to attach the wheels to a
# GitHub release — which is how they are consumed (see kernels/README.md).
#
# `tag-and-release.yaml` calls this for every release, before it promotes the draft, so a
# published release always carries the wheels its `[tool.uv.sources]` pin can point at.
# `workflow_dispatch` does the same by hand, for backfilling an already published release.
#
# No GPU is needed: nvcc cross compiles for the architectures kernels.toml declares.

on:
  pull_request:
    paths:
      - "kernels/**"
      - ".github/workflows/build_kernels.yaml"
  push:
    branches: [main]
    paths:
      - "kernels/**"
      - ".github/workflows/build_kernels.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the wheels to (e.g. v0.7.0). Empty = artifacts only."
        required: false
        type: string
      ref:
        description: "Ref to build the kernels from. Empty = the ref the workflow was started on."
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to attach the wheels to. The release may still be a draft."
        required: false
        type: string
      ref:
        description: "Ref to build the kernels from. Empty = the caller's ref."
        required: false
        type: string

env:
  # Keep in sync with the CUDA the prime-rl image is built against (Dockerfile.cuda);
  # the job container image below must be edited alongside it (no env context there).
  CUDA_TAG: cu128

jobs:
  build:
    name: Build wheel (${{ matrix.arch }})
    # Uploading the wheels to a release needs write; on workflow_call the caller
    # must grant it too (tag-and-release.yaml does).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: image-builder
            arch: x86_64
          - runner: image-builder-arm-2204
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential gh

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          ref: ${{ inputs.ref }}

      # Kernel sources come from public submodules under kernels/; only those are needed.
      - name: Init kernel submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive -- kernels/prime_kernels/flash_moe/prime-flash-moe

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env INSTALLER_NO_MODIFY_PATH=1 UV_INSTALL_DIR=/usr/local/bin sh
          uv --version

      # The wheel only imports under the exact torch it was compiled against, so build
      # against the torch prime-rl resolves rather than whatever is newest today.
      - name: Create build environment
        env:
          UV_TORCH_BACKEND: ${{ env.CUDA_TAG }}
        run: |
          TORCH_PIN=$(grep -A1 '^name = "torch"$' uv.lock | sed -n 's/^version = "\([^"+]*\).*"$/\1/p' | head -n1)
          if [ -z "$TORCH_PIN" ]; then
            echo "Could not read torch's version from uv.lock" >&2
            exit 1
          fi
          echo "Building against torch==$TORCH_PIN"
          uv venv --python 3.12 /tmp/build-env
          VIRTUAL_ENV=/tmp/build-env uv pip install "torch==$TORCH_PIN" setuptools wheel ninja

      # torch C++ extensions are bound to the torch and CUDA they were compiled against, so
      # the wheel carries both in its local version.
      - name: Stamp ABI into the version
        run: |
          TORCH_VERSION=$(/tmp/build-env/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')
          LOCAL="${CUDA_TAG}torch${TORCH_VERSION}"
          sed -i -E "s/^version = \"([^\"]+)\"$/version = \"\1+${LOCAL}\"/" kernels/pyproject.toml
          grep '^version' kernels/pyproject.toml

      - name: Build wheel
        env:
          VIRTUAL_ENV: /tmp/build-env
          CUDA_HOME: /usr/local/cuda
          PRIME_KERNELS_REQUIRE: "1"
          MAX_JOBS: "8"
        run: uv build --wheel --no-build-isolation --out-dir dist kernels

      - name: Inspect wheel
        run: |
          ls -lh dist/
          /tmp/build-env/bin/python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          extensions = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(".so")]
          assert extensions, f"{wheel.name} contains no compiled kernels"
          print(wheel.name, *extensions, sep="\n  ")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-kernels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # gh must not resolve the repo from the checkout: inside the container the
          # workspace is owned by another uid, which git rejects as dubious ownership.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$TAG" dist/*.whl --clobber
          # The `[tool.uv.sources]` pin has to name the wheel exactly, ABI suffix and all.
          WHEEL=$(basename dist/*.whl)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${WHEEL}"
          echo "\`{ url = \"$URL\", marker = \"platform_machine == '${{ matrix.arch }}'\" },\`" >> "$GITHUB_STEP_SUMMARY"
