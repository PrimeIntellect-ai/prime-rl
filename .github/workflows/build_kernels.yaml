name: Build Kernels

# Builds the `prime-kernels` wheel (kernels/) for x86_64 and aarch64. Runs on any change
# under kernels/ to catch build breakage, and on demand with `release_tag` to attach the
# wheels to a GitHub release — which is how they are consumed (see kernels/README.md).
#
# No GPU is needed: nvcc cross compiles for the architectures kernels.toml declares.

on:
  pull_request:
    paths:
      - "kernels/**"
      - ".github/workflows/build_kernels.yaml"
  push:
    branches: [main]
    paths:
      - "kernels/**"
      - ".github/workflows/build_kernels.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the wheels to (e.g. v0.7.0). Empty = artifacts only."
        required: false
        type: string

env:
  # Keep in sync with the CUDA the prime-rl image is built against (Dockerfile.cuda);
  # the job container image below must be edited alongside it (no env context there).
  CUDA_TAG: cu128

jobs:
  build:
    name: Build wheel (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: image-builder
            arch: x86_64
          - runner: image-builder-arm-2204
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      # Kernel submodules are private, so the public https rewrite the other workflows use
      # is not enough. KERNELS_SUBMODULE_TOKEN needs read access to the kernel repos.
      - name: Init kernel submodules
        env:
          TOKEN: ${{ secrets.KERNELS_SUBMODULE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "KERNELS_SUBMODULE_TOKEN is not set; cannot fetch private kernel sources." >&2
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init -- kernels

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env INSTALLER_NO_MODIFY_PATH=1 UV_INSTALL_DIR=/usr/local/bin sh
          uv --version

      - name: Create build environment
        env:
          UV_TORCH_BACKEND: ${{ env.CUDA_TAG }}
        run: |
          uv venv --python 3.12 /tmp/build-env
          VIRTUAL_ENV=/tmp/build-env uv pip install "torch>=2.9.0" setuptools wheel ninja

      # torch C++ extensions are bound to the torch and CUDA they were compiled against, so
      # the wheel carries both in its local version.
      - name: Stamp ABI into the version
        run: |
          TORCH_VERSION=$(/tmp/build-env/bin/python -c 'import torch; print(torch.__version__.split("+")[0])')
          LOCAL="${CUDA_TAG}torch${TORCH_VERSION}"
          sed -i -E "s/^version = \"([^\"]+)\"$/version = \"\1+${LOCAL}\"/" kernels/pyproject.toml
          grep '^version' kernels/pyproject.toml

      - name: Build wheel
        env:
          VIRTUAL_ENV: /tmp/build-env
          CUDA_HOME: /usr/local/cuda
          PRIME_KERNELS_REQUIRE: "1"
          MAX_JOBS: "8"
        run: uv build --wheel --no-build-isolation --out-dir dist kernels

      - name: Inspect wheel
        run: |
          ls -lh dist/
          /tmp/build-env/bin/python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          extensions = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(".so")]
          assert extensions, f"{wheel.name} contains no compiled kernels"
          print(wheel.name, *extensions, sep="\n  ")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-kernels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.whl --clobber
