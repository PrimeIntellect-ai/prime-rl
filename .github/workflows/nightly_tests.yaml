name: Nightly Tests

on:
    # Allow to manually trigger the workflow
    workflow_dispatch:
        inputs:
            test_id:
                description: "Single nightly test to run (e.g. tests/nightly/test_examples.py::test_example[wordle]). Leave empty to run all."
                required: false
                default: ""

    # Scheduled run at 3AM PST (11AM UTC)
    schedule:
        - cron: "0 11 * * *"

jobs:
    discover-experiments:
        name: Discover experiments
        runs-on: ubuntu-latest

        outputs:
            matrix: ${{ steps.build-matrix.outputs.matrix }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Build matrix from nightly tests
              id: build-matrix
              run: |
                  # Collect nightly test ids without installing the project
                  tests=$(uv run --no-project --with pytest pytest --collect-only -q -p no:cacheprovider --noconftest tests/nightly | grep '::')

                  # Filter to a specific test if provided in workflow_dispatch
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.test_id }}" ]; then
                      filtered=$(echo "$tests" | grep -xF "${{ github.event.inputs.test_id }}" || true)
                      if [ -z "$filtered" ]; then
                          echo "Error: Test '${{ github.event.inputs.test_id }}' not found"
                          exit 1
                      fi
                      tests="$filtered"
                  fi

                  echo "Discovered nightly tests:"
                  echo "$tests"

                  # Build JSON of the form: { "test_id": ["tests/nightly/test_examples.py::test_example[a]", ...] }
                  json=$(printf '%s\n' "$tests" | jq -R . | jq -sc '{test_id: .}')

                  echo "matrix=$json" >> "$GITHUB_OUTPUT"
    run-experiment:
        name: Run experiment
        needs: discover-experiments
        runs-on: research-cluster
        container:
            image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
            # --shm-size: vLLM V1's DP engine/API-server IPC uses POSIX shm-backed
            # MessageQueue (~160MB per queue); Docker's default 64MB /dev/shm triggers
            # SIGBUS in DP engine cores on VLM runs (mm data overflows tmpfs).
            options: --gpus all --shm-size=16g
        timeout-minutes: 1440 # 24 hours
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.discover-experiments.outputs.matrix) }}

        steps:
            - name: Install Git
              run: |
                  apt-get update
                  apt-get install -y git
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - name: Init public submodules
              run: |
                  git config --global url."https://github.com/".insteadOf "git@github.com:"
                  git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
            - name: Install dependencies
              run: uv sync --all-extras --all-packages --locked
            - name: Run experiment
              env:
                  USERNAME_CI: CI_RUNNER
                  WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
                  # Set WANDB_MODE to online only if WANDB_API_KEY is available, otherwise set to offline
                  # This is to allow running tests on forks without WANDB_API_KEY
                  WANDB_MODE: ${{ secrets.WANDB_API_KEY && 'online' || 'offline' }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
                  PRIME_BASE_URL: ${{ secrets.PRIME_BASE_URL }}
                  PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
                  GITHUB_HEAD_REF: ${{ github.head_ref }}
              run: |
                  echo "Running test: ${{ matrix.test_id }}"
                  uv run pytest "${{ matrix.test_id }}"
