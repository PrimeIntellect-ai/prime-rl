name: Regression

# Scheduled regression suites, one job group per suite. Dispatch with `suite`
# to run one of them.
#   parallel: test_parallel_invariance.py on the 2xH200 runners
#   eval:     every configs/eval/*.toml through `uv run eval` against Prime
#             Inference, compared against baselines/eval/. reports/eval/ holds
#             the error bars of each baseline. Also runs on PRs that touch the
#             suite.
# All paths are relative to tests/regression/.

on:
    workflow_dispatch:
        inputs:
            suite:
                description: "Suite to run"
                type: choice
                options: [all, parallel, eval]
                default: all
            eval_repeats:
                description: "eval: independent runs. Use 5 to produce a new baseline."
                required: false
                default: "1"
            eval_model:
                description: "eval: model id on Prime Inference (empty: the config's model)"
                required: false
                default: ""
            eval_set_baseline:
                description: "eval: open a PR that makes these runs the new baseline (needs 2+ runs)"
                type: boolean
                default: false
    pull_request:
        paths:
            - .github/workflows/regression.yml
            - tests/regression/**

    # 3AM PST (11AM UTC)
    schedule:
        - cron: "0 11 * * *"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

env:
    EVAL_REPEATS: ${{ inputs.eval_repeats || '1' }}
    EVAL_NAME: gsm8k

jobs:
    parallel:
        name: Parallel / Invariance
        if: ${{ github.event_name != 'pull_request' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'parallel') }}
        runs-on: prime-rl-2xh200
        container:
            image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
            options: --gpus all
        timeout-minutes: 60
        steps:
            - name: Install Git
              run: |
                  apt-get update
                  apt-get install -y git
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - parallel:
                  - name: Init public submodules
                    run: |
                        git config --global url."https://github.com/".insteadOf "git@github.com:"
                        git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
                  - name: Install uv
                    uses: astral-sh/setup-uv@v10.0.1
                    with:
                        enable-cache: true
                        cache-dependency-glob: "uv.lock"
            - name: Install dependencies
              run: uv sync --all-extras --all-packages --locked
            - name: Run invariance test
              env:
                  USERNAME_CI: CI_RUNNER
                  WANDB_MODE: offline
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  PYTEST_OUTPUT_DIR: /tmp/outputs
              run: uv run pytest -vvs tests/regression/test_parallel_invariance.py
            - name: Upload run logs on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: parallel-invariance-logs
                  path: /tmp/outputs/**/*.log
                  retention-days: 7
                  if-no-files-found: ignore

    eval-plan:
        name: Eval / Plan
        if: ${{ !inputs.suite || inputs.suite == 'all' || inputs.suite == 'eval' }}
        runs-on: ubuntu-latest
        outputs:
            repeats: ${{ steps.plan.outputs.repeats }}
        steps:
            - id: plan
              run: echo "repeats=$(jq -nc "[range(1; $EVAL_REPEATS + 1)]")" >> "$GITHUB_OUTPUT"

    eval:
        name: ${{ strategy.job-total > 1 && format('Eval / Run ({0})', matrix.repeat) || 'Eval / Run' }}
        needs: eval-plan
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                repeat: ${{ fromJSON(needs.eval-plan.outputs.repeats) }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - parallel:
                  - name: Init public submodules
                    run: |
                        git config --global url."https://github.com/".insteadOf "git@github.com:"
                        git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
                  - name: Install uv
                    uses: astral-sh/setup-uv@v10.0.1
                    with:
                        enable-cache: true
                        cache-dependency-glob: "uv.lock"
            - name: Install dependencies
              run: uv sync --all-packages --locked
            - name: Run eval
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
                  PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
                  MODEL: ${{ inputs.eval_model }}
              run: |
                  start=$(date +%s)
                  uv run eval @ "tests/regression/configs/eval/$EVAL_NAME.toml" ${MODEL:+-m "$MODEL"} \
                      --no-monitors.prime --run.name "repeat-${{ matrix.repeat }}" --output-dir outputs
                  python3 tests/regression/scripts/eval.py collect "outputs/repeat-${{ matrix.repeat }}" \
                      --repeat ${{ matrix.repeat }} --wall-s "$(( $(date +%s) - start ))" --out result.json
            - name: Upload result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: eval-result-${{ matrix.repeat }}
                  path: |
                      result.json
                      outputs/repeat-${{ matrix.repeat }}/logs
                      outputs/repeat-${{ matrix.repeat }}/monitors/file/metrics.jsonl
                      outputs/repeat-${{ matrix.repeat }}/monitors/file/traces/stream.index.jsonl
                  if-no-files-found: ignore
                  retention-days: 30

    eval-summary:
        name: Eval / Summary
        needs: eval
        if: ${{ !cancelled() && needs.eval.result != 'skipped' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - name: Download results
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  pattern: eval-result-*
            - name: Compare against baseline
              run: |
                  # A single downloaded artifact lands in artifacts/ itself, several land in subdirectories.
                  status=0
                  python3 tests/regression/scripts/eval.py summarize $(find artifacts -name result.json) \
                      --expected "$EVAL_REPEATS" --baseline "tests/regression/baselines/eval/$EVAL_NAME.json" \
                      > summary.md || status=$?
                  tee -a "$GITHUB_STEP_SUMMARY" < summary.md
                  exit $status
            - name: Open baseline PR
              if: ${{ !cancelled() && inputs.eval_set_baseline && needs.eval.result == 'success' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch="regression/eval-baseline-${{ github.run_id }}"
                  python3 tests/regression/scripts/eval.py baseline $(find artifacts -name result.json) \
                      --out "tests/regression/baselines/eval/$EVAL_NAME.json" \
                      --report "tests/regression/reports/eval/$EVAL_NAME.md"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -b "$branch"
                  git add tests/regression/baselines/eval tests/regression/reports/eval
                  git commit -m "Refresh $EVAL_NAME eval regression baseline"
                  git push origin "$branch"
                  {
                      echo "## Summary"
                      echo
                      echo "- Refresh the \`$EVAL_NAME\` eval regression baseline from [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
                      echo
                      cat summary.md
                  } > body.md
                  gh pr create --base main --head "$branch" --body-file body.md \
                      --title "chore: refresh $EVAL_NAME eval regression baseline"
