name: Regression

# Scheduled regression suites, one job group per suite. Dispatch with `suite`
# to run one of them.
#   parallel: test_parallel_invariance.py on the 4xH100 runners
#   eval:     every configs/eval/*.toml through `uv run eval` against Prime
#             Inference, compared against baselines/eval/. reports/eval/ holds
#             the error bars of each baseline. Also runs on PRs that touch the
#             suite.
# All paths are relative to tests/regression/.

on:
    workflow_dispatch:
        inputs:
            suite:
                description: "Suite to run"
                type: choice
                options: [all, parallel, eval]
                default: all
            eval_config:
                description: "eval: config to run, by name (e.g. gsm8k). Leave empty to run all."
                required: false
                default: ""
            eval_repeats:
                description: "eval: independent runs of each config. Use 5 to produce a new baseline."
                required: false
                default: "1"
            eval_max_parallel:
                description: "eval: most eval jobs to run at once (empty: no limit). Use it to spread a baseline's runs over time."
                required: false
                default: ""
            eval_model:
                description: "eval: model id on Prime Inference (empty: the config's model)"
                required: false
                default: ""
            eval_set_baseline:
                description: "eval: open a PR that makes these runs the new baseline (needs 2+ runs)"
                type: boolean
                default: false
    pull_request:
        paths:
            - .github/workflows/regression.yml
            - tests/regression/**

    # 3AM PST (11AM UTC)
    schedule:
        - cron: "0 11 * * *"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

env:
    EVAL_REPEATS: ${{ inputs.eval_repeats || '1' }}

jobs:
    parallel:
        name: Parallel / Invariance
        if: ${{ github.event_name != 'pull_request' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'parallel') }}
        runs-on: prime-rl-4xh100
        container:
            image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
            options: --gpus all
        timeout-minutes: 60
        steps:
            - name: Install Git
              run: |
                  apt-get update
                  apt-get install -y git
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - parallel:
                  - name: Init public submodules
                    run: |
                        git config --global url."https://github.com/".insteadOf "git@github.com:"
                        git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
                  - name: Install uv
                    uses: astral-sh/setup-uv@v10.0.1
                    with:
                        enable-cache: false
            - name: Install dependencies
              run: uv sync --all-extras --all-packages --locked
            - name: Run invariance test
              env:
                  USERNAME_CI: CI_RUNNER
                  WANDB_MODE: offline
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  PYTEST_OUTPUT_DIR: /tmp/outputs
              run: uv run pytest -vvs tests/regression/test_parallel_invariance.py
            - name: Upload run logs on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: parallel-invariance-logs
                  path: /tmp/outputs/**/*.log
                  retention-days: 7
                  if-no-files-found: ignore

    eval-plan:
        name: Eval / Plan
        if: ${{ !inputs.suite || inputs.suite == 'all' || inputs.suite == 'eval' }}
        runs-on: ubuntu-latest
        outputs:
            configs: ${{ steps.plan.outputs.configs }}
            names: ${{ steps.plan.outputs.names }}
            matrix: ${{ steps.plan.outputs.matrix }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - id: plan
              env:
                  CONFIG: ${{ inputs.eval_config }}
                  # Display name of each config in job names and the summary. A config not listed shows its file name.
                  NAMES: '{"gsm8k": "GSM8K", "pi-terminalbench2-1": "Terminal-Bench-2.1"}'
              run: |
                  configs=$(ls tests/regression/configs/eval/*.toml | xargs -n1 basename | sed 's/\.toml$//')
                  if [ -n "$CONFIG" ]; then
                      configs=$(echo "$configs" | grep -Fx "$CONFIG" || true)
                      if [ -z "$configs" ]; then
                          echo "Error: eval config '$CONFIG' not found" >&2
                          exit 1
                      fi
                  fi
                  configs=$(printf '%s\n' "$configs" | jq -R . | jq -sc .)
                  # One job per config and repeat. The repeat shows in the job name only when there are several.
                  names=$(jq -nc --argjson configs "$configs" --argjson names "$NAMES" '
                      [$configs[] as $c | {($c): ($names[$c] // $c)}] | add')
                  matrix=$(jq -nc --argjson configs "$configs" --argjson names "$names" --argjson n "$EVAL_REPEATS" '[
                      $configs[] as $c | range(1; $n + 1) as $r
                      | {config: $c, repeat: $r, name: (if $n > 1 then "\($names[$c]) (\($r))" else $names[$c] end)}
                  ]')
                  echo "configs=$configs" >> "$GITHUB_OUTPUT"
                  echo "names=$names" >> "$GITHUB_OUTPUT"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    eval:
        name: Eval / ${{ matrix.name }}
        needs: eval-plan
        runs-on: ubuntu-latest
        # The GitHub-hosted maximum. An agent eval caps the agent time of each rollout in its
        # config, so that it ends before this limit.
        timeout-minutes: 360
        strategy:
            fail-fast: false
            max-parallel: ${{ fromJSON(inputs.eval_max_parallel || '256') }}
            matrix:
                include: ${{ fromJSON(needs.eval-plan.outputs.matrix) }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - parallel:
                  - name: Init public submodules
                    run: |
                        git config --global url."https://github.com/".insteadOf "git@github.com:"
                        git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
                  - name: Install uv
                    uses: astral-sh/setup-uv@v10.0.1
                    with:
                        enable-cache: true
                        cache-dependency-glob: "uv.lock"
            - name: Install dependencies
              run: uv sync --all-packages --locked
            # Harbor tasksets download their task files into ~/.cache/harbor. The prime-envs
            # commit pins every taskset's data, so it keys the cache.
            - name: Key the Harbor cache
              id: harbor
              run: echo "key=harbor-${{ matrix.config }}-$(git rev-parse HEAD:deps/prime-envs)" >> "$GITHUB_OUTPUT"
            - name: Cache Harbor tasks
              uses: actions/cache@v4
              with:
                  path: ~/.cache/harbor
                  key: ${{ steps.harbor.outputs.key }}
            - name: Run eval
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
                  PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
                  MODEL: ${{ inputs.eval_model }}
                  CONFIG: ${{ matrix.config }}
                  REPEAT: ${{ matrix.repeat }}
              run: |
                  start=$(date +%s)
                  uv run eval @ "tests/regression/configs/eval/$CONFIG.toml" ${MODEL:+-m "$MODEL"} \
                      --no-monitors.prime --run.name "$CONFIG-$REPEAT" --output-dir outputs
                  mkdir -p "results/$CONFIG"
                  python3 tests/regression/scripts/eval.py collect "outputs/$CONFIG-$REPEAT" \
                      --repeat "$REPEAT" --wall-s "$(( $(date +%s) - start ))" --out "results/$CONFIG/$REPEAT.json"
            - name: Upload result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: eval-result-${{ matrix.config }}-${{ matrix.repeat }}
                  path: |
                      results
                      outputs/${{ matrix.config }}-${{ matrix.repeat }}/logs
                      outputs/${{ matrix.config }}-${{ matrix.repeat }}/monitors/file/metrics.jsonl
                      outputs/${{ matrix.config }}-${{ matrix.repeat }}/monitors/file/traces/stream.index.jsonl
                  if-no-files-found: ignore
                  retention-days: 30
            # Each config posts its own message when its eval ends, so a long eval does not delay
            # the others. Only nightly and manual runs of one repeat post. Runs for a new baseline
            # report in the summary only. always(), because a job that hits its timeout ends as
            # cancelled, and that eval must still report.
            - name: Post to Slack
              if: ${{ always() && github.event_name != 'pull_request' && env.EVAL_REPEATS == '1' }}
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  CONFIG: ${{ matrix.config }}
                  NAME: ${{ matrix.name }}
              run: |
                  if [ -z "$SLACK_WEBHOOK_URL" ]; then
                      echo "SLACK_WEBHOOK_URL is not set. Skipped."
                      exit 0
                  fi
                  python3 tests/regression/scripts/eval.py summarize --name "$NAME" \
                      $(find results -path "results/$CONFIG/*.json" 2>/dev/null) \
                      --expected 1 --baseline "tests/regression/baselines/eval/$CONFIG.json" \
                      --slack slack.json > /dev/null || true
                  curl -fsS -X POST -H "Content-Type: application/json" --data @slack.json "$SLACK_WEBHOOK_URL"

    eval-summary:
        name: Eval / Summary
        needs: [eval-plan, eval]
        if: ${{ !cancelled() && needs.eval.result != 'skipped' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - name: Download results
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  pattern: eval-result-*
            - name: Compare against baselines
              env:
                  CONFIGS: ${{ needs.eval-plan.outputs.configs }}
                  NAMES: ${{ needs.eval-plan.outputs.names }}
              run: |
                  # A single downloaded artifact lands in artifacts/ itself, several land in subdirectories.
                  status=0
                  : > summary.md
                  for config in $(echo "$CONFIGS" | jq -r '.[]'); do
                      name=$(echo "$NAMES" | jq -r --arg c "$config" '.[$c]')
                      python3 tests/regression/scripts/eval.py summarize --name "$name" \
                          $(find artifacts -path "*/results/$config/*.json") \
                          --expected "$EVAL_REPEATS" --baseline "tests/regression/baselines/eval/$config.json" \
                          >> summary.md || status=1
                  done
                  tee -a "$GITHUB_STEP_SUMMARY" < summary.md
                  exit $status
            - name: Open baseline PR
              if: ${{ !cancelled() && inputs.eval_set_baseline && needs.eval.result == 'success' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CONFIGS: ${{ needs.eval-plan.outputs.configs }}
              run: |
                  configs=$(echo "$CONFIGS" | jq -r 'join(", ")')
                  branch="regression/eval-baseline-${{ github.run_id }}"
                  for config in $(echo "$CONFIGS" | jq -r '.[]'); do
                      python3 tests/regression/scripts/eval.py baseline $(find artifacts -path "*/results/$config/*.json") \
                          --out "tests/regression/baselines/eval/$config.json" \
                          --report "tests/regression/reports/eval/$config.md"
                  done
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -b "$branch"
                  git add tests/regression/baselines/eval tests/regression/reports/eval
                  git commit -m "Refresh eval regression baselines: $configs"
                  git push origin "$branch"
                  {
                      echo "## Summary"
                      echo
                      echo "- Refresh the eval regression baselines of $configs from [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
                      echo
                      cat summary.md
                  } > body.md
                  gh pr create --base main --head "$branch" --body-file body.md \
                      --title "chore: refresh eval regression baselines"
