name: Regression

# Nightly regression suites, one job group per suite. Each suite compares
# tonight's run against a committed baseline and fails on a regression.
#   eval: configs/ci/regression/eval/*.toml against Prime Inference

on:
    workflow_dispatch:
        inputs:
            suite:
                description: "Suite to run"
                type: choice
                options: [all, eval]
                default: all
            eval_repeats:
                description: "eval: independent runs. Use 5 to produce a new baseline."
                required: false
                default: "1"
            eval_model:
                description: "eval: model id on Prime Inference (empty: the config's model)"
                required: false
                default: ""
    pull_request:
        paths:
            - .github/workflows/regression.yml
            - configs/ci/regression/**
            - scripts/eval_regression.py
    # 4AM PST (12PM UTC)
    schedule:
        - cron: "0 12 * * *"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

env:
    EVAL_REPEATS: ${{ inputs.eval_repeats || '1' }}
    EVAL_CONFIG: configs/ci/regression/eval/gsm8k.toml

jobs:
    eval-plan:
        name: "eval: plan"
        if: ${{ !inputs.suite || inputs.suite == 'all' || inputs.suite == 'eval' }}
        runs-on: ubuntu-latest
        outputs:
            repeats: ${{ steps.plan.outputs.repeats }}
        steps:
            - id: plan
              run: echo "repeats=$(jq -nc "[range(1; $EVAL_REPEATS + 1)]")" >> "$GITHUB_OUTPUT"

    eval:
        name: "eval: run ${{ matrix.repeat }}"
        needs: eval-plan
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                repeat: ${{ fromJSON(needs.eval-plan.outputs.repeats) }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
            - parallel:
                  - name: Init public submodules
                    run: |
                        git config --global url."https://github.com/".insteadOf "git@github.com:"
                        git submodule update --init --recursive -- deps/verifiers deps/renderers deps/prime-envs deps/pydantic-config
                  - name: Install uv
                    uses: astral-sh/setup-uv@v10.0.1
                    with:
                        enable-cache: true
                        cache-dependency-glob: "uv.lock"
            - name: Install dependencies
              run: uv sync --all-packages --locked
            - name: Run eval
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
                  PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
                  MODEL: ${{ inputs.eval_model }}
              run: |
                  start=$(date +%s)
                  uv run eval @ "$EVAL_CONFIG" ${MODEL:+-m "$MODEL"} \
                      --run.name "repeat-${{ matrix.repeat }}" --output-dir outputs
                  python3 scripts/eval_regression.py collect "outputs/repeat-${{ matrix.repeat }}" \
                      --repeat ${{ matrix.repeat }} --wall-s "$(( $(date +%s) - start ))" --out result.json
            - name: Upload result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: eval-result-${{ matrix.repeat }}
                  path: |
                      result.json
                      outputs/repeat-${{ matrix.repeat }}/logs
                      outputs/repeat-${{ matrix.repeat }}/monitors/file/metrics.jsonl
                      outputs/repeat-${{ matrix.repeat }}/monitors/file/traces/stream.index.jsonl
                  if-no-files-found: ignore
                  retention-days: 30

    eval-summary:
        name: "eval: summary"
        needs: eval
        if: ${{ always() && needs.eval.result != 'skipped' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  submodules: false
                  sparse-checkout: |
                      scripts/eval_regression.py
                      configs/ci/regression/eval
                  sparse-checkout-cone-mode: false
            - name: Download results
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  pattern: eval-result-*
            - name: Compare against baseline
              run: |
                  # A single downloaded artifact lands in artifacts/ itself, several land in subdirectories.
                  status=0
                  python3 scripts/eval_regression.py summarize $(find artifacts -name result.json 2>/dev/null) \
                      --expected "$EVAL_REPEATS" \
                      --baseline "${EVAL_CONFIG%.toml}.baseline.json" --write-baseline baseline.json \
                      > summary.md || status=$?
                  tee -a "$GITHUB_STEP_SUMMARY" < summary.md
                  exit $status
            - name: Upload new baseline
              if: always() && hashFiles('baseline.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: eval-baseline
                  path: baseline.json
                  retention-days: 90
