# Reverse-text RL with a custom renderer loaded from a local file.
# Same run as examples/basic/reverse-text/rl.toml, with [orchestrator.renderer] pointing at it.

max_steps = 20
seq_len = 2048

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[orchestrator]
batch_size = 128

[orchestrator.renderer]
name = "custom"
import_path = "examples/extra/custom-renderer/renderer.py:InstructedQwen3Renderer"
instruction = "Reverse every character, including spaces and punctuation."

[orchestrator.train]
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 5

[orchestrator.eval.sampling]
max_completion_tokens = 128

[[orchestrator.eval.source]]
name = "reverse-text-eval"
select.limit = 256
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt] # Checkpoint at the end of training

[inference]

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
