# Evaluate a model on wiki-search against a local inference server
# (`uv run inference --vllm.model Qwen/Qwen3-4B-Instruct-2507 --vllm.tool-call-parser hermes`).
# Override the model with `-m` to evaluate a trained checkpoint.
#
#   uv run eval @ examples/basic/wiki-search/eval.toml

model = "Qwen/Qwen3-4B-Instruct-2507"
num_examples = 20
group_size = 3

[client]
base_url = "http://localhost:8000/v1"

[sampling]
max_completion_tokens = 512

[[source]]
name = "wiki-search"
env.taskset.id = "wiki-search"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
