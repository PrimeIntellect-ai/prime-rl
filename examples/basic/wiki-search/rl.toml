max_steps = 200
seq_len = 4096

[deployment]
num_train_gpus = 2
num_infer_gpus = 6

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "wiki-search"
name = "wiki-search"

[trainer.optim]
lr = 1e-5
weight_decay = 0.0

[trainer.model.lora]
rank = 8
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj"
]

[orchestrator]
token_batch_size = 786432 # 512 rollouts x ~1.5k avg tokens
max_inflight_episodes = 1024
group_size = 16

[orchestrator.model.lora]
name = "qwen3-4b-wiki-search"

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.source]]
name = "wiki-search"

[orchestrator.train.source.env.taskset]
id = "wiki-search"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[ckpt] # Checkpoint at the end of training

[inference.vllm]
tool_call_parser = "hermes"
