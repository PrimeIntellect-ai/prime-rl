max_steps = 100

[ckpt] # Checkpoint at the end of training

[model]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
name = "willcb/R1-reverse-wikipedia-paragraphs-v1-1000"
seq_len = 4096
batch_size = 32

[optim]
lr = 2e-5

# Online evals: the trainer writes an HF weight checkpoint every `interval` steps,
# the inference server reloads it from disk, and the evaluator runs the eval envs
# against it (plus the base model before step 1 and the final checkpoint).
[eval]
interval = 25
num_examples = 32

[eval.sampling]
max_completion_tokens = 1024

[[eval.source]]
name = "reverse-text"

[eval.source.env.taskset]
id = "reverse-text"

[eval.source.env.agent.harness]
id = "null"

[eval.source.env.agent.runtime]
type = "subprocess"

[inference]

[deployment]
num_gpus = 1
num_infer_gpus = 1
