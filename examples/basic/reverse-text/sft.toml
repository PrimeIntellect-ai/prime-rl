max_steps = 10

[ckpt] # Checkpoint at the end of training

[model]
name = "Qwen/Qwen3.5-0.8B"

[data]
name = "PrimeIntellect/Reverse-Text-SFT"
seq_len = 4096
batch_size = 32

[optim]
lr = 2e-5

[eval]
interval = 25

[eval.select]
limit = 32

[eval.sampling]
max_completion_tokens = 1024

[[eval.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
