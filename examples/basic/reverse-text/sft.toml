mode = "sft"
max_steps = 100

[ckpt] # Checkpoint at the end of training

[model]
name = "PrimeIntellect/Qwen3-0.6B"

[data]
seq_len = 4096
batch_size = 32

[[data.source]]
name = "reverse-wikipedia"
dataset = "willcb/R1-reverse-wikipedia-paragraphs-v1-1000"

[optim]
lr = 2e-5

[eval]
interval = 25

[eval.select]
limit = 32

[eval.sampling]
max_completion_tokens = 1024

[[eval.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]

# Intel GPUs (XPU): uncomment until XCCL weight broadcast is supported.
# [weight_broadcast]
# type = "filesystem"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
