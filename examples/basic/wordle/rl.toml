max_steps = 200
seq_len = 8192

[deployment]
num_train_gpus = 2
num_infer_gpus = 6

[wandb]
project = "wordle"
name = "wordle"

[ckpt] # Checkpoint at the end of training

[model]
name = "PrimeIntellect/Qwen3-1.7B-Wordle-SFT"

[orchestrator]
batch_size = 512
group_size = 16

[[orchestrator.train.source]]
name = "wordle"

[orchestrator.train.source.env.taskset]
id = "wordle-v1"

[orchestrator.train.source.env.player.harness]
id = "null"

[orchestrator.train.source.env.player.runtime]
type = "subprocess"

[orchestrator.train.sampling]
max_completion_tokens = 1024

[trainer] # Default trainer config

[inference.vllm]
data_parallel_size = 6
[orchestrator.renderer]
name = "prime-qwen3"
