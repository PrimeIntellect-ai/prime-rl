# Evaluate a model on wordle against a local inference server
# (`uv run inference --vllm.model Qwen/Qwen3-1.7B`). Override the model
# with `-m` to evaluate a trained checkpoint.
#
#   uv run eval @ examples/basic/wordle/eval.toml

model = "Qwen/Qwen3-1.7B"
num_examples = 20
group_size = 3

[client]
base_url = "http://localhost:8000/v1"

[sampling]
max_completion_tokens = 1024

[[source]]
name = "wordle"
env.taskset.id = "wordle"
env.player.harness.id = "null"
env.player.runtime.type = "subprocess"
