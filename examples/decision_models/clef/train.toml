# Clef-Flash: full fine-tuning of Qwen3.5-9B with Clef's joint schema head on Typed Decisions Synth. From the repository
# root (see README.md, which also says what memory it needs):
#     PYTHONPATH=examples uv run sft @ examples/decision_models/clef/train.toml
# Not yet run on a GPU: the learning rate, the schedule and the memory use are unmeasured.
mode = "sft"
# One pass over the 6,682 training records is 579 packed rows of up to 8,192 tokens, 11.5 records a row on average, and
# a step is 2 rows.
max_steps = 290

[model]
name = "outputs/clef/clef-flash-prime-rl"  # the release, linked, with the head's sizes in config.json (write_config.py)

[model.implementation]
import_path = "decision_models.clef.model.Qwen3_5Clef"

[data]
type = "system_one"
name = "outputs/typed-decisions-synth-system-one"  # the records (../data/convert_typed_decisions_synth.py)
subsets = ["default"]
splits = ["train"]
seq_len = 8192  # the longest record has 1,609 tokens; Clef shortens a longer state to fit
batch_size = 2

[data.encoder]
import_path = "decision_models.clef.encoder.ClefEncoder"

[loss]
type = "custom"
import_path = "prime_rl.trainer.sft.system_one.loss.decision_loss"
kwargs = { brier_weight = 0.0 }  # soft cross-entropy alone: Clef published no training loss

[optim]
lr = 1e-5  # untuned: a conservative starting value for full fine-tuning

[scheduler]
type = "cosine"
warmup_steps = 20

[val]
interval = 58  # five times after the baseline, the last on the final step
eval_on_start = true  # the baseline: the released model, before any update

[val.data]
name = "outputs/typed-decisions-synth-system-one"
subsets = ["default"]
splits = ["validation"]
seq_len = 8192

[val.data.encoder]
import_path = "decision_models.clef.encoder.ClefEncoder"

[ckpt]
interval = 145
keep_last = 1
