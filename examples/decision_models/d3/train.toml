# d3-nano: full fine-tuning of Qwen3.5-2B with d3's answer-code readout on Typed Decisions Synth, on one GPU. From the
# repository root (see README.md):
#     PYTHONPATH=examples uv run sft @ examples/decision_models/d3/train.toml
# Not yet run on a GPU: the learning rate, the schedule and the memory use are unmeasured, and the full-attention
# layers have not run non-causally in prime-rl's flash-attention kernels.
mode = "sft"
# One pass over the 6,682 training records is 543 steps: a step is 2 packed rows of up to 8,192 tokens, and a row holds
# 6.2 records (21.5 questions, each its own prompt) on average.
max_steps = 550

[model]
name = "outputs/d3/d3-nano-prime-rl"  # the release under prime-rl's names, with the readout (prepare_checkpoint.py)

[model.implementation]
import_path = "decision_models.d3.model.Qwen3_5D3"

[data]
type = "system_one"
name = "outputs/typed-decisions-synth-system-one"  # the records (../data/convert_typed_decisions_synth.py)
subsets = ["default"]
splits = ["train"]
seq_len = 8192  # the longest record has 5,341 tokens
batch_size = 2

[data.encoder]
import_path = "decision_models.d3.encoder.D3Encoder"

[loss]
type = "custom"
import_path = "prime_rl.trainer.sft.system_one.loss.decision_loss"
kwargs = { brier_weight = 0.0 }  # soft cross-entropy alone: d3 published no training recipe

[optim]
lr = 1e-5  # untuned: a conservative starting value for full fine-tuning

[scheduler]
type = "cosine"  # untuned, like the learning rate
warmup_steps = 25

[val]
interval = 50
eval_on_start = true  # the baseline: the released model, before any update

[val.data]
name = "outputs/typed-decisions-synth-system-one"
subsets = ["default"]
splits = ["validation"]
seq_len = 8192

[val.data.encoder]
import_path = "decision_models.d3.encoder.D3Encoder"

[ckpt]
interval = 275
keep_last = 2
