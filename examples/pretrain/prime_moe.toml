# prime_moe with 64 routed experts (6 active) and 2 shared experts, d = 512 and 8 layers (moe-d512/config.json), trained from scratch on
# the Dolma 3 mixture tokenized with the DeepSeek-V4 tokenizer.
# 4096 steps x 256K tokens = 1.1B tokens. QK-norm and the learning rate follow the MoE QK-norm sweep (optimum 2^-7
# with QK-norm at d = 512).
#
#   uv run pretrain @ examples/pretrain/prime_moe.toml

max_steps = 4096

[model]
name = "examples/pretrain/moe-d512"  # the architecture: config.json only, no weights
ac = "None"

[tokenizer]
name = "tokenizers/deepseek-v4-flash-base"  # a local copy of deepseek-ai/DeepSeek-V4-Flash-Base without config.json

[data]
type = "tokens"
seq_len = 8192
batch_size = 32
micro_batch_size = 8
# The five source folders pooled: the mixture at the token shares they were made with.
paths = [
  "data/dolma3-50b-dsv4/web",
  "data/dolma3-50b-dsv4/pdfs",
  "data/dolma3-50b-dsv4/code",
  "data/dolma3-50b-dsv4/math",
  "data/dolma3-50b-dsv4/reference",
]

[optim]
type = "muon"
lr = 0.0078125
max_norm = 1.0

[evals]
interval = 512
# 5M held-out tokens of the five sources, at their training shares.
sets = [{ name = "heldout", path = "data/dolma3-50b-dsv4/mix-val-5M" }]

[ckpt]
interval = 1024
