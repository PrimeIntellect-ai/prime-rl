# Llama 3 architecture with ~495.5M non-embedding parameters, trained from scratch on FineWeb-Edu.
# 19,000 steps x 256 rows x 2048 tokens = 10.0B tokens (~20 tokens per non-embedding parameter).
# The learning rate is a starting point, not a tuned value.
#
#   uv run pretrain @ examples/pretrain/llama3/500m.toml

max_steps = 19000

[model]
name = "meta-llama/Llama-3.2-1B"  # baseline: architecture class, tokenizer (128,256 tokens)
offload = "none"

[model.arch]
hidden_size = 1280
num_hidden_layers = 21
num_attention_heads = 20
num_key_value_heads = 4
head_dim = 64
intermediate_size = 5120
tie_word_embeddings = false
rope_parameters = { rope_type = "default", rope_theta = 500000.0 }

[model.init]
scheme = "scaled"

[data]
name = "HuggingFaceFW/fineweb-edu"
subsets = ["sample-100BT"]
seq_len = 2048
batch_size = 256
micro_batch_size = 4
holdout_docs = 10000

[optim]
lr = 6e-4
betas2 = 0.95

[schedules.optim.lr]
type = "cosine"
warmup = 950
end_ratio = 0.1

[val]
interval = 950

[[val.source]]
name = "wikitext"
dataset = "Salesforce/wikitext"
subset = "wikitext-103-raw-v1"
split = "test"


[ckpt]
interval = 1900
