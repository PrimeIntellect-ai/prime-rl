# Llama 3 architecture with ~973.1M non-embedding parameters, trained from scratch on FineWeb-Edu.
# 37,200 steps x 256 rows x 2048 tokens = 19.5B tokens (~20 tokens per non-embedding parameter).
# The learning rate is a starting point, not a tuned value.
#
#   uv run pretrain @ examples/pretrain/llama3/1b.toml

max_steps = 37200

[model]
name = "meta-llama/Llama-3.2-1B"  # baseline: architecture class, tokenizer (128,256 tokens)
offload = "none"

[model.arch]
hidden_size = 2048
num_hidden_layers = 16
num_attention_heads = 32
num_key_value_heads = 8
head_dim = 64
intermediate_size = 8192
tie_word_embeddings = false
rope_parameters = { rope_type = "default", rope_theta = 500000.0 }

[model.init]
scheme = "scaled"

[data]
name = "HuggingFaceFW/fineweb-edu"
subsets = ["sample-100BT"]
seq_len = 2048
batch_size = 256
micro_batch_size = 2
holdout_docs = 10000

[optim]
lr = 4e-4
betas2 = 0.95

[schedules.optim.lr]
type = "cosine"
warmup = 1850
end_ratio = 0.1

[val]
interval = 1860

[[val.source]]
name = "wikitext"
dataset = "Salesforce/wikitext"
subset = "wikitext-103-raw-v1"
split = "test"


[ckpt]
interval = 3720
