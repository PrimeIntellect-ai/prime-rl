# Llama 3 architecture with ~70.8M non-embedding parameters, trained from scratch on FineWeb-Edu.
# 2,800 steps x 256 rows x 2048 tokens = 1.5B tokens (~20 tokens per non-embedding parameter).
# The learning rate is a starting point, not a tuned value.
#
#   uv run pretrain @ examples/pretrain/llama3/70m.toml

max_steps = 2800

[model]
name = "meta-llama/Llama-3.2-1B"  # baseline: architecture class, tokenizer (128,256 tokens)
offload = "none"
ac = "None"  # small enough to keep all activations

[model.arch]
hidden_size = 640
num_hidden_layers = 12
num_attention_heads = 10
num_key_value_heads = 2
head_dim = 64
intermediate_size = 2560
tie_word_embeddings = false
rope_parameters = { rope_type = "default", rope_theta = 500000.0 }

[model.init]
scheme = "scaled"

[data]
name = "HuggingFaceFW/fineweb-edu"
subsets = ["sample-10BT"]
seq_len = 2048
batch_size = 256
micro_batch_size = 8
holdout_docs = 10000

[optim]
lr = 1.5e-3
betas2 = 0.95

[scheduler]
type = "cosine"
warmup_steps = 150
min_lr = 0.00015

[val]
interval = 140

[[val.source]]
name = "wikitext"
dataset = "Salesforce/wikitext"
subset = "wikitext-103-raw-v1"
split = "test"

[evals]
interval = 280

[ckpt]
interval = 280
