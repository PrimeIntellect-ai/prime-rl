# Llama 3 architecture with ~17.3M non-embedding parameters, trained from scratch on FineWeb-Edu.
# 700 steps x 256 rows x 2048 tokens = 0.4B tokens (~20 tokens per non-embedding parameter).
# The learning rate is a starting point, not a tuned value.
#
#   uv run pretrain @ examples/pretrain/llama3/17m.toml

max_steps = 700

[model]
name = "meta-llama/Llama-3.2-1B"  # baseline: architecture class, tokenizer (128,256 tokens)
offload = "none"
ac = "None"  # small enough to keep all activations

[model.arch]
hidden_size = 384
num_hidden_layers = 8
num_attention_heads = 6
num_key_value_heads = 2
head_dim = 64
intermediate_size = 1536
tie_word_embeddings = false
rope_parameters = { rope_type = "default", rope_theta = 500000.0 }

[model.init]
scheme = "scaled"

[data]
name = "HuggingFaceFW/fineweb-edu"
subsets = ["sample-10BT"]
seq_len = 2048
batch_size = 256
micro_batch_size = 16
holdout_docs = 10000

[optim]
lr = 3e-3
betas2 = 0.95

[schedules.optim.lr]
type = "cosine"
warmup = 50
end_ratio = 0.1

[val]
interval = 100

[[val.source]]
name = "wikitext"
dataset = "Salesforce/wikitext"
subset = "wikitext-103-raw-v1"
split = "test"


[ckpt]
interval = 100
