# GLM-4.5-style MoE (64 routed experts, 6 active, 2 shared) with d = 512 and 8 layers, trained from scratch on
# the Dolma 3 mixture tokenized with the DeepSeek-V4 tokenizer.
# 4096 steps x 256K tokens = 1.1B tokens. The learning rate is the optimum of the MoE base-shape sweep.
#
#   uv run pretrain @ examples/pretrain/glm4_moe.toml

max_steps = 4096

[model]
offload = "none"
ac = "None"

[model.arch]
model_type = "glm4_moe"
hidden_size = 512
num_hidden_layers = 8
num_attention_heads = 8
num_key_value_heads = 2
head_dim = 64
intermediate_size = 2048  # the dense first layer
moe_intermediate_size = 256
n_routed_experts = 64
num_experts_per_tok = 6
n_shared_experts = 2
first_k_dense_replace = 1
norm_topk_prob = true
routed_scaling_factor = 2.5
attention_bias = false
use_qk_norm = false
partial_rotary_factor = 1.0
rope_parameters = { rope_type = "default", rope_theta = 500000.0, partial_rotary_factor = 1.0 }
tie_word_embeddings = false

[tokenizer]
name = "tokenizers/deepseek-v4-flash-base"  # a local copy of deepseek-ai/DeepSeek-V4-Flash-Base without config.json

[data]
type = "tokens"
seq_len = 4096
batch_tokens = 262144
micro_batch_tokens = 65536
max_epochs = 3

[data.sources]
web = { path = "data/dolma3-50b-dsv4/web" }
pdfs = { path = "data/dolma3-50b-dsv4/pdfs" }
code = { path = "data/dolma3-50b-dsv4/code" }
math = { path = "data/dolma3-50b-dsv4/math" }
reference = { path = "data/dolma3-50b-dsv4/reference" }

[[data.phases]]
weights = { web = 0.60, pdfs = 0.20, code = 0.12, math = 0.05, reference = 0.03 }

[optim]
type = "muon"
lr = 0.00390625
max_norm = 1.0

[scheduler]
type = "linear"
warmup_steps = 410
decay_steps = 3686

[val]
interval = 512

[val.sources]
web = { path = "data/dolma3-50b-dsv4/web-val" }
code = { path = "data/dolma3-50b-dsv4/code-val" }
math = { path = "data/dolma3-50b-dsv4/math-val" }

[ckpt]
interval = 1024
