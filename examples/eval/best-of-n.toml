# best-of-n - pair the reusable best-of-n env with gsm8k: 8 attempts per task,
# scored as pass@k / rejection sampling.
#
#   export PRIME_API_KEY=<your Prime Inference key>
#   uv run eval @ examples/eval/best-of-n.toml

model = "deepseek/deepseek-v4-flash"
num_examples = 5


[concurrency]
min_inflight = 8
max_inflight = 8

[[source]]
env.id = "best-of-n"
env.n = 8
env.taskset.id = "gsm8k"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
