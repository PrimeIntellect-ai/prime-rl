# Review template: endpoints, source delivery, image compatibility and placement
# must be resolved before dispatch. Values here are pilot choices, not author settings.
mode = "rl"
max_steps = 2
seq_len = 16384

[run]
name = "rime-alchemy-joint-smoke"

[model]
name = "Qwen/Qwen3-4B"

[deployment]
num_train_gpus = 2
num_infer_gpus = 1
# The frozen reference shares the two trainer GPUs; three GPUs total.
# Clef-flash exploration uses shared Prime Inference, with no dedicated judge GPU.

[trainer.optim]
lr = 1e-6

[trainer]
initial_reference = true

[trainer.model]
ep = 1

[trainer.loss]
type = "custom"
import_path = "prime_rl.trainer.rl.rime_loss.rime_loss"

[trainer.loss.kwargs]
clip_low = 0.2
clip_high = 0.28
kl_coef = 0.01

[orchestrator]
batch_size = 76 # Four complete streams, each with 10 ACT + 9 WRITE traces.
max_staleness = 1

[orchestrator.concurrency]
initial_inflight = 4
min_inflight = 4
max_inflight = 4

[orchestrator.train]
group_size = 4

[orchestrator.train.algo]
type = "rime"
horizon = 2
beta = 0.1
expected_group_size = 4

[orchestrator.train.sampling]
temperature = 1.0
top_p = 1.0
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "rime-alchemy-train"
env.id = "rime-alchemy"
env.taskset.id = "rime-alchemy"
env.taskset.split = "train"
env.memory_chars = 4096
env.actor.harness.id = "null"
env.actor.runtime.type = "subprocess"
env.writer.harness.id = "null"
env.writer.runtime.type = "subprocess"
env.exploration_judge.model = "cloudflare/clef-flash"
env.exploration_judge.base_url = "https://api.pinference.ai/api/v1/evaluations"

[inference]

[orchestrator.renderer]
name = "prime-qwen3"

[ckpt]
interval = 1
keep_last = 2
