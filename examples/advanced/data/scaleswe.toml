# SWE agent RL on ScaleSWE with the bash harness (bash + edit tools) in prime sandboxes,
# evaluated on SWE-bench Verified. Compose it after a model's rl.toml and hardware overlay:
#
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200_3nodes.toml @ examples/advanced/data/scaleswe.toml

[orchestrator]
batch_size = 128
# Episodes span many trainer steps.
max_staleness = 16

[orchestrator.train]
group_size = 8

[orchestrator.train.algo]
type = "grpo"

# A small pass-rate-scaled penalty on length: groups whose rollouts all pass still differ in
# reward, so they train (prefer shorter episodes) instead of being dropped for having no signal.
[orchestrator.train.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.01
num_input_tokens_weight = 0.01
num_turns_weight = 0.01

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600
group_size = 1
