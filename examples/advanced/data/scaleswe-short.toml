# scaleswe.toml with episodes capped at 20 turns: shorter rollouts, faster steps.
#
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200.toml @ examples/advanced/data/scaleswe-short.toml

[orchestrator]
batch_size = 128
# Episodes span many trainer steps.
max_staleness = 16

[orchestrator.train]
group_size = 8

[orchestrator.train.algo]
type = "grpo"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.max_turns = 20

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.max_turns = 20
env.agent.timeout.rollout = 3600
group_size = 1
