# v1 RL: GLM-4.5-Air (100B MoE) on the v1 `scaleswe` SWE taskset, rlm harness on a prime sandbox
# runtime; eval on SWE-Bench Verified. Router replay is enabled (trainer.enable_router_replay replays
# the routed-expert decisions returned by inference via enable_return_routed_experts) — GLM-4.5-Air is
# a glm4_moe model, which supports routed_experts.
#
# GRPO uses the linear length penalty with the input-token and turns coefficients set to 0.1. Each
# term is pass_rate-scaled and normalized by the group's own max before the GRPO baseline
# subtraction.
#
# 1 train + 3 infer nodes. Inference serves FP8 with online quantization. The trainer fits on one
# node via cp=4 (ulysses), full CPU optimizer offload with the stateless sign-SGD optimizer, plus
# the memory improvements from the GLM-5.1 prod run (research-prod rlm5/prod.toml): LM-head token
# chunking, activation checkpointing (freq=1) + activation offloading (max_inflight=1), and
# skip-gather / skip-optimizer checkpointing.
# Concurrency is fully default: the controller derives its start from the measured KV budget and
# adapts from there.

max_steps = 1000
seq_len = 131072

# Redirect compile/JIT caches to node-local /tmp (per user + job) to avoid
# slow/contended shared-FS caches and FS lock deadlocks.
[env_vars]
TRITON_CACHE_DIR = "/tmp/.triton-cache"

[slurm]
job_name = "glm45air-swe"
partition = "all"
# Clean up this run's orphaned prime sandboxes before launch (hardcoded label, matches the harness labels below).
pre_run_command = 'timeout 120 prime sandbox delete --label "glm45air-swe" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 3

[monitors.wandb]
project = "swe-ablations"
name = "glm45air-scaleswe"

[weight_broadcast]
type = "nccl"
timeout = 3600

[ckpt]
interval = 50
keep_last = 1

[resume]

[model]
name = "zai-org/GLM-4.5-Air"

# --- Trainer ---

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 4
cp_style = "ulysses"
optim_cpu_offload = false
full_offload = true
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.ckpt]
skip_gather_master_weights = true
skip_optimizer = true

[trainer.optim]
type = "sign_sgd"

# --- Orchestrator ---

[orchestrator]
batch_size = 256
group_size = 16
max_off_policy_steps = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "scaleswe"

[orchestrator.train.source.env.taskset]
id = "scaleswe"

[orchestrator.train.source.env.agent.harness]
id = "rlm"
summarize_at_tokens = [65536, 131072]

[orchestrator.train.source.env.agent.runtime]
labels = ["glm45air-swe"]

[monitors.prime]

# --- Eval: SWE-Bench Verified at step 0 + every 20 steps, rlm harness on prime ---

[orchestrator.eval]
interval = 20

[[orchestrator.eval.source]]
name = "swebench-verified"

[orchestrator.eval.source.env.taskset]
id = "swebench-verified"

[orchestrator.eval.source.env.agent.harness]
id = "rlm"
summarize_at_tokens = 98304

[orchestrator.eval.source.env.agent.runtime]
labels = ["glm45air-swe"]

[orchestrator.eval.source.env.agent.timeout]
rollout = 3600

# --- Inference ---

[inference]
use_deep_gemm = true

# vLLM + FlashInfer caches on node-local /tmp (see [env_vars]).
[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/.vllm-cache"
VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER = "0"
FLASHINFER_WORKSPACE_BASE = "/tmp/.flashinfer-cache"

[inference.vllm]
max_model_len = 131072
tensor_parallel_size = 8
quantization = "fp8_per_block"
enable_return_routed_experts = true
