# v1 RL: GLM-4.5-Air (100B MoE) on the v1 `scaleswe` SWE taskset, bash harness on a prime sandbox
# runtime; eval on SWE-Bench Verified. Follows the research-prod air ablation base config
# (research-prod PR #198): 2 trainer nodes with the Muon optimizer (instead of the single-node
# sign-SGD setup), 4 one-node inference replicas serving the bf16 checkpoint with TP=8 + expert
# parallelism, batch size 256 / group size 16, and the linear length penalty with the input-token
# and turns coefficients set to 0.1. Router replay stays enabled (trainer.enable_router_replay replays the routed-expert
# decisions returned by inference via enable_return_routed_experts) — GLM-4.5-Air is a glm4_moe
# model, which supports routed_experts. Optimizer state is checkpointed so runs can resume.
#
# GRPO uses the linear length penalty. Each term is pass_rate-scaled and normalized by the
# group's own max before the GRPO baseline subtraction.
#
# Two trainer nodes fit GLM-4.5-Air with Muon plus the memory improvements from the GLM-5.1 prod
# run (research-prod rlm5/prod.toml): activation checkpointing (freq=1) + activation offloading
# (max_inflight=1). LM-head token chunking (8192) and optimizer CPU offload run at their defaults.
# Concurrency is fully default: the controller derives its start from the measured KV budget and
# adapts from there.

max_steps = 1000
seq_len = 131072

# Redirect compile/JIT caches to node-local /tmp (per user + job) to avoid
# slow/contended shared-FS caches and FS lock deadlocks.
[env_vars]
TRITON_CACHE_DIR = "/tmp/.triton-cache"

[slurm]
job_name = "glm45air-swe"
partition = "all"
# Clean up this run's orphaned prime sandboxes before launch (hardcoded label, matches the harness labels below).
pre_run_command = 'timeout 120 prime sandbox delete --label "glm45air-swe" -y || true'

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 1
num_infer_replicas = 4

[monitors.wandb]
project = "swe-ablations"
name = "glm45air-scaleswe"

[weight_broadcast]
type = "nccl"
timeout = 3600

[ckpt]
interval = 50
keep_last = 1

[resume]

# --- Trainer ---

[trainer]
dist_timeout_seconds = 3600
enable_router_replay = true

[model]
name = "zai-org/GLM-4.5-Air"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
cp = 4
cp_style = "ulysses"

[trainer.model.ac]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.compile]

[trainer.optim]
type = "muon"

# --- Orchestrator ---

[orchestrator]
batch_size = 256
group_size = 16
max_off_policy_steps = 32

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[inference.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["glm45air-swe"]

# --- Eval: SWE-Bench Verified at step 0 + every 20 steps, bash harness on prime ---

[orchestrator.eval]
interval = 20

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["glm45air-swe"]
env.agent.timeout.rollout = 3600

# --- Inference ---

[inference]

# vLLM + FlashInfer caches on node-local /tmp (see [env_vars]).
[inference.env_vars]
VLLM_CACHE_ROOT = "/tmp/.vllm-cache"
FLASHINFER_WORKSPACE_BASE = "/tmp/.flashinfer-cache"

[inference.vllm]
gpu_memory_utilization = 0.85
max_model_len = 131072
tensor_parallel_size = 8
enable_expert_parallel = true
enable_return_routed_experts = true
