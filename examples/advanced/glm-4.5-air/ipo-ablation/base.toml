# IPO vs IcePop ablation on GLM-4.5-Air agentic SWE RL (see docs/ipo.md). Shared base: compose with one
# loss overlay from this folder, e.g.
#
#   uv run rl @ examples/advanced/glm-4.5-air/ipo-ablation/base.toml @ examples/advanced/glm-4.5-air/ipo-ablation/icepop.toml
#
# The arms differ only in [trainer.loss]. Same recipe as ../swe.toml with three changes that make the
# trainer-inference mismatch harder to handle: router replay off, up to 64 steps off-policy, and an
# output-token term in the length penalty. 2 trainer nodes (Muon, CP 4 ulysses) and 4 single-node
# TP=8 BF16 inference replicas, batch 256 x group 16 at 131k context.

max_steps = 1000
seq_len = 131072

[slurm]
partition = "all"

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 1
num_infer_replicas = 4

[monitors.wandb]
project = "ipo-ablation"

[ckpt]
interval = 50
keep_last = 1

[resume]

# --- Trainer ---

[trainer]
enable_router_replay = false

[model]
name = "zai-org/GLM-4.5-Air"

[trainer.model]
attn = "flash_attention_3"
cp = 4
cp_style = "ulysses"

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.optim]
type = "muon"

# --- Orchestrator ---

[orchestrator]
batch_size = 256
max_off_policy_steps = 64

[orchestrator.train]
group_size = 16

[orchestrator.train.algo]
type = "grpo"

[orchestrator.train.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.1
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "glm-4.5"
thinking_retention = "all"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"

[orchestrator.eval]
interval = 20

[[orchestrator.eval.source]]
name = "swebench-verified"
group_size = 1
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600

# --- Inference ---

[inference]

[inference.vllm]
gpu_memory_utilization = 0.85
max_model_len = 131072
tensor_parallel_size = 8
enable_expert_parallel = true
