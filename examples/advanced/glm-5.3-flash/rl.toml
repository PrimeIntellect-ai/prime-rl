# GLM-5.3 Flash (288-expert MoE, hybrid linear attention + DSA) RL at 256k context.
# Model settings only: compose it with a hardware overlay from `gpu/` and a data config from
# `examples/advanced/data/`:
#
#   uv run rl @ examples/advanced/glm-5.3-flash/rl.toml @ examples/advanced/glm-5.3-flash/gpu/h200.toml @ examples/advanced/data/scaleswe.toml
#   uv run rl @ examples/advanced/glm-5.3-flash/rl.toml @ examples/advanced/glm-5.3-flash/gpu/h200.toml @ examples/advanced/data/scaleswe-short.toml
#   uv run rl @ examples/advanced/glm-5.3-flash/rl.toml @ examples/advanced/glm-5.3-flash/gpu/h200.toml @ examples/advanced/data/math.toml

seq_len = 262144

[slurm]

[model]
name = "zai-org/GLM-5.3-Flash-BF16"

[weight_broadcast]
type = "nccl"
timeout = 12000

[trainer.optim]
type = "muon"
lr = 1e-6

[inference.vllm]
max_model_len = 262144
tool_call_parser = "glm47"
reasoning_parser = "glm45"
# vLLM's KDA decode kernel puts num_seqs * 64 on a grid axis capped at 65535.
max_num_seqs = 512
