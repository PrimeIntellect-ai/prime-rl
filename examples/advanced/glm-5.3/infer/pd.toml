use_deep_gemm = true

[deployment]
type = "disaggregated"
prefill_nodes_per_replica = 4
decode_nodes_per_replica = 2
gpus_per_node = 8

[deployment.prefill_env_vars]
# vLLM >= 0.29 auto-enables breakable CUDA graphs for GLM-5 (GlmMoeDsaForCausalLM); capturing
# the DeepEP high-throughput prefill dispatch then fails ("DeepEP error: timeout (dispatch CPU)").
"VLLM_USE_BREAKABLE_CUDAGRAPH" = "0"

[slurm]
job_name = "glm5"
partition = "cluster"

[vllm]
model = "zai-org/GLM-5-FP8"
tool_call_parser = "auto"
reasoning_parser = "glm45"
gpu_memory_utilization = 0.85
enable_expert_parallel = true
enable_eplb = false
