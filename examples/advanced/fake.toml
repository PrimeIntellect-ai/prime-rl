# Trainer-only fit test: no inference or orchestrator, fake data, random weights. MoE models add
# `--trainer.model.debug.force-balanced-routing`, since untrained routing is badly unbalanced.
# Every micro batch is one full-length sample, the worst case a real run can send. Read tok/s and
# `perf/peak_allocated_memory` of steps 2 and 3 (step 1 includes torch.compile).
#
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200_3nodes.toml @ examples/advanced/fake.toml --trainer.model.debug.force-balanced-routing

max_steps = 3
# Drop the inference server of the model config.
inference = "None"

# Required by the RL config; not started without inference.
[orchestrator]

[deployment]
num_infer_nodes = 0

# Fit runs are throwaway: do not register a Prime run.
[trainer.monitors]
prime = "None"

[orchestrator.monitors]
prime = "None"

[trainer.model.init]
type = "scratch"

[trainer.data.fake]
batch_size = 8
generate_samples = true
doc_len = 262144
