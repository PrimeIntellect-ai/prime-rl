# H200 overlay for rl.toml: 2 trainer nodes and 4 one-node DEP8 inference replicas.
# ScaleSWE RL: steady steps of 5-6.5 min, mismatch KL 0.0005, 105.5 GiB peak allocated.
# Trainer fit on fake 256k samples: 2 nodes, ep 8, cp 8: 29.5k tok/s (1,842 per GPU).
#
#   uv run rl @ examples/advanced/nemotron-3-super/rl.toml @ examples/advanced/nemotron-3-super/gpu/h200_2nodes.toml @ examples/advanced/fake.toml --trainer.model.debug.force-balanced-routing --trainer.data.fake.batch-size 2

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 1
# Its hybrid Mamba layers decode ~3.5k tok/s per node: with 2 replicas the trainer waited ~85% of
# a 40 min step; with 4, steps take 5-6.5 min.
num_infer_replicas = 4

[trainer.model]
cp = 8
ep = 8
# Activation offloading cost 8% throughput without lowering the allocated peak (93 GiB fake, 105 GiB real).
ac_offloading = "None"

# One DEP8 replica per node: attention data parallel, experts sharded 8 ways.
[inference.vllm]
tensor_parallel_size = 1
data_parallel_size = 8
