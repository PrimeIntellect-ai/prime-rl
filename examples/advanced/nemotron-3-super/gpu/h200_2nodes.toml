# H200 overlay for rl.toml: 2 trainer nodes and 2 one-node inference
# replicas (inference not fitted yet). Trainer fit on fake 256k samples:
# 2 nodes, ep 8, cp 8: 29.5k tok/s (1,842 per GPU), 106.3 GiB peak reserved.
#
#   uv run rl @ examples/advanced/nemotron-3-super/rl.toml @ examples/advanced/nemotron-3-super/gpu/h200_2nodes.toml @ examples/advanced/fake.toml --trainer.model.debug.force-balanced-routing

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 2

[trainer.model]
cp = 8
ep = 8

[inference.vllm]
tensor_parallel_size = 8
