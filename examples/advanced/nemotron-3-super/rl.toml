# Nemotron 3 Super 120B-A12B (hybrid Mamba + 512-expert MoE) RL at 256k context.
# Model settings only: compose it with a hardware overlay from `gpu/` and a data config from
# `examples/advanced/data/`:
#
#   uv run rl @ examples/advanced/nemotron-3-super/rl.toml @ examples/advanced/nemotron-3-super/gpu/h200.toml @ examples/advanced/data/swe.toml
#   uv run rl @ examples/advanced/nemotron-3-super/rl.toml @ examples/advanced/nemotron-3-super/gpu/h200.toml @ examples/advanced/data/swe-short.toml
#   uv run rl @ examples/advanced/nemotron-3-super/rl.toml @ examples/advanced/nemotron-3-super/gpu/h200.toml @ examples/advanced/data/math.toml

seq_len = 262144

[slurm]

[model]
name = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"

[weight_broadcast]
type = "nccl"

[trainer]
enable_router_replay = true

[trainer.optim]
type = "muon"
lr = 1e-6

[inference.vllm]
max_model_len = 262144
enable_expert_parallel = true
# vLLM disables prefix caching by default for hybrid-Mamba models; agentic turns share long prefixes.
enable_prefix_caching = true
