seq_len = 131072

[log]
level = "debug"

[model]
name = "PrimeIntellect/INTELLECT-3-Base"

[weight_broadcast]
type = "nccl"

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 12

[slurm]
job_name = "swe-qwen30b"

[ckpt]
interval = 100

[monitors.wandb]
project = "intellect-3.1"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
cp = 2
fused_lm_head_token_chunk_size = 1024

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "muon"
lr = 1e-6
weight_decay = 0.01

[orchestrator]
batch_size = 2048

[orchestrator.concurrency]
initial_inflight = 4096
max_inflight = 4096

[[orchestrator.train.source]]
name = "swe"
ratio = 0.3
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "r2e-gym"
env.agent.harness.id = "bash"
env.agent.harness.compaction.summarize_at_tokens = "None"  # compact at the auto threshold
env.agent.runtime.labels = ["intellect-3.1", "swe"]

[[orchestrator.train.source]]
name = "deepdive"
ratio = 0.2
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "deepdive"
env.agent.harness.id = "rlm"
env.agent.harness.skills = ["search"]
env.agent.harness.forward_env = ["SERPER_API_KEY"]
env.agent.runtime.labels = ["intellect-3.1", "deepdive"]

[[orchestrator.train.source]]
name = "math"
ratio = 0.3
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "logic"
ratio = 0.2
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "i3_logic"
env.taskset.filter.max = 0.874
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "code"
ratio = 0.2
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "i3_code"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swe-bench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.harness.compaction.summarize_at_tokens = "None"  # compact at the auto threshold
env.agent.runtime.labels = ["intellect-3.1", "swe-bench-verified"]

[[orchestrator.eval.source]]
name = "aime2025"
env.taskset.id = "aime25"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference.vllm]
tensor_parallel_size = 8
[orchestrator.renderer]
name = "default"
