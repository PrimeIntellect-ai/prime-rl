seq_len = 131072

[log]
level = "debug"

[model]
name = "PrimeIntellect/INTELLECT-3-Base"

[weight_broadcast]
type = "nccl"

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 12

[slurm]
job_name = "swe-qwen30b"

[ckpt]
interval = 100

[wandb]
project = "intellect-3.1"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
cp = 2
fused_lm_head_token_chunk_size = 1024

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "muon"
lr = 1e-6
weight_decay = 0.01

[orchestrator]
batch_size = 2048
oversampling_factor = 2

[[orchestrator.train.source]]
name = "swe"
ratio = 0.3

[orchestrator.train.source.env.taskset]
id = "r2e-gym-v1"

[orchestrator.train.source.env.agent.harness]
id = "bash"

[orchestrator.train.source.env.agent.runtime]
type = "prime"
labels = ["intellect-3.1", "swe"]

[[orchestrator.train.source]]
name = "deepdive"
ratio = 0.2

[orchestrator.train.source.env.taskset]
id = "deepdive-v1"

[orchestrator.train.source.env.agent.harness]
id = "rlm"
skills = ["search"]
forward_env = ["SERPER_API_KEY"]

[orchestrator.train.source.env.agent.runtime]
type = "prime"
labels = ["intellect-3.1", "deepdive"]

[[orchestrator.train.source]]
name = "math"
ratio = 0.3

[orchestrator.train.source.env.taskset]
id = "i3_math_v1"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[[orchestrator.train.source]]
name = "logic"
ratio = 0.2

[orchestrator.train.source.env.taskset]
id = "i3_logic_v1"

[orchestrator.train.source.env.taskset.filter]
max = 0.874

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[[orchestrator.train.source]]
name = "code"
ratio = 0.2

[orchestrator.train.source.env.taskset]
id = "i3_code_v1"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = true

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swe-bench-verified"

[orchestrator.eval.source.env.taskset]
id = "swebench-verified-v1"

[orchestrator.eval.source.env.agent.harness]
id = "bash"

[orchestrator.eval.source.env.agent.runtime]
type = "prime"
labels = ["intellect-3.1", "swe-bench-verified"]

[[orchestrator.eval.source]]
name = "aime2025"

[orchestrator.eval.source.env.taskset]
id = "aime25-v1"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[inference.vllm]
tensor_parallel_size = 8
[orchestrator.renderer]
name = "default"
