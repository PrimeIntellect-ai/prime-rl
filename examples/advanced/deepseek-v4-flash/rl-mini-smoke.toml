# Local reverse-text RL smoke test on the mini deepseek_v4 preset -- proves the rollout +
# training loop runs end to end on this port's current (naive/eager) attention. Not a
# performance or convergence test: the mini checkpoint is freshly initialized, so completions
# are incoherent and rewards stay near zero by construction. Generate the checkpoint first:
#
#   uv run python scripts/mini_moe.py --arch deepseek_v4 --output-dir /tmp/deepseek-v4-mini
#
# Then, on a single node with at least 4 GPUs. The CUDA_HOME/PATH override is required: the
# system default nvcc is 11.5 and the TileLang kernel JIT needs 12.3 or newer.
#
#   CUDA_HOME=/usr/local/cuda-12.9 PATH=/usr/local/cuda-12.9/bin:$PATH \
#     uv run rl @ examples/advanced/deepseek-v4-flash/rl-mini-smoke.toml

max_steps = 20

[model]
name = "/tmp/deepseek-v4-mini"

[weight_broadcast]
# Matches rl.toml: NCCL/NIXL need convert_layer_to_vllm_kernel, which this port does not
# implement. Filesystem broadcast uses convert_to_hf, which is implemented and tested. The
# nccl default also breaks outright here with data_parallel_size > 1, since only DP rank 0
# gets a broadcast receiver.
type = "filesystem"

[trainer.model]
impl = "custom"

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 8
group_size = 4

[orchestrator.train.sampling]
max_completion_tokens = 32

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.renderer]
name = "default"

[inference]
# Mandatory for DeepSeek V4, not an optimization. Without it VLLM_USE_DEEP_GEMM=0, and
# vLLM's mHC pre-norm GEMM then takes a TileLang kernel that is numerically wrong above
# 1024 tokens per forward pass on SM120, silently. See DeepGEMM notes in TODO.md.
use_deep_gemm = true

[inference.vllm]
# Attention on this hardware only supports an fp8 KV cache, not the `auto` default.
kv_cache_dtype = "fp8"
enforce_eager = true
max_model_len = 4096

[deployment]
num_train_gpus = 2
num_infer_gpus = 2
