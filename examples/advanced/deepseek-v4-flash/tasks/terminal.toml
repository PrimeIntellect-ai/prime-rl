# Terminal task source for rl.toml: train on `terminal-lego` (terminal tasks) and `swelego` (SWE),
# eval on OpenThoughts-TBLite.
#
#   uv run rl @ examples/advanced/deepseek-v4-flash/rl.toml @ examples/advanced/deepseek-v4-flash/tasks/terminal.toml @ examples/advanced/deepseek-v4-flash/gpu/h200.toml

[monitors.wandb]
name = "terminal-lego-swelego"

# Pass-rate-scaled, so groups that all solve still train: shorter solutions win.
[orchestrator.train.algo.length_penalty]
type = "linear"

[[orchestrator.train.source]]
name = "terminal-lego"
env.taskset.id = "terminal-lego"
env.agent.harness.id = "bash"

[[orchestrator.train.source]]
name = "swelego"
env.taskset.id = "swelego"
env.agent.harness.id = "bash"

[orchestrator.eval]
interval = 50
group_size = 4

[[orchestrator.eval.source]]
name = "openthoughts-tblite"
env.taskset.id = "openthoughts-tblite"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600
