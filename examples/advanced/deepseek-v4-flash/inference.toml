# Standalone vLLM serving pre-flight check: does this cluster's vLLM correctly serve the real
# DeepSeek V4 Flash checkpoint at all, independent of the trainer? Uses vLLM's own native
# DeepSeek V4 support (not this repo's trainer port), so it does not depend on the trainer's
# state. Run locally on one allocated 8xH200 node (no [slurm] block -- this is meant to be run
# directly, not submitted as a batch job):
#
#   uv run inference @ examples/advanced/deepseek-v4-flash/inference.toml
#
# then from another shell on the same node:
#
#   curl http://localhost:8000/health
#   curl http://localhost:8000/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model": "deepseek-ai/DeepSeek-V4-Flash-0731", "messages": [{"role": "user", "content": "Say hello in one sentence."}]}'
#
# Confirm a coherent, non-garbage response before trusting the model for the real RL run.
#
# The checkpoint ships no Jinja chat template and does not need one: vLLM auto-selects
# `tokenizer_mode = "deepseek_v4"` from the architecture and renders through its own
# DeepseekV4Renderer, which wraps DeepSeek's reference encoder.
#
# `enforce_eager` is deliberately unset so this exercises the same path a real run takes. If the
# engine dies during CUDA-graph capture, re-run with `--vllm.enforce-eager` before investigating
# anything else.
#
# Reference: https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash

# Mandatory for DeepSeek V4. See TODO.md.
use_deep_gemm = true

[server]
port = 8000

[vllm]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
tensor_parallel_size = 8
enable_expert_parallel = true
gpu_memory_utilization = 0.85
max_model_len = 8192
# Required, not a tuning choice. Every DeepSeek V4 attention class sets
# `use_fp8_ds_mla_layout = True`, and the sparse-MLA layout then asserts
# "DeepseekV4 fp8_ds_mla layout only supports fp8 kv-cache" against the `auto` default. The vLLM
# recipe sets it on every vendor and every architecture.
kv_cache_dtype = "fp8"
# Recipe-derived rather than measured here: every NVIDIA configuration in the vLLM recipe pairs
# the fp8 KV cache with this block size.
block_size = 256
