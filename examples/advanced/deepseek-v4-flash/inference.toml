# Standalone vLLM serving pre-flight: does this cluster's vLLM serve the real DeepSeek V4 Flash
# checkpoint at all, independent of the trainer? Uses vLLM's own native DeepSeek V4 support, not
# this repo's trainer port. Run directly on one allocated 8xH200 node (no [slurm] block):
#
#   uv run inference @ examples/advanced/deepseek-v4-flash/inference.toml
#
# Then check /health and a /v1/chat/completions request from another shell on the same node, and
# confirm a coherent response before trusting the model for a real run.
#
# Reference: https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash

# Mandatory for DeepSeek V4, not an optimization: without it the mHC pre-norm GEMM falls back to a
# TileLang kernel that is silently wrong above 1024 tokens per forward on SM120, and the
# checkpoint's UE8M0-scaled fp8 weights route to a CUTLASS kernel that crashes on boot.
use_deep_gemm = true

[server]
port = 8000

[vllm]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
tensor_parallel_size = 8
enable_expert_parallel = true
gpu_memory_utilization = 0.85
max_model_len = 8192
# Required, not a tuning choice. Every DeepSeek V4 attention class sets
# `use_fp8_ds_mla_layout = True`, and the sparse-MLA layout then asserts
# "DeepseekV4 fp8_ds_mla layout only supports fp8 kv-cache" against the `auto` default. The vLLM
# recipe sets it on every vendor and every architecture.
kv_cache_dtype = "fp8"
# Recipe-derived rather than measured here: every NVIDIA configuration in the vLLM recipe pairs
# the fp8 KV cache with this block size.
block_size = 256
