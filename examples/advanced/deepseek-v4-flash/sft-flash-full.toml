# Full-checkpoint, full-depth SFT validation run for deepseek-ai/DeepSeek-V4-Flash-0731 across 4
# nodes (32xH200). This is the run `sft-flash-smoke.toml` structurally cannot do: all 43 layers,
# no `debug.num_layers` truncation, and 1000 steps rather than a 20-step smoke. Pure trainer
# forward+backward, no inference, so all 32 GPUs train.
#
#   uv run sft @ examples/advanced/deepseek-v4-flash/sft-flash-full.toml --dist-timeout-seconds 14400
#
# Why 4 nodes, and why this config is *simpler* than the single-node one: with
# `optimization_dtype = "float32"` the fp32 parameter shard is 284.6e9 * 4 bytes / num_gpus. At 8
# GPUs that is 132.5 GiB/GPU, which OOMs (measured, see sft-flash-smoke.toml). At 32 GPUs it is
# 33.1 GiB/GPU, which leaves room for gradients and activations. So this config needs neither
# `full_offload` nor the stateless `sign_sgd` that the single-node config had to fall back on: it
# runs the ordinary FSDP + EP path with the default AdamW and the default `optim_cpu_offload =
# true`, which keeps momentum/variance on CPU (~71 GB/rank against the node's 1682 GB).
# `examples/advanced/deepseek-v4-flash/rl.toml` specs the same `num_train_nodes = 4` for this
# checkpoint.
#
# `--dist-timeout-seconds 14400` is required because this run has to build the HF -> prime-rl
# conversion cache itself. A cache built by a `debug.num_layers` run is unusable at full depth:
# the key renaming only covers `config.num_hidden_layers` layers, so an 8-layer run leaves layers
# 8 through 42 under their on-disk DeepSeek names and `dcp_load` fails with
# `Missing key in checkpoint state_dict: model.layers.10.attn_hc.base.` See sft-flash-smoke.toml.
# Rank 0 rebuilds it here at full depth, roughly 30 minutes with the other 31 GPUs idle, and the
# result is reusable by any later full-depth run.
#
# Budget several hours of wall clock. The single-node 8-layer run held 9.4s/step; 43 layers over
# 4x the GPUs lands in the same order of magnitude per step, but with inter-node all-gathers now
# on the critical path, so 1000 steps is plausibly 4 to 8 hours. The partition has no time limit.
#
# `data.batch_size` is global and must divide `world_size * micro_batch_size`, so 32 here is
# required rather than cosmetic: the smoke config's 8 would assert-fail on 32 ranks.

max_steps = 1000

[model]
name = "deepseek-ai/DeepSeek-V4-Flash-0731"
impl = "custom"
ep = 8

[model.debug]
force_balanced_routing = true

[data]
type = "fake"
seq_len = 2048
batch_size = 32

[optim]
lr = 3e-6

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 0

[slurm]
job_name = "ds-v4-sft-full"
partition = "all"
