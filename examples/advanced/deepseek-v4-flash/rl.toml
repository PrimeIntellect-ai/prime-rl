# Real DeepSeek V4 Flash RL validation: reverse-text, 4 train + 8 infer nodes (8xH200 each).
# See RUNS.md at the repo root for the sizing rationale and open questions behind these numbers.
seq_len = 2048

[model]
name = "deepseek-ai/DeepSeek-V4-Flash-0731"

[weight_broadcast]
# NCCL/NIXL broadcast need convert_layer_to_vllm_kernel, which this port does not implement yet
# (see TODO.md). Filesystem broadcast uses convert_to_hf instead, which is implemented and tested.
type = "filesystem"

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 8

[slurm]
job_name = "deepseek-v4-flash-rl"
partition = "" # FILL IN

[ckpt]

[monitors.wandb]
project = "deepseek-v4-flash"
name = "deepseek-v4-flash-reverse-text"

[trainer.model]
impl = "custom"
# attn is a no-op for this model today: DeepSeek V4's attention is eager-only in this port
# (see TODO.md), so flash_attention_* settings would not change anything. cp is left at its
# default (1, disabled): our short seq_len (2048) doesn't need it for memory, and CP has not
# been verified against this model's eager-only attention.
ep = 8

[trainer.model.compile]

[trainer.model.ac]
freq = 1

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 128
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference.vllm]
tensor_parallel_size = 8
# One full-TP replica per inference node (8 nodes x TP=8 = 64 GPUs total), required by the
# multi-node expert-parallel inference validator when enable_expert_parallel is set.
data_parallel_size = 8
enable_expert_parallel = true

[orchestrator.renderer]
name = "default"
