# DeepSeek-V4-Flash agentic RL on `terminal-lego` (terminal tasks) and `swelego` (SWE) at 131k
# context, bash harness on a prime sandbox runtime; eval on OpenThoughts-TBLite. Hardware-agnostic
# base: compose it with a hardware overlay that sets the topology and the precision, e.g.
#
#   uv run rl @ examples/advanced/deepseek-v4-flash/rl.toml @ examples/advanced/deepseek-v4-flash/gpu/h200.toml

max_steps = 1000
seq_len = 131072
output_dir = "/shared/outputs" # FILL IN: point at your shared filesystem

[slurm]
job_name = "dsv4f-rl"
partition = "all" # FILL IN: set to your cluster's partition

[model]
# bf16 re-export of deepseek-ai/DeepSeek-V4-Flash-0731. The trainer needs bf16 weights, and the
# inference overlays quantize them online, so both sides start from the same checkpoint.
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"

[monitors.wandb]
project = "deepseek-v4-flash"
name = "terminal-lego-swelego"

[weight_broadcast]
type = "nccl"

[ckpt]
interval = 50
keep_last = 1

# --- Trainer ---

[trainer.optim]
type = "muon"

[trainer.loss]
type = "icepop"
score_centering = true

# --- Orchestrator ---

[orchestrator]
batch_size = 256
# Episodes span many trainer steps at high concurrency.
max_staleness = 32

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
top_p = 0.97

# Pass-rate-scaled, so groups that all solve still train: shorter solutions win.
[orchestrator.train.algo.length_penalty]
type = "linear"

[orchestrator.renderer]
# The bf16 re-export is not in the renderer map, so name the renderer explicitly.
name = "deepseek-v4"
enable_thinking = true
# With tools present the encoder keeps all reasoning anyway; these make the settings agree.
drop_thinking = false
thinking_retention = "all"

[[orchestrator.train.source]]
name = "terminal-lego"
env.taskset.id = "terminal-lego"
env.agent.harness.id = "bash"

[[orchestrator.train.source]]
name = "swelego"
env.taskset.id = "swelego"
env.agent.harness.id = "bash"

[orchestrator.eval]
interval = 50
group_size = 4

[[orchestrator.eval.source]]
name = "openthoughts-tblite"
env.taskset.id = "openthoughts-tblite"
env.agent.harness.id = "bash"
env.agent.timeout.rollout = 3600

# --- Inference: one DEP8 replica per node (attention data parallel, experts sharded 8 ways) ---

[inference.vllm]
tensor_parallel_size = 1
data_parallel_size = 8
enable_expert_parallel = true
max_model_len = 131072
# Required: DeepSeek V4 attention uses the fp8_ds_mla KV layout, which asserts against `auto`.
kv_cache_dtype = "fp8"
block_size = 256
# Auto-detection only matches the `deepseek-ai/DeepSeek-V4` repo ids, not the bf16 re-export.
tool_call_parser = "deepseek_v4"
reasoning_parser = "deepseek_v4"
