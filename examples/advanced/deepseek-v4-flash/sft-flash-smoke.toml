# Real-checkpoint SFT smoke test against deepseek-ai/DeepSeek-V4-Flash-0731 itself (not the mini
# preset). Pure trainer forward+backward check -- no inference needed, so all GPUs go to
# training. See TODO.md's DeepSeek V4 section for the full writeup; summary here:
#
# The full 43-layer model (~284.6B params) does NOT fit for training on a single 8xH200 node,
# confirmed by direct CUDA OOM under both CPU-offload strategies this repo supports -- there is
# no single-node config that makes the *full* model train here, this is a real hardware ceiling,
# not a bug. `examples/advanced/deepseek-v4-flash/rl.toml` already specs `num_train_nodes = 4`
# (32 GPUs) for this exact checkpoint, so this isn't a surprise once you look for it. What DOES
# work on one node, and is what this config actually runs:
#
#   uv run sft @ examples/advanced/deepseek-v4-flash/sft-flash-smoke.toml \
#     --model.debug.num-layers 4 --dist-timeout-seconds 14400
#
# `--dist-timeout-seconds 14400` matters on the *first* run only, regardless of
# `debug.num_layers`. `load_dcp_from_hf` does a one-time HF -> prime-rl format conversion of the
# checkpoint's *entire* on-disk state dict on a single rank before any GPU work happens -- for
# this ~156GB (fp8/MXFP4) checkpoint that dequantizes to ~530GB and took about 90 minutes here,
# blowing past the 3600s default. The converted state dict is cached next to the snapshot
# (`<snapshot>/prime/`), so every subsequent run (any `debug.num_layers` value) skips straight to
# the fast, truly-selective `dcp_load` step and the default timeout is fine again.
#
# Why the full model doesn't fit, precisely (8xH200, ep=8, no further sharding axis available):
# - Plain FSDP+EP (`optimization_dtype = "float32"`, this repo's other protected default) keeps
#   the entire fp32 parameter shard resident on GPU: 284.6e9 params * 4 bytes / 8 GPUs =~ 132.5
#   GiB/GPU, confirmed via a direct OOM at ~135 GiB allocated (out of 143.8 GiB) -- no room even
#   for the first layer's activations.
# - `optim_cpu_offload = false` + `full_offload = true` + `optim.type = "sign_sgd"` move the fp32
#   masters/gradients/optimizer step to CPU RAM (confirmed: "132.40 GiB of pageable FP32
#   masters" logged per rank, matching the math above), but GPU memory stays just as tight: the
#   persistent bf16 param shard (~66 GiB) plus the bf16 gradient buffer FSDP2 must hold before
#   handing it to the CPU optimizer (~66 GiB) sum back to ~132 GiB, so this doesn't reduce peak
#   GPU memory here -- confirmed via a second OOM (3 GiB allocation failure, ~132 GiB already
#   allocated). SignSGD is used because it's stateless (no momentum/variance to store) and is
#   the lowest-memory optimizer full offload supports; it did not change the outcome.
# `debug.num_layers=4` was verified clean: real dequantized weights, ep=8, the legacy
# compress_ratios fix, all correct -- finite loss, `nan_count=0`, peak memory 31/139.8 GiB
# (huge headroom). This is the actual "does everything else work" signal at single-node scale.

max_steps = 20

[model]
name = "deepseek-ai/DeepSeek-V4-Flash-0731"
impl = "custom"
ep = 8
optim_cpu_offload = false
full_offload = true

[model.debug]
force_balanced_routing = true

[data]
type = "fake"
seq_len = 2048
batch_size = 8

[optim]
type = "sign_sgd"
lr = 3e-6

[deployment]
num_train_gpus = 8
num_infer_gpus = 0
