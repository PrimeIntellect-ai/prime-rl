# NVFP4 arm (Blackwell), over base.toml: MXFP8 dense linears, and routed experts in NVFP4 with 4/6 block scaling on the
# engines (vLLM's online nvfp4_per_token) and in the trainer's forward, matched to the engines; the trainer's expert
# backward stays MXFP8. Engines use an fp8 KV cache and FlashInfer's TRT-LLM MoE.
#
#   uv run rl @ examples/advanced/qwen3.6-35b-a3b/rlm-ablation/base.toml @ examples/advanced/qwen3.6-35b-a3b/rlm-ablation/nvfp4.toml

[slurm]
job_name = "qwen3.6-rlm-ablation-nvfp4"

# The vision tower has no MXFP8 shapes; text-only RL never runs it.
[trainer.model.quantization]
type = "mxfp8"
extra_ignore_patterns = ['visual\.']

[trainer.model.moe.compute]
type = "nvfp4"
four_over_six = true

[inference.vllm]
quantization = "online"
quantization_config = { linear = "mxfp8", moe = "nvfp4_per_token", ignore = ["*visual*"] }
kv_cache_dtype = "fp8"
all2all_backend = "flashinfer_nvlink_one_sided"
moe_backend = "flashinfer_trtllm"
