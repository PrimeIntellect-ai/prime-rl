# NVFP4 arm (Blackwell), over mxfp8.toml: routed experts in NVFP4 with 4/6 block scaling on the engines (vLLM's online
# nvfp4_per_token) and in the trainer's forward, matched to the engines; the trainer's expert backward stays MXFP8.
#
#   uv run rl @ examples/advanced/qwen3.6-35b-a3b/rlm-ablation/base.toml @ examples/advanced/qwen3.6-35b-a3b/rlm-ablation/mxfp8.toml @ examples/advanced/qwen3.6-35b-a3b/rlm-ablation/nvfp4.toml

[slurm]
job_name = "qwen3.6-rlm-ablation-nvfp4"

[trainer.model.moe.compute]
type = "nvfp4"
four_over_six = true

[inference.vllm]
quantization = "online"
quantization_config = { linear = "mxfp8", moe = "nvfp4_per_token", ignore = ["*visual*"] }
