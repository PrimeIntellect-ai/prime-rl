seq_len = 32768

[log]
level = "debug"

[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 2

[slurm]
job_name = "math-qwen30b"
partition = "all"

[ckpt]
interval = 100

[monitors.wandb]
project = "qwen30b-math"

[trainer.model]
attn = "flash_attention_3"
ep = 8

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 512
max_off_policy_steps = 8

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 1024

[orchestrator.train.sampling]
max_completion_tokens = 32768

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "aime2025"
env.taskset.id = "aime25"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference.vllm]
tensor_parallel_size = 8
