clean = true

[env_vars]
HF_HOME = "/home/huggingface"
TRITON_CACHE_DIR = "/tmp/.cache/triton_cache"

[model]
# A bf16 PrimeRL-format copy of deepseek-ai/DeepSeek-V4.1-Flash written by
# tools/convert_deepseek_v41_to_prime.py (see the README).
name = "/home/huggingface/prime/DeepSeek-V4.1-Flash-bf16"
cp = 8
ep = 8
optim_cpu_offload = true

[model.ac]
freq = 1

[model.ac_offloading]
max_inflight_activations = 5

[optim]
type = "sign_sgd"
lr = 5e-5
weight_decay = 0.01

[scheduler]
type = "linear"
warmup_steps = 50
decay_steps = 0

[renderer]
name = "custom"
import_path = "examples/advanced/deepseek-v4.1-flash/renderer.py:DeepSeekV41Renderer"

[deployment]
type = "multi_node"
num_train_nodes = 8

[slurm]
job_name = "dsv41-sft"
partition = "all"
