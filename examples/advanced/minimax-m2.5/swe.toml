seq_len = 131072

[log]
level = "debug"

[model]
name = "PrimeIntellect/MiniMax-M2.5-bf16"

[weight_broadcast]
type = "nccl"

[deployment]
type = "multi_node"
num_train_nodes = 4
num_infer_nodes = 12

[slurm]
job_name = "swe-minimax"

[ckpt]
interval = 100

[wandb]
project = "minimax-swe"

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
cp = 4
fused_lm_head_token_chunk_size = 1024

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.01

[orchestrator]
batch_size = 2048
oversampling_factor = 2
max_off_policy_steps = 16

[[orchestrator.train.source]]
name = "swe"

[orchestrator.train.source.env.taskset]
id = "r2e-gym"

[orchestrator.train.source.env.agent.harness]
id = "bash"

[orchestrator.train.source.env.agent.runtime]
labels = ["minimax-swe", "swe"]

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swe-bench-verified"

[orchestrator.eval.source.env.taskset]
id = "swebench-verified"

[orchestrator.eval.source.env.agent.harness]
id = "bash"

[orchestrator.eval.source.env.agent.runtime]
labels = ["minimax-swe", "swe-bench-verified"]

[inference.vllm]
tensor_parallel_size = 8
[orchestrator.renderer]
name = "minimax-m2"
