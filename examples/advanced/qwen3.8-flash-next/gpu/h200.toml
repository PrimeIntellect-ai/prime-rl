# H200 overlay for rl.toml: 3 trainer nodes and 3 one-node inference
# replicas (inference not fitted yet). Trainer fit on fake 256k samples:
# 3 nodes, ep 8, cp 8: 39.1k tok/s (1,629 per GPU), 109.3 GiB peak allocated. 2 nodes OOM.
#
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200.toml @ examples/advanced/fake.toml --trainer.model.debug.force-balanced-routing

[deployment]
type = "multi_node"
num_train_nodes = 3
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 3

[trainer.model]
cp = 8
ep = 8

# One DEP8 replica per node: attention data parallel, experts sharded 8 ways.
[inference.vllm]
tensor_parallel_size = 1
data_parallel_size = 8
