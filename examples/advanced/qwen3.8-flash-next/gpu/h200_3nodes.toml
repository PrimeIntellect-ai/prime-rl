# H200 overlay for rl.toml: 3 trainer nodes and 3 one-node inference
# replicas (inference not fitted yet). Trainer fit on fake 256k samples:
# 3 nodes, ep 8, cp 8: 39.1k tok/s (1,629 per GPU), 109.3 GiB peak allocated. 2 nodes OOM.
#
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200_3nodes.toml @ examples/advanced/fake.toml --trainer.model.debug.force-balanced-routing --trainer.data.fake.batch-size 3

[deployment]
type = "multi_node"
num_train_nodes = 3
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 3

[trainer.model]
cp = 8
ep = 8
# Activation offloading cost 11% throughput without lowering the allocated peak.
ac_offloading = "None"

# TP4 x DP2 decoded ~60% faster than DEP8 per node under a synthetic agentic load (256 sessions).
[inference.vllm]
tensor_parallel_size = 4
data_parallel_size = 2
