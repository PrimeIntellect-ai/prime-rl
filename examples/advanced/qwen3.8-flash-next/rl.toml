# Qwen3.8 Flash Next (512-expert MoE, hybrid Gated DeltaNet + sparse attention) RL at 256k context.
# Model settings only: compose it with a hardware overlay from `gpu/` and a data config from
# `examples/advanced/data/`:
#
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200.toml @ examples/advanced/data/scaleswe.toml
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200.toml @ examples/advanced/data/scaleswe-short.toml
#   uv run rl @ examples/advanced/qwen3.8-flash-next/rl.toml @ examples/advanced/qwen3.8-flash-next/gpu/h200.toml @ examples/advanced/data/math.toml

seq_len = 262144

[slurm]

[model]
name = "Qwen/Qwen3.8-Flash-Next"

[weight_broadcast]
type = "nccl"

[trainer]
enable_router_replay = true

[trainer.optim]
type = "muon"
lr = 1e-6

[inference]
enable_fp32_lm_head = true
enable_fp32_router_logits = true

[inference.vllm]
max_model_len = 262144
enable_expert_parallel = true
all2all_backend = "allgather_reducescatter"
enable_prefix_caching = true
mamba_cache_dtype = "float32"
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"

[inference.vllm.engram_config]
cpu_offload = true

# Text-only RL: skip the vision encoder.
[inference.vllm.limit_mm_per_prompt]
image = 0
video = 0
