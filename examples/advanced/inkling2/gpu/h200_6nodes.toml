# H200 overlay for rl.toml: 6 trainer nodes and 6 one-node inference replicas, FP8 on the routed
# experts on both sides. Not tested in this layout: the settings come from math-rl.toml and
# swe-rl.toml in this directory, which ran 6 trainer nodes and 2 inference replicas (trainer peak
# ~93 GiB per GPU at 8k).
#
#   uv run rl @ examples/advanced/inkling2/rl.toml @ examples/advanced/inkling2/gpu/h200_6nodes.toml @ examples/advanced/fake.toml --trainer.model.debug.force-balanced-routing --trainer.data.fake.batch-size 48

[deployment]
type = "multi_node"
num_train_nodes = 6
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 6

[trainer]
dist_timeout_seconds = 1800

[trainer.model]
ep = 8
offload = "full"

# FP8 on the routed experts only, matching vLLM's online fp8_per_block; dense layers stay bf16.
[trainer.model.moe.compute]
type = "deepgemm_fp8"

[inference.vllm]
tensor_parallel_size = 8
enable_expert_parallel = true
dtype = "bfloat16"
quantization = "fp8_per_block"
gpu_memory_utilization = 0.72
# swe-rl.toml's limits for long SWE prefills. math-rl.toml runs 64 sequences with 1024-token chunks
# and async scheduling for short math prompts.
max_num_seqs = 32
max_num_batched_tokens = 2048
