# Inkling 2 Small SWE RL on H200: 6 trainer nodes (FP8 MoE experts only, dense layers stay
# bf16; sign-SGD full CPU offload) + 2 single-node vLLM replicas (bf16, online fp8_per_block MoE).
# Data: ScaleSWE (`scaleswe`) with the bash harness, 20-turn limit, low reasoning effort, 16K sequence.
# Rollouts run in Prime sandboxes, so the job needs a valid PRIME_API_KEY.
max_steps = 100
seq_len = 16384
output_dir = "<output dir>"
clean = true

[run]
name = "inkling2-swe-rl"

[log]
level = "info"

[monitors.file]

[weight_broadcast]
type = "nccl"
port = 29502
timeout = 12000

[deployment]
type = "multi_node"
num_train_nodes = 6
gpus_per_node = 8
num_infer_nodes = 1
num_infer_replicas = 2

[inference.deployment]
type = "multi_node"
num_nodes = 1

[inference]
use_deep_gemm = false
enable_fp32_lm_head = true

[inference.vllm]
model = "PrimeIntellect/Inkling-2-Small-bf16"
dtype = "bfloat16"
quantization = "fp8_per_block"
tensor_parallel_size = 8
enable_expert_parallel = true
# Server window above the trainer seq_len so the harness can compact before the cap.
max_model_len = 32768
gpu_memory_utilization = 0.72
max_num_seqs = 32
# Long SWE prefills: keep chunk 2048 and leave async scheduling off for KV headroom.
max_num_batched_tokens = 2048
block_size = 128
enable_prefix_caching = true
tool_call_parser = "inkling2"
reasoning_parser = "inkling2"
# The Inkling 2 framing tokens are special tokens; parsers need them in the text.
override_generation_config = {skip_special_tokens = false}

[model]
name = "PrimeIntellect/Inkling-2-Small-bf16"

[trainer]
dist_timeout_seconds = 1800

[ckpt]
# One checkpoint is ~3.3 TB; keep only the newest.
interval = 50
keep_last = 1

[trainer.model]
attn = "flash_attention_2"
seq_len = 16384
ep = 8
offload = "full"
# Activation offloading stays off: compiled flex attention hits the saved-tensor tracker assertion.
ac_offloading = "None"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.moe.compute]
type = "deepgemm_fp8"

[trainer.optim]
type = "sign_sgd"
lr = 1e-6
weight_decay = 0.01

[orchestrator]
pad_to_seq_len = true
batch_size = 16

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 4096

[orchestrator.train.sampling.extra_body]
# Keep the special framing tokens in the decoded text the parsers see.
skip_special_tokens = false

[orchestrator.concurrency]
initial_inflight = 32

[orchestrator.renderer]
name = "inkling-2"
reasoning_effort = "low"
# Envs that pass tools (the SWE bash harness) need a renderer-side tool parser.
tool_parser = "inkling2"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.harness.compaction.summarize_at_tokens = 12000
env.agent.max_turns = 20
env.timeout.episode = 3600
env.agent.runtime.labels = ["inkling2-swe"]

[slurm]
job_name = "inkling2-swe-rl"
partition = "<partition>"
time = "08:00:00"
