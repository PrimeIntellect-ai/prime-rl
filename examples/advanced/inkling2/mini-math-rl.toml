# Inkling 2 Mini math RL on one 8xH200 node: 4 trainer GPUs + 4 single-GPU vLLM replicas, bf16 experts
# on both sides. Mini runs layers 6-17 three times, so a token takes 48 layer visits.
# Data: i3-math, difficulty band where Qwen3-4B avg@8 solves 0.25-0.5, 8K sequence.
max_steps = 100
seq_len = 8192
output_dir = "<output dir>"
clean = true

[run]
name = "inkling2-mini-math-rl"

[log]
level = "info"

[monitors.file]

[weight_broadcast]
type = "nccl"
port = 29502

[deployment]
type = "single_node"
num_train_gpus = 4
num_infer_gpus = 4

[inference]
use_deep_gemm = false
enable_fp32_lm_head = true

[inference.vllm]
# The release converted with tools/convert_inkling2_to_bf16.py (about 53 GB).
model = "<path to the bf16 export>"
dtype = "bfloat16"
data_parallel_size = 4
max_model_len = 16384
gpu_memory_utilization = 0.85
max_num_seqs = 64
# Every scheduled token takes a short-conv state page in each of the 48 layer visits, padded to the
# attention page: a small block size and prefill chunk keep that transient small.
max_num_batched_tokens = 4096
block_size = 16
enable_prefix_caching = true

[model]
name = "<path to the bf16 export>"

[trainer]
dist_timeout_seconds = 1800
# The trainer reuses the experts vLLM routed every token to, one choice per layer visit.
enable_router_replay = true

[trainer.model]
attn = "flash_attention_2"
seq_len = 8192
ep = 4
# Activation offloading stays off: compiled flex attention hits the saved-tensor tracker assertion.
ac_offloading = "None"

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.1

[trainer.data]
pad_to_seq_len = true

[ckpt]

[orchestrator]
batch_size = 64

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 4096

[orchestrator.concurrency]
initial_inflight = 128

[orchestrator.renderer]
name = "inkling-2"
reasoning_effort = "low"

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3-math"
env.taskset.filter.column = "avg@8_qwen3_4b_instruct_2507"
env.taskset.filter.min = 0.25
env.taskset.filter.max = 0.5
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
