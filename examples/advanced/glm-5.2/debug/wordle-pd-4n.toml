# GLM-5.2 wordle RL smoke test on 8 nodes: 4 trainer + 1 disaggregated
# inference replica (2 prefill + 2 decode, NIXL KV transfer). Exercises the
# full loop — rollouts, gradient CPU offload on real data, per-step in-loop
# NCCL weight broadcast with fp8 quantization.
#
# Notes from bring-up (H200 cluster, 2 TiB hosts):
# - Gradient CPU offload is required at 4 trainer nodes; keep gradient accumulation
#   low (batch_size 32 / dp 32 -> ~1 micro-batch per rank), since accumulation
#   pins a second ~700 GiB/node staging set on the host.
# - NIXL needs a working UCX (see scripts/install_nixl_from_source.sh and
#   docs/advanced.md). With a TCP-only UCX build, UCX_NET_DEVICES must not pin
#   IB devices or backend creation fails with NIXL_ERR_BACKEND.
# - If UV_PROJECT_ENVIRONMENT is node-local (e.g. /tmp/...), warm every node's
#   venv, e.g.:
#   [slurm] pre_run_command = "srun --ntasks-per-node=1 bash -c 'cd $PROJECT_DIR && uv sync --all-extras --all-packages --frozen'"
max_steps = 20
seq_len = 8192

[log]
level = "debug"

[wandb]
project = "glm5-debug"
name = "wordle-2p2d-4t"

[weight_broadcast]
type = "nccl"
port = 29502
timeout = 12000
quantize_in_weight_transfer = true

[deployment]
type = "multi_node"
num_train_nodes = 4
gpus_per_node = 8
num_infer_replicas = 1

[inference.deployment]
type = "disaggregated"
prefill_nodes_per_replica = 2
decode_nodes_per_replica = 2

prefill_env_vars = {"VLLM_ENABLE_MOE_DP_CHUNK"="0"}

[slurm]
job_name = "glm52-wordle-2p2d-4t"
partition = "cluster"

[trainer]
dist_timeout_seconds = 7200
enable_router_replay = true

[trainer.model]
name = "zai-org/GLM-5.2"
impl = "custom"
attn = "flash_attention_2"
fused_lm_head_token_chunk_size = 1024
cp = 1
ep = 8
optim_cpu_offload = true

[trainer.model.quantization]
type = "fp8"

[trainer.model.ac]
freq = 1

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.optim]
type = "sign_sgd"
lr = 1e-6

[orchestrator]
batch_size = 32
group_size = 8
max_off_policy_steps = 8

[orchestrator.model]
name = "zai-org/GLM-5.2-FP8"

[orchestrator.model.client]
wait_for_ready_timeout = 4200

[orchestrator.renderer]
name = "glm-5.1"
clear_thinking = false

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "wordle"

[orchestrator.train.source.env.taskset]
id = "wordle-v1"

[orchestrator.train.source.env.player.harness]
id = "null"

[orchestrator.train.source.env.player.runtime]
type = "subprocess"

[orchestrator.wandb.log_extras]
samples = true
interval = 1

[orchestrator.log]
vf_level = "debug"

[inference]
enable_return_routed_experts = true
enable_expert_parallel = true
gpu_memory_utilization = 0.75
enable_eplb = false
use_deep_gemm = true
enable_fp32_lm_head = true

[inference.env_vars]
VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER = "0"
VLLM_DEEP_GEMM_WARMUP = "skip"

[inference.model]
name = "zai-org/GLM-5.2-FP8"
max_model_len = 8192
tool_call_parser = "glm47"
reasoning_parser = "glm45"
