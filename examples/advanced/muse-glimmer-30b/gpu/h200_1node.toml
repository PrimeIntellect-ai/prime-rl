# H200 overlay for rl.toml: 1 trainer node and 1 one-node inference
# replica (inference not fitted yet). Trainer fit on fake 256k samples:
# 1 node, cp 8: 12.5k tok/s (1,569 per GPU), 52.2 GiB peak reserved.
#
#   uv run rl @ examples/advanced/muse-glimmer-30b/rl.toml @ examples/advanced/muse-glimmer-30b/gpu/h200_1node.toml @ examples/advanced/fake.toml

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1
# As many inference nodes as trainer nodes.
num_infer_replicas = 1

[trainer.model]
cp = 8

# 2 KV heads: TP above 2 makes several GPUs read the same heads. TP2 x DP4 decoded 2.8x faster per
# node than TP8 on math (see ../../README.md).
[inference.vllm]
tensor_parallel_size = 2
data_parallel_size = 4
