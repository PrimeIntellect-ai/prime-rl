# H200 overlay for rl.toml: 1 trainer node and one-node inference
# replicas (inference not fitted yet). Trainer fit on fake 256k samples:
# 1 node, cp 8: 12.5k tok/s (1,569 per GPU), 52.2 GiB peak reserved.
#
#   uv run rl @ examples/advanced/muse-glimmer-30b/rl.toml @ examples/advanced/muse-glimmer-30b/gpu/h200.toml @ examples/advanced/fake.toml

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[trainer.model]
cp = 8

[inference.vllm]
tensor_parallel_size = 8
