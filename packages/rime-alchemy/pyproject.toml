[project]
name = "rime-alchemy"
version = "0.1.0"
description = "Joint ACT/WRITE Alchemy stream environment for RIME experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
    "prime-rl-configs>=0.4.0",
    "verifiers>=0.4.1",
    "dm-alchemy==1.0.0",
    "dm-env-rpc==1.1.6",
    "numpy>=1.26.4,<3",
    "scipy>=1.11.4,<2",
    "protobuf>=4.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rime_study"]

[tool.hatch.build]
artifacts = ["src/rime_study/assets/**"]
