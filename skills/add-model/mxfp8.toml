# Optional overlay: online MXFP8 vLLM inference with a trainer quantized the same way (SM100+).
# Layer it on top of a base config:
#
#   uv run rl @ skills/add-model/rl-math.toml @ skills/add-model/mxfp8.toml
#
# Both sides quantize 1x32 blocks with power-of-two scales rounded up, so weights match bit for bit
# only if both sides quantize the same modules. Fill both ignore lists from the dtype table.

[inference.vllm]
dtype = "bfloat16"
quantization = "mxfp8"

# Modules vLLM must keep bf16 although its online method would quantize them. fnmatch globs on
# vLLM's module names, e.g. ["*.wo_a", "*.indexer.*"]. Leave empty if vLLM already keeps every
# trainer-ignored module bf16.
[inference.vllm.quantization_config]
ignore = []

# Routed experts in MXFP8, like vLLM's online MXFP8 MoE.
[trainer.model.moe.compute]
type = "mxfp8"

[trainer.model.moe.dispatch]
type = "torch"

# Dense linears in MXFP8. `ignore_patterns` replaces the defaults (regex, re.search on the trainer's
# module names), so keep the default list and append what vLLM keeps bf16 for this model.
[trainer.model.quantization]
type = "mxfp8"
recipe = "mxfp8_rceil_wgrad_with_hp"
ignore_patterns = [
    "lm_head",
    "router",
    'mlp\.gate\.',
    'shared_expert\.output_gate',
    "eh_proj",
    "weights_proj",
    "in_proj_a",
    "in_proj_b",
    # "<model-specific pattern>",
]
