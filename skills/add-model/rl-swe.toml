# Step 4: SWE ablation. scaleswe train, swebench-verified eval, 65k context, at most 30 turns,
# low reasoning effort when the model has one. Same minimal trainer as step 3 (sign-SGD, full CPU
# offload). Fill every `<...>` and every line marked FILL.
#
#   uv run rl @ skills/add-model/rl-swe.toml --dry-run --output-dir <scratch> --run.name check
#   uv run rl @ skills/add-model/rl-swe.toml

max_steps = 200 # FILL
seq_len = 65536

[model]
name = "<org>/<model>"

[monitors.wandb]
project = "swe-ablations"
group = "<model>-add-model"
name = "<model>-scaleswe-65k"

# FlashInfer autotuning runs on every replica startup. Its cache is keyed by the vLLM config, so it
# is safe on shared storage. Top-level so the sbatch exports it.
[env_vars]
VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR = "$HOME/.cache/vllm-flashinfer-autotune"

# Router replay rules out disaggregated prefill/decode: use independent replicas.
[deployment]
type = "multi_node"
num_train_nodes = 1 # FILL: same as step 3
num_infer_nodes = 1 # FILL: nodes per replica
num_infer_replicas = 1 # FILL

[slurm]
job_name = "<model>-swe"
partition = "<partition>"
# Clean up this run's orphaned sandboxes before launch; matches the runtime labels below.
pre_run_command = 'timeout 120 prime sandbox delete --label "<model>-swe" -y || true'

[weight_broadcast]
type = "nccl"
timeout = 3600

[ckpt]
interval = 50
keep_last = 1

[orchestrator]
batch_size = 64 # FILL: match the rollout throughput of the replicas
# Episodes span many trainer steps.
max_off_policy_steps = 32

[orchestrator.model.client]
# Must cover loading the checkpoint on every replica.
wait_for_ready_timeout = 7200

[orchestrator.train]
group_size = 16

[orchestrator.train.algo]
type = "grpo"

[orchestrator.train.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.0
num_input_tokens_weight = 0.1
num_turns_weight = 0.1

[orchestrator.renderer]
name = "auto" # FILL when `auto` does not resolve the model name
thinking_retention = "all"
# FILL: lowest effort the renderer supports, if its config has `reasoning_effort` (e.g. "low").
# reasoning_effort = "low"

[[orchestrator.train.source]]
name = "scaleswe"
env.taskset.id = "scaleswe"
env.agent.harness.id = "bash"
env.agent.max_turns = 30
env.agent.runtime.labels = ["<model>-swe"]

[orchestrator.eval]
interval = 50

[[orchestrator.eval.source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.max_turns = 30
env.agent.runtime.labels = ["<model>-swe"]
env.agent.timeout.rollout = 3600
group_size = 1

[trainer]
# MoE only. Also turns on `inference.vllm.enable_return_routed_experts`.
enable_router_replay = true
dist_timeout_seconds = 3600

[trainer.model]
cp = 4 # FILL: 65k / cp tokens per rank
ep = 8 # FILL: MoE only
offload = "full"
freeze_moe_router = false

[trainer.model.compile]

[trainer.model.ac]
freq = 1

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.optim]
type = "sign_sgd"
lr = 1e-6

[inference.vllm]
max_model_len = 65536
tensor_parallel_size = 8 # FILL
enable_expert_parallel = true # MoE only
gpu_memory_utilization = 0.8 # FILL: leave headroom for the NCCL weight-receive buffer
# Eval goes through chat completions, so both parsers must resolve. `auto` matches on the model
# name; set them explicitly for re-exports under another org.
# tool_call_parser = "<parser>"
# reasoning_parser = "<parser>"
