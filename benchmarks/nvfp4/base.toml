# NVFP4 recipe ablations: math RL on Qwen3-30B-A3B (128 experts), one 8-GPU Blackwell node (B200/B300).
# Trainer on 4 GPUs (EP 4), one engine on 4 GPUs (DP 4 x EP 4). Layer one variant on top:
#   uv run rl @ benchmarks/nvfp4/base.toml @ benchmarks/nvfp4/<variant>.toml --output-dir outputs/nvfp4-<variant>
max_steps = 200
seq_len = 16384

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[monitors.file]

[weight_broadcast]
type = "filesystem"

[trainer.model]
ep = 4

[trainer.model.ac]

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 256
max_staleness = 2

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 8192

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference.vllm]
data_parallel_size = 4
enable_expert_parallel = true
max_model_len = 16384
gpu_memory_utilization = 0.85
