# Profiling base config: GLM-4.5 SFT, reduced depth, EP=8 on 8 GPUs.
# The full GLM-4.5 checkpoint (~700GB) does not fit on local disk, so weights are
# randomly initialized with forced balanced routing to avoid skewed expert load.
# seq_len, quantization, output_dir and trace_path are set per run by the campaign runner.

max_steps = 8        # steps 0..8: 2 skipped (compile/warmup) + 1 profiler warmup + 6 recorded
trace_skip_steps = 2
trace_ranks = [0]
dist_timeout_seconds = 600  # short benchmark steps; don't let a single-rank crash stall the sweep for an hour

[model]
name = "zai-org/GLM-4.5"
ep = 8

[model.debug]
num_layers = 12      # reduced depth (full model: 92); keeps the 3 leading dense layers + 9 MoE layers
random_init = true
force_balanced_routing = true

[tokenizer]
name = "zai-org/GLM-4.5-Air"  # same tokenizer family; GLM-4.5 itself has no registered typed renderer

[data]
type = "sft"
name = "allenai/tulu-3-sft-mixture"
batch_size = 8
micro_batch_size = 1
seq_len = 8192

[deployment]
num_gpus = 8
