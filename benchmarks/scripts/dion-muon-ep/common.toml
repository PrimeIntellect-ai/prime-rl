# Shared settings for the Dion Muon EP local-expert A/B on DeepSeek V4 Flash SFT.
# Combine with one of p1.toml, p2.toml, f8.toml: uv run sft @ common.toml @ <cell>.toml

dist_timeout_seconds = 14400
max_steps = 20

[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
ep = 8
compile = "None"
ac_offloading = "None"
optim_cpu_offload = false
fsdp_cpu_offload = false

[model.moe.dispatch]
type = "torch"

[model.ac]
freq = 1

# The bf16 re-upload has no registered renderer; it shares the original model's template.
[renderer]
name = "deepseek-v4"

[data]
name = "PrimeIntellect/Reverse-Text-SFT"

[optim]
type = "muon"
lr = 1e-5
