max_steps = 20

[model]
name = "MODELS_DIR/zai-org--GLM-5"
ep = 4
cp = 2
debug.num_layers = 4

[renderer]
name = "glm-5"

[data]
shuffle = true
seed = 0
batch_size = 8
micro_batch_size = 1
seq_len = 8192

[[data.source]]
name = "chat"
dataset = "DATA_DIR/INTELLECT-3-SFT-10K"
split = "chat"

[[data.source]]
name = "if"
dataset = "DATA_DIR/INTELLECT-3-SFT-10K"
split = "if"

[gc]
interval = 1
