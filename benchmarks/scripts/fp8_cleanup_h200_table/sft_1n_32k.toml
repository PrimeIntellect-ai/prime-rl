# H200-reference shape on one node: 6-layer DSv4 Flash, seq_len 32768, cp 1, ep 8, full AC. Compose with sft_fp8.toml.
max_steps = 15
dist_timeout_seconds = 3600

[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
ep = 8
cp = 1
optim_cpu_offload = false
ac_offloading = "None"

[model.debug]
num_layers = 6

[model.moe.dispatch]
type = "torch"

[model.ac]
mode = "full"
freq = 1

[data]
type = "fake"
input_ids = "random"
seq_len = 32768
batch_size = 8

[scheduler]
type = "constant"

[deployment]
type = "single_node"
num_train_gpus = 8
