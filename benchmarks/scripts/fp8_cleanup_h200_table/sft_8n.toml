# H200 8-node shape: full-depth DSv4 Flash, seq_len 131072, cp 8, ep 8, balanced routing, full AC, 16k tokens per GPU.
# bf16 by default; compose with sft_fp8.toml for the FP8 arm.

max_steps = 20
dist_timeout_seconds = 14400

[monitors.wandb]
entity = "primeintellect"
project = "deepseek-v4-flash"
group = "fp8-cleanup-h200-table"

[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
ep = 8
cp = 8
optim_cpu_offload = false
ac_offloading = "None"

[model.debug]
force_balanced_routing = true

# DeepEP dies in the activation-checkpoint recompute at full depth.
[model.moe.dispatch]
type = "torch"

[model.ac]
mode = "full"
freq = 1

[data]
type = "fake"
input_ids = "random"
seq_len = 131072
batch_size = 8

[scheduler]
type = "constant"

[deployment]
type = "multi_node"
num_train_nodes = 8

[slurm]
job_name = "fp8table-8n"
partition = "all"
time = "01:00:00"
