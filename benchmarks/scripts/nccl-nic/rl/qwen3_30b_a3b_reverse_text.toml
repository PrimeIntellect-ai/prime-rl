max_steps = 20
seq_len = 2048
dashboard = false

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[weight_broadcast]
type = "nccl"

[deployment]
type = "multi_node"
num_train_nodes = 1
num_infer_nodes = 1

[slurm]
job_name = "nccl-nic-rl-ab"

[monitors]
prime = "None"

[monitors.file]

[trainer.model]
attn = "flash_attention_3"
ep = 8
offload = "none"
ac_offloading = "None"

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 3e-6

[orchestrator]
batch_size = 128

[orchestrator.concurrency]
max_inflight = 128

[orchestrator.train]
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference]

[inference.vllm]
tensor_parallel_size = 2
max_model_len = 2048
gpu_memory_utilization = 0.85
seed = 0
