max_steps = 20
dashboard = false

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"
attn = "flash_attention_3"
ep = 8
offload = "none"
ac_offloading = "None"

[model.ac]
freq = 1

[model.debug]
force_balanced_routing = true

[data]
type = "fake"
batch_size = 32
micro_batch_size = 1
seq_len = 16384
seed = 0

[optim]
type = "adamw"
lr = 1e-5
weight_decay = 0.01

[scheduler]
type = "constant"

[monitors]
prime = "None"

[deployment]
type = "multi_node"
num_train_nodes = 2

[slurm]
job_name = "nccl-nic-trainer-ab"
