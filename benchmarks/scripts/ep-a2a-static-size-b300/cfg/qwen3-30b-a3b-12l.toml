# PR 4205 workload 2: Qwen3-30B-A3B truncated to 12 layers, ep 8, fake data, balanced routing, full AC, default compile.
max_steps = 20
clean = true
dashboard = false

[env_vars]
HF_HOME = "/home/huggingface"

[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"
ep = 8
offload = "none"
ac_offloading = "None"

[model.ac]
mode = "full"
freq = 1

[model.debug]
num_layers = 12
force_balanced_routing = true

[data]
type = "fake"
length = "fixed"
batch_size = 16
micro_batch_size = 1
seq_len = 16384
pad_to_seq_len = true

[optim]
type = "adamw"
lr = 1e-5
weight_decay = 0.01

[deployment]
type = "single_node"
num_train_gpus = 8
