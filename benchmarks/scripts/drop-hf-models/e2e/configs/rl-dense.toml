max_steps = 20
seq_len = 2048

[deployment]
type = "single_node"
num_train_gpus = 4
num_infer_gpus = 4

[weight_broadcast]
type = "nccl"

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[trainer.model]
offload = "none"
ac_offloading = "None"

[trainer.optim]
lr = 3e-6

[orchestrator]
batch_size = 128

[orchestrator.train]
group_size = 16

[orchestrator.concurrency]
max_inflight = 128

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.renderer]
name = "prime-qwen3"

[inference]

[inference.vllm]
seed = 0
data_parallel_size = 4
