max_steps = 20

[model]
name = "zai-org/GLM-4.5-Air"
attn = "flash_attention_3"
offload = "none"
ac_offloading = "None"
cp = 1
ep = 8

[model.debug]
num_layers = 4

[renderer]
name = "glm-4.5"

[data]
seed = 0
batch_size = 16
micro_batch_size = 1
seq_len = 16384

[[data.source]]
name = "math"
dataset = "PrimeIntellect/INTELLECT-3-SFT-10K"
split = "math"

[optim]
lr = 1e-5

[deployment]
type = "single_node"
num_train_gpus = 8
