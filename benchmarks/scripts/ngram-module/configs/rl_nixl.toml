max_steps = 20
seq_len = 2048
dashboard = false

[run]
name = "rl-nixl"

[model]
name = "/home/garrett/tmp/ngram-module/e2e2/node-b/ckpt/qwen38-synth-vl-vllm"

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[weight_broadcast]
type = "nixl"

[trainer.model]
ep = 4
offload = "none"
ac_offloading = "None"

[trainer.model.compile]
fullgraph = false

[trainer.optim]
lr = 1e-3

[orchestrator]
batch_size = 128
max_staleness = 0

[orchestrator.train]
group_size = 16

[orchestrator.train.algo]
type = "debug"

[orchestrator.concurrency]
max_inflight = 128

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.renderer]
name = "qwen3.8"
enable_thinking = false

[inference.vllm]
max_model_len = 2048
gpu_memory_utilization = 0.5
mamba_cache_dtype = "float32"

[monitors]
prime = "None"
