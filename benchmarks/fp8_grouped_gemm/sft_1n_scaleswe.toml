# One-node profiling analog of sft_scaleswe.toml: 6 layers, seq_len 262144, cp 8, ep 8, SAC, balanced routing,
# real variable-length scaleswe data (packed per row). Needs HF_TOKEN (private dataset) and #3544's tool-call fix
# (c7ba105d5). max_steps stays below 10 so it can be traced:
#
#   uv run sft @ benchmarks/fp8_grouped_gemm/sft_1n_scaleswe.toml --run.name <name> --trace-path <dir>

max_steps = 8
dist_timeout_seconds = 3600

[monitors.wandb]
entity = "primeintellect"
project = "deepseek-v4-flash"
group = "ds-v4-attn-dynamism-profile"

[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
impl = "custom"
ep = 8
cp = 8
optim_cpu_offload = false
ac_offloading = "None"

[model.debug]
num_layers = 6
force_balanced_routing = true

[model.moe.dispatch]
type = "torch"

[model.ac]
mode = "selective"
freq = 1
targets = [
  "prime_rl::dsv4_sparse_attn",
  "prime_rl_collectives::all_to_all_single_equal",
  "aten::sort.stable",
]

[renderer]
name = "deepseek-v4"
enable_thinking = true

[data]
name = "PrimeIntellect/SyntheticData-GLM5.2-scaleswe-reward0-rlm-filtered"
splits = ["train"]
seq_len = 262144
batch_size = 1

[scheduler]
type = "constant"

[deployment]
type = "single_node"
num_train_gpus = 8

[slurm]
job_name = "dsv4-sft-profile-scaleswe"
partition = "all"
