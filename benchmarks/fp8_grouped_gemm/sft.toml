# End-to-end SFT benchmark for DeepSeek V4 Flash on 8 nodes with fake data and balanced routing.
# bf16 by default; compose with sft_fp8.toml for the FP8 arm:
#
#   uv run sft @ benchmarks/fp8_grouped_gemm/sft.toml --run.name <name>
#   uv run sft @ benchmarks/fp8_grouped_gemm/sft.toml @ benchmarks/fp8_grouped_gemm/sft_fp8.toml --run.name <name>

max_steps = 20
dist_timeout_seconds = 14400

[monitors.wandb]
entity = "primeintellect"
project = "deepseek-v4-flash"
group = "fp8-cleanup-e2e-sft"

[model]
name = "PrimeIntellect/DeepSeek-V4-Flash-0731-bf16"
impl = "custom"
ep = 8
cp = 8
optim_cpu_offload = false
ac_offloading = "None"

[model.debug]
force_balanced_routing = true

# DeepEP dies in the activation-checkpoint recompute at full depth.
[model.moe.dispatch]
type = "torch"

[model.ac]
mode = "selective"
freq = 1
targets = [
  "prime_rl::dsv4_sparse_attn",
  "prime_rl_collectives::all_to_all_single_equal",
  "aten::sort.stable",
]

[data]
type = "fake"
input_ids = "random"
seq_len = 262144
batch_size = 8

[scheduler]
type = "constant"

[deployment]
type = "multi_node"
num_train_nodes = 8

[slurm]
job_name = "dsv4-sft-bench"
partition = "all"
