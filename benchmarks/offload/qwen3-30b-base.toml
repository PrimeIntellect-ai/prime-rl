# Qwen3-30B-A3B optimizer-offload baseline on one 8-GPU node (see handover.md).
# Fake fixed-length data, random weights, forced balanced routing, EP8, AdamW,
# no clipping, compile and quantization disabled.
#
# Run alone for the no-offload reference, or compose with one overlay:
#   uv run sft @ benchmarks/offload/qwen3-30b-base.toml
#   uv run sft @ benchmarks/offload/qwen3-30b-base.toml @ benchmarks/offload/state-offload.toml
#   uv run sft @ benchmarks/offload/qwen3-30b-base.toml @ benchmarks/offload/full-torch.toml
#   uv run sft @ benchmarks/offload/qwen3-30b-base.toml @ benchmarks/offload/full-native.toml
#
# Report median and p95 over steps 3-7 (two warm-up steps). Sweep sequence
# length via --data.seq-len and accumulation via --data.batch-size (global;
# dp = 8, so batch_size 16 -> accumulation 2, 64 -> accumulation 8).
max_steps = 7

[deployment]
num_gpus = 8

[model]
name = "Qwen/Qwen3-30B-A3B"
impl = "custom"
ep = 8
compile = "None"

[model.debug]
random_init = true
force_balanced_routing = true

[data]
type = "fake"
length = "fixed"
batch_size = 8
micro_batch_size = 1
seq_len = 8192

[optim]
type = "adamw"
max_norm = "None"
