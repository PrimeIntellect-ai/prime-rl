# Runtime benchmark: e2b sandboxes. Needs E2B_API_KEY and a plan whose sandbox
# lifetime covers `runtime.timeout` (Pro: 24 h) at the run's concurrency. The first
# sandbox on each task image builds an E2B template from it (about a minute each).
#
#   uv run eval @ benchmarks/runtimes/e2b.toml --run.name runtime-bench-e2b

model = "deepseek/deepseek-v4.1-flash"

[concurrency]
min_inflight = 1000
max_inflight = 1000

# Terminal-Bench 2 at avg@4 (89 tasks x 4)
[[source]]
name = "tb2"
group_size = 4
env.taskset.id = "terminal-bench-2"
env.agent.harness.id = "bash"
env.agent.runtime.type = "e2b"
env.agent.runtime.timeout = 7200
env.agent.timeout.rollout = 3600
env.agent.retries.max_retries = 2
# Sandbox failures are a result of this benchmark, so only provider errors retry.
env.agent.retries.include = ["ProviderError"]

