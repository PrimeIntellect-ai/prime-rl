# Runtime benchmark: modal sandboxes. Needs a Modal token (`modal token new`, or
# MODAL_TOKEN_ID / MODAL_TOKEN_SECRET) in the eval process' environment.
#
#   uv run eval @ benchmarks/runtimes/modal.toml --run.name runtime-bench-modal

model = "deepseek/deepseek-v4.1-flash"

[concurrency]
min_inflight = 1000
max_inflight = 1000

# Terminal-Bench 2 at avg@4 (89 tasks x 4)
[[source]]
name = "tb2"
group_size = 4
env.taskset.id = "terminal-bench-2"
env.agent.harness.id = "bash"
env.agent.runtime.type = "modal"
env.agent.timeout.rollout = 3600
env.agent.retries.max_retries = 2
# Sandbox failures are a result of this benchmark, so only provider errors retry.
env.agent.retries.include = ["ProviderError"]

# SWE-bench Verified at avg@1 (500 tasks)
[[source]]
name = "swebench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.runtime.type = "modal"
env.agent.timeout.rollout = 3600
env.agent.retries.max_retries = 2
# Sandbox failures are a result of this benchmark, so only provider errors retry.
env.agent.retries.include = ["ProviderError"]

# SWE-bench Pro at avg@1 (731 tasks)
[[source]]
